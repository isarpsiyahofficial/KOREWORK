name: PremiumPlusCombo v4.8.4 Release Candidate
on:
  workflow_dispatch:
  push:
    branches: [premium-plus-combo-cure-attack-vitals-ws]
    paths: ['.github/workflows/premium-plus-combo-v484-release.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x64}
      - name: Reconstruct source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force premium_plus_combo_final/v484-release | Out-Null
          @'
          import base64,gzip,pathlib,hashlib,subprocess
          r=pathlib.Path('premium_plus_combo_final');o=r/'v484-release';src=r/'source'/'vnext_48';m=o/'main.cpp'
          cs=sorted((r/'source'/'vnext_47').glob('c*.txt'));m.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in cs))))
          for n,s in [('v47_to_v48.patch.gz.b64',0),('v48_observer_fix2.patch.gz.b64',0),('v481_to_v482.patch.gz.b64',1),('v482_to_v4821.patch.gz.b64',1),('v4821_to_v4822.patch.gz.b64',1)]:
            p=o/(n+'.patch');p.write_bytes(gzip.decompress(base64.b64decode((src/n).read_text().strip())));subprocess.run(['git','apply',f'-p{s}',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          pcs=sorted(src.glob('v483_final_c*.txt'));assert len(pcs)==4;p=o/'v483.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='56a57c7a65f5a091be9298f3388c82c4c4097392f96a17bd932e26dd00fcc839';ref=m.read_bytes()
          pcs=sorted(src.glob('v483_to_v484_[0-9][0-9].b64'));assert len(pcs)==2;p=o/'v484.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='3a2dd16737d825deab01de7af55b1a3ccd81476aad2a4b472d7aaeb1ad07ff0f'
          a=ref.decode();b=m.read_text()
          def fn(s,k):
            p=s.index(k);q=s.index('{',p);d=0
            for i in range(q,len(s)):
              if s[i]=='{':d+=1
              elif s[i]=='}':
                d-=1
                if d==0:return s[p:i+1]
          for k in ['void CureWorker','void MinorWorker','void RWorker','UINT ReferenceSendInputsUnlocked','bool ReferenceTapKeyUnlocked']:
            assert fn(a,k)==fn(b,k),k
          assert 'std::array<int,4> skillDelayMs{1,1,1,1};' in b and 'void WsWorker()' in b
          print('PRESERVATION=PASS')
          '@ | python -
          if($LASTEXITCODE){throw 'source/audit failed'}
      - name: Build final x64 with preserved elevation manifest
        shell: pwsh
        working-directory: premium_plus_combo_final/v484-release
        run: |
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="4.8.4.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"/><description>Premium Plus Combo - Rogue</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content final.manifest -Encoding UTF8
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp /Fe:PremiumPlusCombo-Test.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT;if($LASTEXITCODE){throw 'test build failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp /Fe:PremiumPlusCombo.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO;if($LASTEXITCODE){throw 'final build failed'}
          mt.exe -manifest final.manifest "-outputresource:PremiumPlusCombo.exe;#1";if($LASTEXITCODE){throw 'manifest failed'}
          mt.exe "-inputresource:PremiumPlusCombo.exe;#1" -out:embedded.manifest
          if((Get-Content embedded.manifest -Raw) -notmatch 'requireAdministrator'){throw 'elevation manifest missing'}
      - name: Regression tests
        shell: pwsh
        working-directory: premium_plus_combo_final/v484-release
        run: |
          foreach($arg in @('--self-test','--transport-observer-test','--attack-observer-test','--attack-z-off-observer-test','--cure-observer-test')){$p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList $arg -Wait -PassThru;if($p.ExitCode){throw "$arg failed"}}
          $s=Get-Content self-test-report.txt -Raw;if($s -notmatch 'PASSED=172' -or $s -notmatch 'SkillDefaults_1=PASS'){throw 'self test mismatch'}
          $a=Get-Content attack-observer-report.txt -Raw;foreach($x in @('RoundRobin=PASS','BarAssertion=PASS','WSNonBlocking=PASS','NoWSBacklog=PASS','WSTiming=PASS','Overlap=0','RESULT=PASS')){if($a -notmatch $x){throw "attack $x"}}
          $span=[int](($a -split "`n"|?{$_ -like 'FastAttackSpanMs=*'}) -replace 'FastAttackSpanMs=','');if($span -ge 420){throw "attack slow $span"}
          $z=Get-Content attack-z-off-observer-report.txt -Raw;if($z -notmatch 'Z_Down=0' -or $z -notmatch 'RESULT=PASS'){throw 'z-off regression'}
          $c=Get-Content cure-observer-report.txt -Raw;if($c -notmatch 'F2_Down=1' -or $c -notmatch '6_Down=1' -or $c -notmatch 'F1_Down=1' -or $c -notmatch 'Overlap=0' -or $c -notmatch 'RESULT=PASS'){throw 'cure regression'}
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe";if(Test-Path $mp){& $mp -Scan -ScanType 3 -File (Resolve-Path .\PremiumPlusCombo.exe) -DisableRemediation;if($LASTEXITCODE){throw 'Defender scan failed'}}
          $sha=(Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash
          @"
          Version=4.8.4.0
          SourceSHA256=3A2DD16737D825DEAB01DE7AF55B1A3CCD81476AAD2A4B472D7AAEB1AD07FF0F
          ReferenceV483=56A57C7A65F5A091BE9298F3388C82C4C4097392F96A17BD932E26DD00FCC839
          ExistingStructurePreserved=PASS
          RequireAdministratorManifest=PASS
          CurePreserved=PASS
          MinorPreserved=PASS
          SkillDefaultMs=1
          WSSchedulerNonBlocking=PASS
          FastAttackSpanMs=$span
          SelfTest=172/172 PASS
          EXESHA256=$sha
          "@ | Set-Content BUILD-INFO.txt
          Get-Content BUILD-INFO.txt
          Get-Content attack-observer-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-v4.8.4-ATTACK-SPEED-FINAL
          path: |
            premium_plus_combo_final/v484-release/PremiumPlusCombo.exe
            premium_plus_combo_final/v484-release/main.cpp
            premium_plus_combo_final/v484-release/BUILD-INFO.txt
            premium_plus_combo_final/v484-release/self-test-report.txt
            premium_plus_combo_final/v484-release/transport-observer-report.txt
            premium_plus_combo_final/v484-release/attack-observer-report.txt
            premium_plus_combo_final/v484-release/attack-z-off-observer-report.txt
            premium_plus_combo_final/v484-release/cure-observer-report.txt
            premium_plus_combo_final/v484-release/embedded.manifest
          retention-days: 14
