name: PremiumPlusCombo v4.6 Candidate Package
on:
  workflow_dispatch:
  push:
    branches: [premium-plus-combo-cure-attack-vitals-ws]
    paths:
      - 'premium_plus_combo_final/source/vnext_46/**'
      - '.github/workflows/premium-plus-combo-vnext-package.yml'
permissions:
  contents: read
jobs:
  validate-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Reconstruct exact preserved baseline and vNext
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force premium_plus_combo_final/candidate-build | Out-Null
          @'
          import base64,gzip,pathlib,hashlib,importlib.util
          root=pathlib.Path('premium_plus_combo_final')
          p=root/'source'/'timed_exact'
          raw=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in sorted(p.glob('part*.txt')))))
          if hashlib.sha256(raw).hexdigest()!='d522959ea955ef788af1df00dfff2dd30bd8566fcbb728823ed39de542d19535': raise SystemExit('baseline source SHA mismatch')
          cur=root/'candidate-build'/'baseline-working.cpp'; cur.write_bytes(raw)
          spec=importlib.util.spec_from_file_location('delta',root/'source'/'apply_fifo_delta.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); m.apply_delta(cur,cur)
          cursha=hashlib.sha256(cur.read_bytes()).hexdigest()
          if cursha!='08bb8807b2aa2e3cf416cc8ff417ebbb245bde3128cffe4faf2b7349d82fc8db': raise SystemExit('working source SHA mismatch')
          q=root/'source'/'vnext_46'; parts=sorted(q.glob('c*.txt'))
          if len(parts)!=8: raise SystemExit(f'expected 8 vnext chunks got {len(parts)}')
          nxt=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in parts)))
          nxtsha=hashlib.sha256(nxt).hexdigest()
          if nxtsha!='9a672664e72b09d820fe98b51b0f277bb4c0a267b6b7ad0e5bd7937e9e4837e9': raise SystemExit('vnext source SHA mismatch')
          (root/'candidate-build'/'main.cpp').write_bytes(nxt)
          print('WorkingSourceSHA256='+cursha.upper())
          print('VNextSourceSHA256='+nxtsha.upper())
          '@ | python -
          if($LASTEXITCODE){throw 'reconstruction failed'}

      - name: Preservation and requested-feature audit
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          cur=Path('premium_plus_combo_final/candidate-build/baseline-working.cpp').read_text(encoding='utf-8')
          nxt=Path('premium_plus_combo_final/candidate-build/main.cpp').read_text(encoding='utf-8')
          def block(s,a,b): return s[s.index(a):s.index(b,s.index(a))]
          preserved=[
            ('RogueSettings','struct RogueSettings {','struct AttackSettings {'),
            ('BridgeAndFifoTransport','bool InitBridge(){','void SendRoutedKey('),
            ('MinorWorker','void MinorWorker(){','void RWorker(){'),
            ('RWorker','void RWorker(){','void CureWorker(){'),
            ('RogueUiReader','void ReadRogueUi(','void ReadAttackUi('),
            ('RoguePage','void CreateRoguePage(){','void CreateAttackPage(){'),
            ('ChromeAndDrawing','void LayoutChrome(){','LRESULT CALLBACK WndProc('),
          ]
          for name,a,b in preserved:
              if block(cur,a,b)!=block(nxt,a,b): raise SystemExit(name+' changed unexpectedly')
              print(name+'=PASS')
          required={
            'CureEvent':'HANDLE g_cureEvent{}',
            'CureSignal':'SetEvent(g_cureEvent)',
            'CureWait':'WaitForSingleObject(g_cureEvent,50)',
            'AttackLoop1ms':'ClampD(ReadDword(k,L"DelayMs",125),1,2000)',
            'AttackStartRefresh':'ReadAttackUi(true);g_attackActive=true',
            'PerSkillMs':'std::array<int,4> skillDelayMs{1,1,1,1}',
            'PerSkillRegistry':'Skill%dMs',
            'WCombo':'WCombo',
            'SCombo':'SCombo',
            'HPMPDetector':'EstimateTypedBarFill',
            'HPScan':'CapturePercent(a.hpRect,true)',
            'MPScan':'CapturePercent(a.mpRect,false)',
            'WControl':'IDC_ATTACK_W_COMBO',
            'SControl':'IDC_ATTACK_S_COMBO',
            'WTap':"ReferenceTapKeyUnlocked('W')",
            'STap':"ReferenceTapKeyUnlocked('S')",
            'ScanCode':'KEYEVENTF_SCANCODE',
            'QPC':'QueryPerformanceCounter',
            'MapVK':'MapVirtualKey',
            'TransportObserver':'--transport-observer-test',
            'AttackObserver':'--attack-observer-test',
            'CureObserver':'--cure-observer-test',
          }
          for name,x in required.items():
              if x not in nxt: raise SystemExit('missing '+name)
              print(name+'=PASS')
          if 'ClampD(ReadDword(k,L"DelayMs",125),35,2000)' in nxt: raise SystemExit('old 35ms attack clamp remains')
          # Verify attack page carries all four skill rows, four per-skill ms edits, and W/S controls.
          ap=block(nxt,'void CreateAttackPage(){','void LayoutAttackPage(')
          for x in ['IDC_ATTACK_SKILL1','IDC_ATTACK_SKILL2','IDC_ATTACK_SKILL3','IDC_ATTACK_SKILL4','IDC_ATTACK_SKILL1_MS','IDC_ATTACK_SKILL2_MS','IDC_ATTACK_SKILL3_MS','IDC_ATTACK_SKILL4_MS','IDC_ATTACK_W_COMBO','IDC_ATTACK_S_COMBO']:
              if x not in ap: raise SystemExit('attack UI missing '+x)
          print('AttackUIStatic=PASS')
          print('FeatureAudit=PASS')
          '@ | python -
          if($LASTEXITCODE){throw 'audit failed'}

      - name: Create resources and manifests
        shell: pwsh
        working-directory: premium_plus_combo_final/candidate-build
        run: |
          @'
          #include <windows.h>
          1 VERSIONINFO
           FILEVERSION 4,6,0,0
           PRODUCTVERSION 4,6,0,0
           FILEFLAGSMASK 0x3fL
           FILEFLAGS 0
           FILEOS 0x40004L
           FILETYPE 0x1L
          BEGIN
           BLOCK "StringFileInfo"
           BEGIN
            BLOCK "041F04E6"
            BEGIN
             VALUE "FileDescription", "Premium Plus Combo - Rogue / Attack\0"
             VALUE "FileVersion", "4.6.0.0\0"
             VALUE "ProductName", "Premium Plus Combo\0"
             VALUE "ProductVersion", "4.6.0.0\0"
            END
           END
           BLOCK "VarFileInfo"
           BEGIN
            VALUE "Translation", 0x041F, 1254
           END
          END
          '@ | Set-Content app.rc -Encoding Ascii
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <assemblyIdentity version="1.0.0.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"/>
            <description>Premium Plus Combo - Rogue</description>
            <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo>
            <application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application>
          </assembly>
          '@ | Set-Content final.manifest -Encoding UTF8

      - name: Build native x64
        shell: pwsh
        working-directory: premium_plus_combo_final/candidate-build
        run: |
          rc /nologo app.rc
          if($LASTEXITCODE){throw 'rc failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo-Test.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFESTUAC:"level='asInvoker' uiAccess='false'"
          if($LASTEXITCODE){throw 'test build failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO
          if($LASTEXITCODE){throw 'final build failed'}
          mt.exe -manifest final.manifest "-outputresource:PremiumPlusCombo.exe;#1"
          if($LASTEXITCODE){throw 'manifest embed failed'}

      - name: Full logic and transport regression suite
        shell: pwsh
        working-directory: premium_plus_combo_final/candidate-build
        run: |
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--self-test' -Wait -PassThru
          if($p.ExitCode){Get-Content self-test-report.txt;throw "self-test exit $($p.ExitCode)"}
          $r=Get-Content self-test-report.txt -Raw
          foreach($n in @('TOTAL=153','PASSED=153','AttackWSAlternation=PASS','AttackLoopAllows1ms=PASS','SkillDelayAllows1ms=PASS','TypedHP_20=PASS','TypedHP_100=PASS','TypedMP_20=PASS','TypedMP_100=PASS','MinorReferenceSequenceModel=PASS','ScanCodeTransport=PASS')){if($r -notmatch [regex]::Escape($n)){Get-Content self-test-report.txt;throw "missing $n"}}
          if($r -match '=FAIL'){Get-Content self-test-report.txt;throw 'self-test failure'}
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--transport-observer-test' -Wait -PassThru
          if($p.ExitCode){Get-Content transport-observer-report.txt;throw 'transport observer failed'}
          $r=Get-Content transport-observer-report.txt -Raw; Get-Content transport-observer-report.txt
          foreach($n in @('ObserverReady=PASS','8_Down=24','9_Down=24','0_Down=24','R_Down=24','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($n)){throw "transport missing $n"}}
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--attack-observer-test' -Wait -PassThru
          if($p.ExitCode){Get-Content attack-observer-report.txt;throw 'attack observer failed'}
          $r=Get-Content attack-observer-report.txt -Raw; Get-Content attack-observer-report.txt
          foreach($n in @('ObserverReady=PASS','Z_Down=1','W_Down=2','S_Down=2','Skill2_Down=1','Skill3_Down=1','Skill4_Down=1','Skill5_Down=1','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($n)){throw "attack missing $n"}}
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--cure-observer-test' -Wait -PassThru
          if($p.ExitCode){Get-Content cure-observer-report.txt;throw 'cure observer failed'}
          $r=Get-Content cure-observer-report.txt -Raw; Get-Content cure-observer-report.txt
          foreach($n in @('ObserverReady=PASS','F2_Down=1','6_Down=1','F1_Down=1','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($n)){throw "cure missing $n"}}
          if($r -notmatch 'LatencyMs=(\d+)'){throw 'cure latency missing'}
          if([int]$Matches[1] -ge 250){throw "cure latency too high $($Matches[1])ms"}

      - name: PE hardening imports and Defender
        shell: pwsh
        working-directory: premium_plus_combo_final/candidate-build
        run: |
          mt.exe "-inputresource:PremiumPlusCombo.exe;#1" -out:embedded.manifest
          if($LASTEXITCODE){throw 'manifest extract failed'}
          dumpbin /headers PremiumPlusCombo.exe | Set-Content headers.txt
          dumpbin /imports PremiumPlusCombo.exe | Set-Content imports.txt
          $h=Get-Content headers.txt -Raw;$i=Get-Content imports.txt -Raw
          if($h -notmatch 'machine \(x64\)'){throw 'not x64'}
          if($h -match 'E0000060'){throw 'RWX section found'}
          foreach($b in @('WINHTTP.dll','WININET.dll','WS2_32.dll','VCRUNTIME140.dll','MSVCP140.dll')){if($i -match [regex]::Escape($b)){throw "unexpected import $b"}}
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if(-not(Test-Path $mp)){$mp=Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory|Sort-Object Name -Descending|%{Join-Path $_.FullName 'MpCmdRun.exe'}|?{Test-Path $_}|Select-Object -First 1}
          if(-not $mp){throw 'Defender unavailable'}
          & $mp -Scan -ScanType 3 -File (Resolve-Path .\PremiumPlusCombo.exe) -DisableRemediation
          if($LASTEXITCODE){throw "Defender exit $LASTEXITCODE"}
          'DefenderScan=PASS'|Set-Content defender-scan.txt

      - name: Build report
        shell: pwsh
        working-directory: premium_plus_combo_final/candidate-build
        run: |
          $sha=(Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash
          $src=(Get-FileHash main.cpp -Algorithm SHA256).Hash
          $size=(Get-Item PremiumPlusCombo.exe).Length
          $cure=(Get-Content cure-observer-report.txt|Where-Object{$_ -like 'LatencyMs=*'})
          @"
          Product=PremiumPlusCombo
          Version=4.6.0.0
          SourceSHA256=$src
          WorkingBaselineSourceSHA256=08BB8807B2AA2E3CF416CC8FF417EBBB245BDE3128CFFE4FAF2B7349D82FC8DB
          RequestedFeatureSourceSHA256=9A672664E72B09D820FE98B51B0F277BB4C0A267B6B7AD0E5BD7937E9E4837E9
          WorkingStructurePreservation=PASS
          FIFOScanCodeTransport=PASS
          TransportObserverOverlap=0
          CureFirstTriggerObserver=PASS
          $cure
          AttackFastZPath=PASS
          AttackFourSkills=PASS
          PerSkillMS=PASS
          WCombo=PASS
          SCombo=PASS
          TypedHPBarDetector=PASS
          TypedMPBarDetector=PASS
          SelfTest=153/153 PASS
          AttackUIStatic=PASS
          HeadlessLiveGUIProbe=NOT_USED_GITHUB_RUNNER_DESKTOP_LIMITATION
          DefenderScan=PASS
          EXESHA256=$sha
          Size=$size
          RealGameVerification=USER_SIDE_REQUIRED
          "@ | Set-Content BUILD-INFO.txt
          Get-Content BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-v4.6-CURE-ATTACK-VITALS-WS-CANDIDATE
          path: |
            premium_plus_combo_final/candidate-build/PremiumPlusCombo.exe
            premium_plus_combo_final/candidate-build/main.cpp
            premium_plus_combo_final/candidate-build/BUILD-INFO.txt
            premium_plus_combo_final/candidate-build/self-test-report.txt
            premium_plus_combo_final/candidate-build/transport-observer-report.txt
            premium_plus_combo_final/candidate-build/attack-observer-report.txt
            premium_plus_combo_final/candidate-build/cure-observer-report.txt
            premium_plus_combo_final/candidate-build/defender-scan.txt
            premium_plus_combo_final/candidate-build/embedded.manifest
            premium_plus_combo_final/candidate-build/imports.txt
            premium_plus_combo_final/candidate-build/headers.txt
          retention-days: 14