name: PremiumPlusCombo v4.8.4 Attack Speed Candidate v2
on:
  workflow_dispatch:
  push:
    branches: [premium-plus-combo-cure-attack-vitals-ws]
    paths:
      - '.github/workflows/premium-plus-combo-v484-speed-v2.yml'
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Reconstruct exact v4.8.4 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force premium_plus_combo_final/v484-speed | Out-Null
          @'
          import base64,gzip,pathlib,hashlib,subprocess
          r=pathlib.Path('premium_plus_combo_final');o=r/'v484-speed';src=r/'source'/'vnext_48'
          ps=sorted((r/'source'/'vnext_47').glob('c*.txt'))
          if len(ps)!=4: raise SystemExit('bad v47 chunk count')
          old=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in ps)))
          if hashlib.sha256(old).hexdigest()!='e2598a67b26cb0efb4aea05ac4c329d9f4098fcdef645f2e6ef0d5a3ca0f1f07': raise SystemExit('v47 sha mismatch')
          (o/'main.cpp').write_bytes(old)
          for name,strip in [('v47_to_v48.patch.gz.b64',0),('v48_observer_fix2.patch.gz.b64',0),('v481_to_v482.patch.gz.b64',1),('v482_to_v4821.patch.gz.b64',1),('v4821_to_v4822.patch.gz.b64',1)]:
              raw=gzip.decompress(base64.b64decode((src/name).read_text().strip()))
              p=o/(name+'.patch');p.write_bytes(raw);subprocess.run(['git','apply',f'-p{strip}',p.name],cwd=o,check=True)
              m=o/'main.cpp';m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          if hashlib.sha256((o/'main.cpp').read_bytes()).hexdigest()!='6e857a8a6ccd570d34348dd265ea63e57fe9d3240d9a05447b39a3794fe1cabb': raise SystemExit('v482 sha mismatch')
          parts=sorted(src.glob('v483_final_c*.txt'))
          if len(parts)!=5: raise SystemExit(f'bad v483 chunk count {len(parts)}')
          raw=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in parts)))
          p=o/'v483.patch';p.write_bytes(raw);subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True)
          m=o/'main.cpp';m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          if hashlib.sha256(m.read_bytes()).hexdigest()!='56a57c7a65f5a091be9298f3388c82c4c4097392f96a17bd932e26dd00fcc839': raise SystemExit('v483 sha mismatch')
          (o/'reference-v483.cpp').write_bytes(m.read_bytes())
          parts=sorted(src.glob('v483_to_v484_[0-9][0-9].b64'))
          if len(parts)!=2: raise SystemExit(f'bad v484 chunk count {len(parts)}')
          raw=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in parts)))
          p=o/'v484.patch';p.write_bytes(raw);subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True)
          m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          sha=hashlib.sha256(m.read_bytes()).hexdigest();print('V484SourceSHA256='+sha.upper())
          if sha!='3a2dd16737d825deab01de7af55b1a3ccd81476aad2a4b472d7aaeb1ad07ff0f': raise SystemExit('v484 sha mismatch')
          '@ | python -
          if($LASTEXITCODE){throw 'source reconstruction failed'}
      - name: Preservation and speed audit
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          a=Path('premium_plus_combo_final/v484-speed/reference-v483.cpp').read_text(encoding='utf-8');b=Path('premium_plus_combo_final/v484-speed/main.cpp').read_text(encoding='utf-8')
          def fn(s,m):
            p=s.index(m);q=s.index('{',p);d=0
            for i in range(q,len(s)):
              if s[i]=='{':d+=1
              elif s[i]=='}':
                d-=1
                if d==0:return s[p:i+1]
          for m in ['UINT ReferenceSendInputsUnlocked','UINT ReferenceSendInputs(','bool ReferenceTapKeyUnlocked','bool ReferenceTapKey(','void MinorWorker()','void RWorker()','void CureWorker()','void VitalsWorker()','LRESULT CALLBACK KeyboardProc','void CreateRoguePage()']:
            if fn(a,m)!=fn(b,m):raise SystemExit('preserved function changed '+m)
          oldpage=fn(a,'void CreateAttackPage()');newpage=fn(b,'void CreateAttackPage()').replace('g_ui.skillDelay[i]=Ctrl(L"EDIT",L"1"','g_ui.skillDelay[i]=Ctrl(L"EDIT",L"300"')
          if oldpage!=newpage:raise SystemExit('Attack UI structure changed')
          if 'std::array<int,4> skillDelayMs{1,1,1,1};' not in b:raise SystemExit('fast defaults missing')
          if 'if(speedProfile<3&&g_attack.skillDelayMs[i]==300)g_attack.skillDelayMs[i]=1;' not in b:raise SystemExit('migration missing')
          ws=fn(b,'void MaybeSendWsCombo')
          if 'InterruptibleAttackDelayFrom' in ws or 'ReferenceTapKey' in ws:raise SystemExit('WS still blocking attack')
          if 'if(g_wsPending.pending)return;' not in ws:raise SystemExit('WS backlog guard missing')
          worker=fn(b,'void WsWorker()')
          for x in ['kPostSkillGuardMs=300','g_wsPriority=true',"ReferenceTapKey('W')","ReferenceTapKey('S')"]:
            if x not in worker:raise SystemExit('WS worker missing '+x)
          if 'tWs(WsWorker)' not in b:raise SystemExit('WS worker thread missing')
          print('CoreTransportPreserved=PASS');print('MinorPreserved=PASS');print('CurePreserved=PASS');print('AttackUIStructurePreserved=PASS');print('WSWaitDecoupledFromAttack=PASS')
          '@ | python -
          if($LASTEXITCODE){throw 'preservation audit failed'}
      - name: Build x64
        shell: pwsh
        working-directory: premium_plus_combo_final/v484-speed
        run: |
          @'
          #include <windows.h>
          1 VERSIONINFO
           FILEVERSION 4,8,4,0
           PRODUCTVERSION 4,8,4,0
           FILEOS 0x40004L
           FILETYPE 0x1L
          BEGIN
           BLOCK "StringFileInfo" BEGIN BLOCK "041F04E6" BEGIN
            VALUE "FileDescription", "Premium Plus Combo - Rogue / Attack\0"
            VALUE "FileVersion", "4.8.4.0\0"
            VALUE "ProductName", "Premium Plus Combo\0"
            VALUE "ProductVersion", "4.8.4.0\0"
           END END
           BLOCK "VarFileInfo" BEGIN VALUE "Translation", 0x041F, 1254 END
          END
          '@ | Set-Content app.rc -Encoding Ascii
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="1.0.0.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"/><description>Premium Plus Combo - Rogue</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content final.manifest -Encoding UTF8
          rc /nologo app.rc;if($LASTEXITCODE){throw 'rc failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo-Test.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFESTUAC:"level='asInvoker' uiAccess='false'";if($LASTEXITCODE){throw 'test build failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO;if($LASTEXITCODE){throw 'final build failed'}
          mt.exe -manifest final.manifest "-outputresource:PremiumPlusCombo.exe;#1";if($LASTEXITCODE){throw 'manifest failed'}
      - name: Regression and speed tests
        shell: pwsh
        working-directory: premium_plus_combo_final/v484-speed
        run: |
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--self-test' -Wait -PassThru;if($p.ExitCode){Get-Content self-test-report.txt;throw 'self-test failed'}
          $r=Get-Content self-test-report.txt -Raw;foreach($x in @('TOTAL=172','PASSED=172','AttackOrderedThreeSkills=PASS','SkillDefaults_1=PASS','ZDefaultOff=PASS','CureSingleFlightModel=PASS','MinorReferenceSequenceModel=PASS','ScanCodeTransport=PASS')){if($r -notmatch [regex]::Escape($x)){throw "self missing $x"}}
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--transport-observer-test' -Wait -PassThru;if($p.ExitCode){Get-Content transport-observer-report.txt;throw 'transport failed'}
          $r=Get-Content transport-observer-report.txt -Raw;foreach($x in @('8_Down=24','9_Down=24','0_Down=24','R_Down=24','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($x)){throw "transport missing $x"}}
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--attack-observer-test' -Wait -PassThru;if($p.ExitCode){Get-Content attack-observer-report.txt;throw 'attack failed'}
          $r=Get-Content attack-observer-report.txt -Raw;foreach($x in @('Z_Down=4','W_Down=1','S_Down=1','Skill2_Down=1','Skill3_Down=1','Skill4_Down=1','Skill5_Down=1','RoundRobin=PASS','BarAssertion=PASS','WSNonBlocking=PASS','NoWSBacklog=PASS','WSTiming=PASS','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($x)){throw "attack missing $x"}}
          $span=[int](($r -split "`n"|?{$_ -like 'FastAttackSpanMs=*'}) -replace 'FastAttackSpanMs=','');if($span -ge 420){throw "attack still slow $span ms"}
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--attack-z-off-observer-test' -Wait -PassThru;if($p.ExitCode){Get-Content attack-z-off-observer-report.txt;throw 'z-off failed'}
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--cure-observer-test' -Wait -PassThru;if($p.ExitCode){Get-Content cure-observer-report.txt;throw 'cure regression failed'}
          $r=Get-Content cure-observer-report.txt -Raw;foreach($x in @('F2_Down=1','6_Down=1','F1_Down=1','FrameVisibleHold=PASS','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($x)){throw "cure missing $x"}}
          Get-Content attack-observer-report.txt
      - name: PE Defender and report
        shell: pwsh
        working-directory: premium_plus_combo_final/v484-speed
        run: |
          mt.exe "-inputresource:PremiumPlusCombo.exe;#1" -out:embedded.manifest
          dumpbin /headers PremiumPlusCombo.exe|Set-Content headers.txt;dumpbin /imports PremiumPlusCombo.exe|Set-Content imports.txt
          $h=Get-Content headers.txt -Raw;$i=Get-Content imports.txt -Raw;if($h -notmatch 'machine \(x64\)'){throw 'not x64'};if($h -match 'E0000060'){throw 'RWX section'}
          foreach($b in @('WINHTTP.dll','WININET.dll','WS2_32.dll','VCRUNTIME140.dll','MSVCP140.dll')){if($i -match [regex]::Escape($b)){throw "unexpected import $b"}}
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe";if(-not(Test-Path $mp)){$mp=Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory|Sort-Object Name -Descending|%{Join-Path $_.FullName 'MpCmdRun.exe'}|?{Test-Path $_}|Select-Object -First 1};if(-not $mp){throw 'Defender unavailable'};& $mp -Scan -ScanType 3 -File (Resolve-Path .\PremiumPlusCombo.exe) -DisableRemediation;if($LASTEXITCODE){throw 'Defender failed'}
          $exe=(Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash;$span=(Get-Content attack-observer-report.txt|?{$_ -like 'FastAttackSpanMs=*'});$wa=(Get-Content attack-observer-report.txt|?{$_ -like 'WAfterSkillMs=*'});$sa=(Get-Content attack-observer-report.txt|?{$_ -like 'SAfterWMs=*'})
          @"
          Product=PremiumPlusCombo
          Version=4.8.4.0
          SourceSHA256=3A2DD16737D825DEAB01DE7AF55B1A3CCD81476AAD2A4B472D7AAEB1AD07FF0F
          ReferenceV483SourceSHA256=56A57C7A65F5A091BE9298F3388C82C4C4097392F96A17BD932E26DD00FCC839
          ExistingStructurePreserved=PASS
          MinorPreserved=PASS
          CurePreserved=PASS
          FIFOScanCodeTransportPreserved=PASS
          SkillDefaultMs=1
          WSSchedulerNonBlocking=PASS
          WSBacklogSuppressed=PASS
          $span
          $wa
          $sa
          AttackRoundRobin=PASS
          BarAssertion=PASS
          ZOptionalOnOff=PASS
          SelfTest=172/172 PASS
          TransportObserver=PASS
          AttackObserver=PASS
          CureObserver=PASS
          Overlap=0
          DefenderScan=PASS
          EXESHA256=$exe
          RealGameVerification=USER_SIDE_REQUIRED
          "@|Set-Content BUILD-INFO.txt;Get-Content BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-v4.8.4-ATTACK-SPEED-CANDIDATE
          path: |
            premium_plus_combo_final/v484-speed/PremiumPlusCombo.exe
            premium_plus_combo_final/v484-speed/main.cpp
            premium_plus_combo_final/v484-speed/BUILD-INFO.txt
            premium_plus_combo_final/v484-speed/self-test-report.txt
            premium_plus_combo_final/v484-speed/transport-observer-report.txt
            premium_plus_combo_final/v484-speed/attack-observer-report.txt
            premium_plus_combo_final/v484-speed/attack-z-off-observer-report.txt
            premium_plus_combo_final/v484-speed/cure-observer-report.txt
            premium_plus_combo_final/v484-speed/embedded.manifest
            premium_plus_combo_final/v484-speed/imports.txt
            premium_plus_combo_final/v484-speed/headers.txt
          retention-days: 14
