name: PremiumPlusCombo v4.8.8 WS Precision Calibration Final
on:
  workflow_dispatch:
  push:
    branches: [premium-plus-combo-cure-attack-vitals-ws]
    paths:
      - 'premium_plus_combo_final/source/vnext_48/v486_to_v488.patch.gz.b64'
      - '.github/workflows/premium-plus-combo-v488-ws-precision.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x64}
      - name: Reconstruct exact v4.8.8 and preservation audit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force premium_plus_combo_final/v488-final | Out-Null
          @'
          import base64,gzip,pathlib,hashlib,subprocess
          r=pathlib.Path('premium_plus_combo_final');o=r/'v488-final';src=r/'source'/'vnext_48';m=o/'main.cpp'
          cs=sorted((r/'source'/'vnext_47').glob('c*.txt'));m.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in cs))))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='e2598a67b26cb0efb4aea05ac4c329d9f4098fcdef645f2e6ef0d5a3ca0f1f07'
          for n,s in [('v47_to_v48.patch.gz.b64',0),('v48_observer_fix2.patch.gz.b64',0),('v481_to_v482.patch.gz.b64',1),('v482_to_v4821.patch.gz.b64',1),('v4821_to_v4822.patch.gz.b64',1)]:
            p=o/(n+'.patch');p.write_bytes(gzip.decompress(base64.b64decode((src/n).read_text().strip())));subprocess.run(['git','apply',f'-p{s}',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='6e857a8a6ccd570d34348dd265ea63e57fe9d3240d9a05447b39a3794fe1cabb'
          pcs=sorted(src.glob('v483_final_c*.txt'));p=o/'v483.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='56a57c7a65f5a091be9298f3388c82c4c4097392f96a17bd932e26dd00fcc839'
          pcs=sorted(src.glob('v483_to_v484_[0-9][0-9].b64'));p=o/'v484.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='3a2dd16737d825deab01de7af55b1a3ccd81476aad2a4b472d7aaeb1ad07ff0f'
          pcs=sorted(src.glob('v484_to_v485_[0-9][0-9].b64'));p=o/'v485.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='916e2a370c5ed6eecf01e1ba1a3a79cab2dc45c703f781ff1189ecc711989e93'
          p=o/'v486.patch';p.write_bytes(gzip.decompress(base64.b64decode((src/'v485_to_v486.patch.gz.b64').read_text().strip())));subprocess.run(['git','apply','--directory=premium_plus_combo_final/v488-final','-p1',str(p)],check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='9320d8f6893ca478af35385c42ad2cdec1c9cc1b838b77e25840d352d9b23dd7'
          v486=m.read_text(encoding='utf-8')
          p=o/'v488.patch';p.write_bytes(gzip.decompress(base64.b64decode((src/'v486_to_v488.patch.gz.b64').read_text().strip())));subprocess.run(['git','apply','-p1',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          sha=hashlib.sha256(m.read_bytes()).hexdigest();print('V488SourceSHA256='+sha.upper());assert sha=='85d7804a4c287b796d651985c2f780a0c5c20c008737112c46696b90e1f561d0'
          v488=m.read_text(encoding='utf-8')
          def fn(s,k):
            p=s.index(k);q=s.index('{',p);d=0
            for i in range(q,len(s)):
              if s[i]=='{':d+=1
              elif s[i]=='}':
                d-=1
                if d==0:return s[p:i+1]
            raise RuntimeError(k)
          for k in ['void CureWorker','void MinorWorker','void RWorker','void VitalsWorker','UINT ReferenceSendInputsUnlocked','UINT ReferenceSendInputs(','bool ReferenceTapKeyUnlocked','bool ReferenceTapKey(','LRESULT CALLBACK KeyboardProc','void CreateRoguePage','void CreateAttackPage','void ReadAttackUi']:
            assert fn(v486,k)==fn(v488,k),'preservation failed '+k
          ws=fn(v488,'void WsWorker');atk=fn(v488,'void ExecuteAttack')
          assert "kWsVisibleHoldUs=18000" in v488 and "kWsReleaseGapUs=1200" in v488
          assert "DirectTimedTapUnlocked('W',kWsVisibleHoldUs,kWsReleaseGapUs)" in ws
          assert "DirectTimedTapUnlocked('S',kWsVisibleHoldUs,kWsReleaseGapUs)" in ws
          assert 'InterruptibleAttackDelayFrom(wAt,job.sDelayMs)' in ws
          assert 'skillAt=AttackQpcNow();ReferenceTapKeyUnlocked' in atk
          print('ExistingStructurePreserved=PASS');print('CoreTransportPreserved=PASS');print('MinorPreserved=PASS');print('CurePreserved=PASS');print('RPreserved=PASS');print('WSDownEdgeTiming=PASS');print('WSVisiblePulse18ms=PASS')
          '@ | python -
          if($LASTEXITCODE){throw 'reconstruction/preservation failed'}
      - name: Build x64
        shell: pwsh
        working-directory: premium_plus_combo_final/v488-final
        run: |
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="4.8.8.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"/><description>Premium Plus Combo - Rogue</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content final.manifest -Encoding UTF8
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp /Fe:PremiumPlusCombo-Test.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT;if($LASTEXITCODE){throw 'test build failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp /Fe:PremiumPlusCombo.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO;if($LASTEXITCODE){throw 'final build failed'}
          mt.exe -manifest final.manifest "-outputresource:PremiumPlusCombo.exe;#1";if($LASTEXITCODE){throw 'manifest failed'}
          mt.exe "-inputresource:PremiumPlusCombo.exe;#1" -out:embedded.manifest
          if((Get-Content embedded.manifest -Raw) -notmatch 'requireAdministrator'){throw 'manifest missing'}
      - name: Regression and repeated W-S precision tests
        shell: pwsh
        working-directory: premium_plus_combo_final/v488-final
        run: |
          foreach($arg in @('--self-test','--transport-observer-test','--attack-z-off-observer-test','--cure-observer-test')){$p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList $arg -Wait -PassThru;if($p.ExitCode){throw "$arg failed exit $($p.ExitCode)"}}
          $s=Get-Content self-test-report.txt -Raw;foreach($x in @('TOTAL=176','PASSED=176','AttackOrderedThreeSkills=PASS','MinorReferenceSequenceModel=PASS','ScanCodeTransport=PASS')){if($s -notmatch [regex]::Escape($x)){throw "selftest missing $x"}}
          $w=@();$sg=@();$wh=@();$sh=@();$sp=@()
          1..6 | ForEach-Object {
            $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--attack-observer-test' -Wait -PassThru;if($p.ExitCode){throw "attack precision run $_ failed"}
            $a=Get-Content attack-observer-report.txt -Raw
            foreach($x in @('W_Down=4','S_Down=4','Skill2_Down=1','Skill3_Down=1','Skill4_Down=1','Skill5_Down=1','RoundRobin=PASS','BarAssertion=PASS','SkillCycleSync=PASS','WSEverySkill=PASS','WSTiming=PASS','WSFrameVisible=PASS','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($a -notmatch [regex]::Escape($x)){throw "attack missing $x on run $_"}}
            $w += [int](($a -split "`n"|?{$_ -like 'WAfterSkillMs=*'}) -replace 'WAfterSkillMs=','')
            $sg += [int](($a -split "`n"|?{$_ -like 'SAfterWMs=*'}) -replace 'SAfterWMs=','')
            $wh += [int](($a -split "`n"|?{$_ -like 'W_HoldMs=*'}) -replace 'W_HoldMs=','')
            $sh += [int](($a -split "`n"|?{$_ -like 'S_HoldMs=*'}) -replace 'S_HoldMs=','')
            $sp += [int](($a -split "`n"|?{$_ -like 'SyncedAttackSpanMs=*'}) -replace 'SyncedAttackSpanMs=','')
          }
          $wmin=($w|Measure-Object -Minimum).Minimum;$wmax=($w|Measure-Object -Maximum).Maximum;$wavg=[math]::Round(($w|Measure-Object -Average).Average,1)
          $smin=($sg|Measure-Object -Minimum).Minimum;$smax=($sg|Measure-Object -Maximum).Maximum;$savg=[math]::Round(($sg|Measure-Object -Average).Average,1)
          if($wmin -lt 390 -or $wmax -gt 430){throw "W jitter $wmin-$wmax"};if($smin -lt 42 -or $smax -gt 70){throw "S jitter $smin-$smax"};if((($wh|Measure-Object -Minimum).Minimum) -lt 16 -or (($sh|Measure-Object -Minimum).Minimum) -lt 16){throw 'W/S hold not frame-visible'}
          @"
          PrecisionRuns=6
          WConfiguredMs=400
          WActualMinMs=$wmin
          WActualMaxMs=$wmax
          WActualAvgMs=$wavg
          SConfiguredMs=50
          SActualMinMs=$smin
          SActualMaxMs=$smax
          SActualAvgMs=$savg
          WHoldMinMs=$(($wh|Measure-Object -Minimum).Minimum)
          SHoldMinMs=$(($sh|Measure-Object -Minimum).Minimum)
          DownEdgeSemantics=PASS
          WSFrameVisible=PASS
          "@ | Set-Content ws-precision-report.txt
          $t=Get-Content transport-observer-report.txt -Raw;foreach($x in @('ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($t -notmatch [regex]::Escape($x)){throw "transport missing $x"}}
          $z=Get-Content attack-z-off-observer-report.txt -Raw;foreach($x in @('Z_Down=0','ZOff=PASS','Overlap=0','RESULT=PASS')){if($z -notmatch [regex]::Escape($x)){throw "zoff missing $x"}}
          $c=Get-Content cure-observer-report.txt -Raw;foreach($x in @('F2_Down=1','6_Down=1','F1_Down=1','FrameVisibleHold=PASS','Overlap=0','RESULT=PASS')){if($c -notmatch [regex]::Escape($x)){throw "cure missing $x"}}
          dumpbin /headers PremiumPlusCombo.exe | Set-Content headers.txt;dumpbin /imports PremiumPlusCombo.exe | Set-Content imports.txt
          $h=Get-Content headers.txt -Raw;$i=Get-Content imports.txt -Raw;if($h -notmatch 'machine \(x64\)'){throw 'not x64'};if($h -match 'E0000060'){throw 'RWX'};foreach($bad in @('WINHTTP.dll','WININET.dll','WS2_32.dll','VCRUNTIME140.dll','MSVCP140.dll')){if($i -match [regex]::Escape($bad)){throw "unexpected $bad"}}
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe";if(-not(Test-Path $mp)){$mp=Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory|Sort-Object Name -Descending|%{Join-Path $_.FullName 'MpCmdRun.exe'}|?{Test-Path $_}|Select-Object -First 1};if($mp){& $mp -Scan -ScanType 3 -File (Resolve-Path .\PremiumPlusCombo.exe) -DisableRemediation;if($LASTEXITCODE){throw 'Defender failed'}}
          $sha=(Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash;$size=(Get-Item PremiumPlusCombo.exe).Length
          @"
          Product=PremiumPlusCombo
          Version=4.8.8.0
          SourceSHA256=85D7804A4C287B796D651985C2F780A0C5C20C008737112C46696B90E1F561D0
          ReferenceV486SourceSHA256=9320D8F6893CA478AF35385C42AD2CDEC1C9CC1B838B77E25840D352D9B23DD7
          ExistingStructurePreserved=PASS
          MinorPreserved=PASS
          CurePreserved=PASS
          RPreserved=PASS
          FIFOScanCodeTransportPreserved=PASS
          ZOptionalOnOff=PASS
          WSTimingMeaning=SkillDown-To-WDown / WDown-To-SDown
          WConfiguredMs=400
          WActualMinMs=$wmin
          WActualMaxMs=$wmax
          WActualAvgMs=$wavg
          SConfiguredMs=50
          SActualMinMs=$smin
          SActualMaxMs=$smax
          SActualAvgMs=$savg
          WSPulseHoldUs=18000
          PrecisionRuns=6 PASS
          SelfTest=176/176 PASS
          TransportObserver=PASS
          AttackPrecisionObserver=PASS
          ZOffObserver=PASS
          CureObserver=PASS
          Overlap=0
          DefenderScan=PASS
          EXESHA256=$sha
          Size=$size
          RealGameVerification=USER_SIDE_REQUIRED
          "@ | Set-Content BUILD-INFO.txt
          Get-Content BUILD-INFO.txt;Get-Content ws-precision-report.txt;Get-Content attack-observer-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-v4.8.8-WS-PRECISION-CALIBRATION-FINAL
          path: |
            premium_plus_combo_final/v488-final/PremiumPlusCombo.exe
            premium_plus_combo_final/v488-final/main.cpp
            premium_plus_combo_final/v488-final/BUILD-INFO.txt
            premium_plus_combo_final/v488-final/ws-precision-report.txt
            premium_plus_combo_final/v488-final/self-test-report.txt
            premium_plus_combo_final/v488-final/transport-observer-report.txt
            premium_plus_combo_final/v488-final/attack-observer-report.txt
            premium_plus_combo_final/v488-final/attack-z-off-observer-report.txt
            premium_plus_combo_final/v488-final/cure-observer-report.txt
            premium_plus_combo_final/v488-final/embedded.manifest
            premium_plus_combo_final/v488-final/headers.txt
            premium_plus_combo_final/v488-final/imports.txt
          retention-days: 14
