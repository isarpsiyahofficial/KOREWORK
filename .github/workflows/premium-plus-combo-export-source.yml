name: PremiumPlusCombo Export Exact Source
on:
  workflow_dispatch:
  push:
    branches: [premium-plus-combo-timed-input-fix]
    paths: ['.github/workflows/premium-plus-combo-export-source.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact current source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import base64,gzip,pathlib,hashlib,importlib.util
          p=pathlib.Path('premium_plus_combo_final/source/timed_exact')
          raw=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in sorted(p.glob('part*.txt')))))
          if hashlib.sha256(raw).hexdigest()!='d522959ea955ef788af1df00dfff2dd30bd8566fcbb728823ed39de542d19535': raise SystemExit('baseline SHA mismatch')
          out=pathlib.Path('current-main.cpp'); out.write_bytes(raw)
          spec=importlib.util.spec_from_file_location('delta','premium_plus_combo_final/source/apply_fifo_delta.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); m.apply_delta(out,out)
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          print('CurrentSourceSHA256='+sha.upper())
          if sha!='08bb8807b2aa2e3cf416cc8ff417ebbb245bde3128cffe4faf2b7349d82fc8db': raise SystemExit('current SHA mismatch')
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-Exact-Current-Source
          path: current-main.cpp
          retention-days: 2
