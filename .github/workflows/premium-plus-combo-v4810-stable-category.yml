name: PremiumPlusCombo v4.8.10 Stable Category Toggles

on:
  push:
    branches: [ premium-plus-combo-cure-attack-vitals-ws ]
    paths:
      - 'premium_plus_combo_final/source/vnext_48/v488_to_v4810_category_only.patch.gz.b64'
      - '.github/workflows/premium-plus-combo-v4810-stable-category.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Reconstruct exact v4.8.8 and apply isolated category patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force premium_plus_combo_final/v4810-final | Out-Null
          @'
          import base64,gzip,pathlib,hashlib,subprocess
          r=pathlib.Path('premium_plus_combo_final');o=r/'v4810-final';src=r/'source'/'vnext_48';m=o/'main.cpp'
          cs=sorted((r/'source'/'vnext_47').glob('c*.txt'))
          m.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in cs))))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='e2598a67b26cb0efb4aea05ac4c329d9f4098fcdef645f2e6ef0d5a3ca0f1f07'
          for n,s in [('v47_to_v48.patch.gz.b64',0),('v48_observer_fix2.patch.gz.b64',0),('v481_to_v482.patch.gz.b64',1),('v482_to_v4821.patch.gz.b64',1),('v4821_to_v4822.patch.gz.b64',1)]:
            p=o/(n+'.patch');p.write_bytes(gzip.decompress(base64.b64decode((src/n).read_text().strip())));subprocess.run(['git','apply',f'-p{s}',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='6e857a8a6ccd570d34348dd265ea63e57fe9d3240d9a05447b39a3794fe1cabb'
          pcs=sorted(src.glob('v483_final_c*.txt'));p=o/'v483.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='56a57c7a65f5a091be9298f3388c82c4c4097392f96a17bd932e26dd00fcc839'
          pcs=sorted(src.glob('v483_to_v484_[0-9][0-9].b64'));p=o/'v484.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='3a2dd16737d825deab01de7af55b1a3ccd81476aad2a4b472d7aaeb1ad07ff0f'
          pcs=sorted(src.glob('v484_to_v485_[0-9][0-9].b64'));p=o/'v485.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='916e2a370c5ed6eecf01e1ba1a3a79cab2dc45c703f781ff1189ecc711989e93'
          p=o/'v486.patch';p.write_bytes(gzip.decompress(base64.b64decode((src/'v485_to_v486.patch.gz.b64').read_text().strip())));subprocess.run(['git','apply','--directory=premium_plus_combo_final/v4810-final','-p1',str(p)],check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='9320d8f6893ca478af35385c42ad2cdec1c9cc1b838b77e25840d352d9b23dd7'
          p=o/'v488.patch';p.write_bytes(gzip.decompress(base64.b64decode((src/'v486_to_v488.patch.gz.b64').read_text().strip())));subprocess.run(['git','apply','-p1',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='85d7804a4c287b796d651985c2f780a0c5c20c008737112c46696b90e1f561d0'
          (o/'reference-v488.cpp').write_bytes(m.read_bytes())
          p=o/'v4810.patch';p.write_bytes(gzip.decompress(base64.b64decode((src/'v488_to_v4810_category_only.patch.gz.b64').read_text().strip())));subprocess.run(['git','apply','-p1',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          sha=hashlib.sha256(m.read_bytes()).hexdigest();print('V4810SourceSHA256='+sha.upper());assert sha=='4036e2d93d2305c1acea7b5e36a06ee6a4b3b4de6594afdfa778bd5bafe8323e'
          a=(o/'reference-v488.cpp').read_text(encoding='utf-8');b=m.read_text(encoding='utf-8')
          def fn(s,k):
            p=s.index(k);q=s.index('{',p);d=0
            for i in range(q,len(s)):
              if s[i]=='{':d+=1
              elif s[i]=='}':
                d-=1
                if d==0:return s[p:i+1]
            raise RuntimeError(k)
          for k in ['void WsWorker','void MaybeSendWsCombo','void ExecuteAttack','UINT ReferenceSendInputsUnlocked','UINT ReferenceSendInputs(','bool ReferenceTapKeyUnlocked','bool ReferenceTapKey(','bool DirectTimedTapUnlocked','void ReadAttackUi','void ReadRogueUi','bool RunSelfTest']:
            assert fn(a,k)==fn(b,k),'stable-v488 preservation failed '+k
          assert 'g_rogueCategoryEnabled{true}' in b and 'g_attackCategoryEnabled{true}' in b
          assert 'L"ROGUE AKTİF"' in b and 'L"ATTACK AKTİF"' in b
          assert 'g_attackCategoryEnabled&&g_attackActive' in fn(b,'void AttackWorker')
          assert '!g_rogueCategoryEnabled||!g_minorActive' in fn(b,'void MinorWorker')
          assert '!g_rogueCategoryEnabled||!g_minorActive' in fn(b,'void RWorker')
          assert '!g_rogueCategoryEnabled||!r.cureEnabled' in fn(b,'void CureWorker')
          assert '!r.powerEnabled||!g_attackCategoryEnabled' in fn(b,'void VitalsWorker')
          kb=fn(b,'LRESULT CALLBACK KeyboardProc')
          for x in ['g_rogueCategoryEnabled&&vk==r.startHotkey','g_rogueCategoryEnabled&&vk==r.stopHotkey','g_attackCategoryEnabled&&vk==a.startHotkey','g_attackCategoryEnabled&&vk==a.stopHotkey','g_rogueCategoryEnabled&&r.cureEnabled']:
            assert x in kb,x
          print('V488AttackTimingByteIdentical=PASS')
          print('V488WSTimingByteIdentical=PASS')
          print('CoreTransportByteIdentical=PASS')
          print('CategoryToggleIsolation=PASS')
          '@ | python -
          if($LASTEXITCODE){throw 'reconstruction/audit failed'}

      - name: Build x64 final
        shell: pwsh
        working-directory: premium_plus_combo_final/v4810-final
        run: |
          $ErrorActionPreference='Stop'
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="4.8.10.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"/><description>Premium Plus Combo - Rogue</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content final.manifest -Encoding UTF8
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp /Fe:PremiumPlusCombo-Test.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT
          if($LASTEXITCODE){throw 'test build failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp /Fe:PremiumPlusCombo.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO
          if($LASTEXITCODE){throw 'final build failed'}
          mt.exe -manifest final.manifest "-outputresource:PremiumPlusCombo.exe;#1"
          mt.exe "-inputresource:PremiumPlusCombo.exe;#1" -out:embedded.manifest
          if((Get-Content embedded.manifest -Raw) -notmatch 'requireAdministrator'){throw 'manifest missing'}

      - name: Regression and stable v4.8.8 timing checks
        shell: pwsh
        working-directory: premium_plus_combo_final/v4810-final
        run: |
          $ErrorActionPreference='Stop'
          foreach($arg in @('--self-test','--transport-observer-test','--attack-observer-test','--attack-z-off-observer-test','--cure-observer-test')){
            $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList $arg -Wait -PassThru
            if($p.ExitCode){throw "$arg failed exit $($p.ExitCode)"}
          }
          $s=Get-Content self-test-report.txt -Raw
          foreach($x in @('TOTAL=176','PASSED=176','AttackOrderedThreeSkills=PASS','MinorReferenceSequenceModel=PASS','ScanCodeTransport=PASS')){if($s -notmatch [regex]::Escape($x)){throw "selftest missing $x"}}
          $a=Get-Content attack-observer-report.txt -Raw
          foreach($x in @('W_Down=4','S_Down=4','RoundRobin=PASS','BarAssertion=PASS','SkillCycleSync=PASS','WSEverySkill=PASS','WSTiming=PASS','WSFrameVisible=PASS','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($a -notmatch [regex]::Escape($x)){throw "attack missing $x"}}
          $w=[int](($a -split "`n"|?{$_ -like 'WAfterSkillMs=*'}) -replace 'WAfterSkillMs=','')
          $sg=[int](($a -split "`n"|?{$_ -like 'SAfterWMs=*'}) -replace 'SAfterWMs=','')
          if($w -lt 390 -or $w -gt 430){throw "W timing changed: $w"}
          if($sg -lt 42 -or $sg -gt 70){throw "S timing changed: $sg"}
          $t=Get-Content transport-observer-report.txt -Raw;foreach($x in @('ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($t -notmatch [regex]::Escape($x)){throw "transport missing $x"}}
          $z=Get-Content attack-z-off-observer-report.txt -Raw;foreach($x in @('Z_Down=0','ZOff=PASS','Overlap=0','RESULT=PASS')){if($z -notmatch [regex]::Escape($x)){throw "zoff missing $x"}}
          $c=Get-Content cure-observer-report.txt -Raw;foreach($x in @('F2_Down=1','6_Down=1','F1_Down=1','FrameVisibleHold=PASS','Overlap=0','RESULT=PASS')){if($c -notmatch [regex]::Escape($x)){throw "cure missing $x"}}
          dumpbin /headers PremiumPlusCombo.exe | Set-Content headers.txt
          dumpbin /imports PremiumPlusCombo.exe | Set-Content imports.txt
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe";if(-not(Test-Path $mp)){$mp=Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory|Sort-Object Name -Descending|%{Join-Path $_.FullName 'MpCmdRun.exe'}|?{Test-Path $_}|Select-Object -First 1};if($mp){& $mp -Scan -ScanType 3 -File (Resolve-Path .\PremiumPlusCombo.exe) -DisableRemediation;if($LASTEXITCODE){throw 'Defender failed'}}
          $sha=(Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash;$size=(Get-Item PremiumPlusCombo.exe).Length
          @"
          Product=PremiumPlusCombo
          Version=4.8.10.0
          SourceSHA256=4036E2D93D2305C1ACEA7B5E36A06EE6A4B3B4DE6594AFDFA778BD5BAFE8323E
          ReferenceV488SourceSHA256=85D7804A4C287B796D651985C2F780A0C5C20C008737112C46696B90E1F561D0
          V488AttackTimingByteIdentical=PASS
          V488WSTimingByteIdentical=PASS
          CoreTransportByteIdentical=PASS
          RogueCategoryToggle=PASS
          AttackCategoryToggle=PASS
          CategoryDefaults=ON
          ExistingRegistryTimingValuesPreserved=PASS
          SelfTest=176/176 PASS
          AttackObserver=PASS
          CureObserver=PASS
          Overlap=0
          DefenderScan=PASS
          RequireAdministratorManifest=PASS
          EXESHA256=$sha
          Size=$size
          RealGameVerification=USER_SIDE_REQUIRED
          "@ | Set-Content BUILD-INFO.txt
          Get-Content BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-v4.8.10-V488-STABLE-CATEGORY-TOGGLES
          retention-days: 14
          path: |
            premium_plus_combo_final/v4810-final/PremiumPlusCombo.exe
            premium_plus_combo_final/v4810-final/main.cpp
            premium_plus_combo_final/v4810-final/BUILD-INFO.txt
            premium_plus_combo_final/v4810-final/self-test-report.txt
            premium_plus_combo_final/v4810-final/transport-observer-report.txt
            premium_plus_combo_final/v4810-final/attack-observer-report.txt
            premium_plus_combo_final/v4810-final/attack-z-off-observer-report.txt
            premium_plus_combo_final/v4810-final/cure-observer-report.txt
            premium_plus_combo_final/v4810-final/embedded.manifest
            premium_plus_combo_final/v4810-final/headers.txt
            premium_plus_combo_final/v4810-final/imports.txt
