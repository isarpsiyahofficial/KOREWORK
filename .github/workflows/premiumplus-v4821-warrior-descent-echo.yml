name: PremiumPlus v4.8.21 Warrior Descent Echo

on:
  push:
    branches: [ premiumplus-v4821-warrior-descent-echo ]
    paths:
      - '.github/workflows/premiumplus-v4821-warrior-descent-echo.yml'
      - 'premium_plus_combo_final/workbench/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify exact known-good source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import pathlib,hashlib
          p=pathlib.Path('premium_plus_combo_final/workbench/makro2_v4811_exact.cpp')
          b=p.read_bytes().replace(b'\r\n',b'\n')
          sha=hashlib.sha256(b).hexdigest().upper()
          print('SOURCE_SHA256='+sha)
          assert sha=='3AECB38864D0C248F926C9F15A8FF7F5BE4A1636ACAB966ADC40DA350C142A42'
          '@ | python -

      - name: Generate v4.8.20 reference and v4.8.21 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='premium_plus_combo_final/workbench/makro2_v4811_exact.cpp'
          $ref='premium_plus_combo_final/workbench/premiumplus_v4820_reference.cpp'
          $out='premium_plus_combo_final/workbench/premiumplus_v4821.cpp'
          python premium_plus_combo_final/workbench/apply_mob_dynamic.py $base $ref
          if($LASTEXITCODE){throw 'apply_mob_dynamic failed'}
          python premium_plus_combo_final/workbench/post_mob_dynamic_fix.py $ref
          if($LASTEXITCODE){throw 'post_mob_dynamic_fix failed'}
          python premium_plus_combo_final/workbench/post_mob_r_chase.py $ref
          if($LASTEXITCODE){throw 'post_mob_r_chase failed'}
          python premium_plus_combo_final/workbench/post_ui_compact_tabs.py $ref
          if($LASTEXITCODE){throw 'post_ui_compact_tabs failed'}
          python premium_plus_combo_final/workbench/post_warrior_rightclick.py $ref
          if($LASTEXITCODE){throw 'post_warrior_rightclick failed'}
          python premium_plus_combo_final/workbench/post_warrior_defender_clean.py $ref
          if($LASTEXITCODE){throw 'post_warrior_defender_clean failed'}
          @'
          import pathlib
          p=pathlib.Path('premium_plus_combo_final/workbench/premiumplus_v4820_reference.cpp')
          s=p.read_text(encoding='utf-8').replace('Premium Plus Combo | v4.8.17','Premium Plus Combo | v4.8.19')
          p.write_text(s,encoding='utf-8',newline='\n')
          '@ | python -
          python premium_plus_combo_final/workbench/post_warrior_toggle_fast.py $ref
          if($LASTEXITCODE){throw 'post_warrior_toggle_fast failed'}
          Copy-Item $ref $out
          python premium_plus_combo_final/workbench/post_warrior_descent_echo.py $out
          if($LASTEXITCODE){throw 'post_warrior_descent_echo failed'}

      - name: Preserve v4.8.20 working modules and inventory engine
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import pathlib,hashlib
          old=pathlib.Path('premium_plus_combo_final/workbench/premiumplus_v4820_reference.cpp').read_text(encoding='utf-8')
          new=pathlib.Path('premium_plus_combo_final/workbench/premiumplus_v4821.cpp').read_text(encoding='utf-8')
          def fn(t,sig):
              p=t.index(sig);q=t.index('{',p);d=0
              for i in range(q,len(t)):
                  if t[i]=='{':d+=1
                  elif t[i]=='}':
                      d-=1
                      if d==0:return t[p:i+1]
              raise RuntimeError(sig)
          protected=[
            'void MinorWorker()','void RWorker()','void CureWorker()','void WsWorker()',
            'void AttackWorker()','void VitalsWorker()','void MobSkillWorker()',
            'void MobChaseWorker()','void MobScrollWorker()','void MobPriestWorker()',
            'void ReadAttackUi(bool persist=true)','void ReadMobUi(bool persist=true)',
            'void CreateAttackPage()','void CreateMobPage()','void ShowCategory(int category)',
            'bool DetectInventoryGridPixels','bool CaptureGameClient','bool WarriorResolveVisibleInventory',
            'bool WarriorResolveInventory','bool WarriorRightClickSlot','POINT WarriorSlotCellCenter',
            'LRESULT CALLBACK OverlayProc','void BeginCalibration(int target)'
          ]
          for sig in protected:
              a,b=fn(old,sig),fn(new,sig)
              if a!=b: raise SystemExit('V4820_WORKING_CODE_CHANGED='+sig)
              print('UNCHANGED='+sig+' SHA256='+hashlib.sha256(a.encode()).hexdigest())
          print('V4820_WORKING_STRUCTURE_PRESERVED=PASS')
          '@ | python -

      - name: Warrior Descent Echo source audit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import pathlib
          s=pathlib.Path('premium_plus_combo_final/workbench/premiumplus_v4821.cpp').read_text(encoding='utf-8')
          for bad in ['CreateRemoteThread','WriteProcessMemory','VirtualAllocEx','WinHttpOpen','InternetOpenW','WSAStartup']:
              if bad in s: raise SystemExit('forbidden source API '+bad)
          required=['Premium Plus Combo | v4.8.21','IDC_WARRIOR_DESCENT_KEY','DescentBar','DescentSlot','DescentHotkey','ECHO','EchoEnabled','EchoIntervalValue','Saniye','Dakika','WarriorEchoWorker','WarriorEchoIntervalMs','EchoAbsoluteDeadlineNoDrift','ManualPendingNoDrop']
          for x in required:
              if x not in s: raise SystemExit('missing '+x)
          if 'case IDC_WARRIOR_WEAPON_KEY:' in s: raise SystemExit('second equipment hotkey returned')
          def body(sig):
              p=s.index(sig);q=s.index('{',p);d=0
              for i in range(q,len(s)):
                  if s[i]=='{':d+=1
                  elif s[i]=='}':
                      d-=1
                      if d==0:return s[p:i+1]
          rc=body('bool WarriorRightClickSlot')
          for good in ['MOUSEEVENTF_RIGHTDOWN','MOUSEEVENTF_RIGHTUP','MOUSEEVENTF_ABSOLUTE']:
              if good not in rc: raise SystemExit('rightclick regression '+good)
          for bad in ['MOUSEEVENTF_LEFTDOWN','MOUSEEVENTF_LEFTUP','mouse_event(','GetCursorPos','SetCursorPos']:
              if bad in rc: raise SystemExit('forbidden inventory action '+bad)
          cast=body('bool WarriorCastBarSlot')
          if 'BarToVk' not in cast or 'SlotToVk' not in cast: raise SystemExit('bar-slot casting missing')
          for bad in ['MOUSEEVENTF_','mouse_event(','GetCursorPos','SetCursorPos']:
              if bad in cast: raise SystemExit('Descent/Echo unexpectedly uses mouse')
          echo=body('void WarriorEchoWorker')
          if 'QueryPerformanceCounter' not in echo or 'next+=step' not in echo: raise SystemExit('absolute deadline scheduler missing')
          if 'next=GetTickCount64()+WarriorEchoIntervalMs' in echo: raise SystemExit('drifting scheduler found')
          print('DESCENT_SEPARATE_HOTKEY=PASS')
          print('DESCENT_BAR_SLOT=PASS')
          print('ECHO_SECONDS_MINUTES=PASS')
          print('ECHO_ABSOLUTE_DEADLINE=PASS')
          print('WARRIOR_PENDING_REQUESTS=PASS')
          print('WARRIOR_RIGHT_CLICK_ENGINE_PRESERVED=PASS')
          '@ | python -

      - name: Build v4.8.11 control with stable production settings
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          @'
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="4.8.11.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"></assemblyIdentity><description>Premium Plus Combo - Rogue</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"></requestedExecutionLevel></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content v4811-legacy.manifest -Encoding UTF8
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX makro2_v4811_exact.cpp /Fe:PremiumPlusCombo-v4.8.11-CONTROL.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO
          if($LASTEXITCODE){throw 'v4811 control build failed'}
          mt.exe -nologo -manifest v4811-legacy.manifest "-outputresource:PremiumPlusCombo-v4.8.11-CONTROL.exe;#1"

      - name: Build v4.8.21 with same stable production settings
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          @'
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="4.8.21.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"></assemblyIdentity><description>Premium Plus Combo - Rogue</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"></requestedExecutionLevel></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content v4821-legacy.manifest -Encoding UTF8
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX premiumplus_v4821.cpp /Fe:PremiumPlusCombo-v4.8.21-STABLE.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO
          if($LASTEXITCODE){throw 'v4821 build failed'}
          mt.exe -nologo -manifest v4821-legacy.manifest "-outputresource:PremiumPlusCombo-v4.8.21-STABLE.exe;#1"

      - name: PE shape and exact import-surface parity
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          dumpbin /imports PremiumPlusCombo-v4.8.21-STABLE.exe | Set-Content v4821-imports.txt
          @'
          import pathlib,struct,hashlib
          def pe(path):
              b=pathlib.Path(path).read_bytes();peoff=struct.unpack_from('<I',b,0x3c)[0];coff=peoff+4;n=struct.unpack_from('<H',b,coff+2)[0];opt=coff+20;assert struct.unpack_from('<H',b,opt)[0]==0x20b;dll=struct.unpack_from('<H',b,opt+0x46)[0];return b,coff,opt,n,dll
          def rva(b,coff,opt,x):
              n=struct.unpack_from('<H',b,coff+2)[0];sz=struct.unpack_from('<H',b,coff+16)[0];sec=coff+20+sz
              for i in range(n):
                  o=sec+i*40;vsz,va,rawsz,raw=struct.unpack_from('<IIII',b,o+8)
                  if va<=x<va+max(vsz,rawsz):return raw+x-va
              raise ValueError(hex(x))
          def cs(b,o):
              e=b.find(b'\0',o);return b[o:e].decode('ascii','replace')
          def imports(path):
              b,coff,opt,n,dll=pe(path);ir,isize=struct.unpack_from('<II',b,opt+0x78);out=set()
              if not ir:return out
              d=rva(b,coff,opt,ir)
              while True:
                  oft,ts,fc,nr,ft=struct.unpack_from('<IIIII',b,d)
                  if not(oft or nr or ft):break
                  dn=cs(b,rva(b,coff,opt,nr)).lower();to=rva(b,coff,opt,oft or ft);j=0
                  while True:
                      v=struct.unpack_from('<Q',b,to+j*8)[0]
                      if not v:break
                      sym='#'+str(v&0xffff) if v&(1<<63) else cs(b,rva(b,coff,opt,v)+2)
                      out.add(dn+'!'+sym);j+=1
                  d+=20
              return out
          c,cc,co,cn,cd=pe('PremiumPlusCombo-v4.8.11-CONTROL.exe');n,nc,no,nn,nd=pe('PremiumPlusCombo-v4.8.21-STABLE.exe')
          print('CONTROL_SIZE='+str(len(c)));print('RELEASE_SIZE='+str(len(n)));print('CONTROL_SECTIONS='+str(cn));print('RELEASE_SECTIONS='+str(nn));print('CONTROL_DLLCHAR=0x%04X'%cd);print('RELEASE_DLLCHAR=0x%04X'%nd)
          if len(c)!=419328 or cn!=7 or cd!=0x8160 or nn!=7 or nd!=0x8160:raise SystemExit('stable PE family mismatch')
          ci,ni=imports('PremiumPlusCombo-v4.8.11-CONTROL.exe'),imports('PremiumPlusCombo-v4.8.21-STABLE.exe')
          print('CONTROL_IMPORTS='+str(len(ci)));print('RELEASE_IMPORTS='+str(len(ni)))
          if ci!=ni:
              print('EXTRA='+','.join(sorted(ni-ci)));print('MISSING='+','.join(sorted(ci-ni)));raise SystemExit('import surface differs')
          print('EXACT_IMPORT_SURFACE_MATCH=PASS')
          print('RELEASE_SHA256='+hashlib.sha256(n).hexdigest().upper())
          '@ | python -

      - name: Full regression tests
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          $p=Start-Process .\PremiumPlusCombo-v4.8.21-STABLE.exe -ArgumentList '--self-test' -Wait -PassThru
          if($p.ExitCode){throw 'legacy self-test failed'}
          $a=Get-Content self-test-report.txt -Raw
          if($a -notmatch 'TOTAL=180' -or $a -notmatch 'PASSED=180'){throw '180/180 failed'}
          $p=Start-Process .\PremiumPlusCombo-v4.8.21-STABLE.exe -ArgumentList '--mob-model-test' -Wait -PassThru
          if($p.ExitCode){throw 'mob model failed'}
          $m=Get-Content mob-model-test-report.txt -Raw
          if($m -notmatch 'TOTAL=8' -or $m -notmatch 'PASSED=8'){throw 'MOB 8/8 failed'}
          $p=Start-Process .\PremiumPlusCombo-v4.8.21-STABLE.exe -ArgumentList '--warrior-model-test' -Wait -PassThru
          if($p.ExitCode){throw 'warrior model failed'}
          $w=Get-Content warrior-model-test-report.txt -Raw
          foreach($x in @('TOTAL=19','PASSED=19','Synthetic7x4Detected=PASS','Slot4FourthColumn=PASS','OneSharedHotkey=PASS','DescentSeparateHotkey=PASS','DescentBarSlotMapping=PASS','EchoOneSecond=PASS','EchoTwoMinutes=PASS','EchoAbsoluteDeadlineNoDrift=PASS','ManualPendingNoDrop=PASS')){if($w -notmatch [regex]::Escape($x)){throw "missing warrior test $x"}}
          Get-Content warrior-model-test-report.txt

      - name: Microsoft Defender scan of actual release
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Continue'
          $result='UNAVAILABLE';$exe=(Resolve-Path '.\PremiumPlusCombo-v4.8.21-STABLE.exe').Path
          try { Update-MpSignature -ErrorAction SilentlyContinue } catch {}
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if(!(Test-Path $mp)){$mp=Get-ChildItem 'C:\ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName}
          if($mp -and (Test-Path $mp)){
            & $mp -Scan -ScanType 3 -File $exe -DisableRemediation 2>&1 | Tee-Object -FilePath defender-scan-output.txt
            $text=if(Test-Path defender-scan-output.txt){Get-Content defender-scan-output.txt -Raw}else{''}
            if($text -match 'found no threats'){$result='NO_THREATS'}
            elseif($text -match '(?i)(threat|virus|trojan|malware).*(found|detected)' -or $text -match '(?i)(found|detected).*(threat|virus|trojan|malware)'){$result='THREAT_REPORTED'}
          }
          "MICROSOFT_DEFENDER=$result" | Set-Content defender-result.txt
          if($result -eq 'THREAT_REPORTED'){throw 'Defender reported threat'}
          exit 0

      - name: Release report
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $sha=(Get-FileHash .\PremiumPlusCombo-v4.8.21-STABLE.exe -Algorithm SHA256).Hash
          $size=(Get-Item .\PremiumPlusCombo-v4.8.21-STABLE.exe).Length
          $def=if(Test-Path defender-result.txt){(Get-Content defender-result.txt -Raw).Trim()}else{'MICROSOFT_DEFENDER=UNKNOWN'}
          @"
          Product=Premium Plus Combo
          Version=4.8.21
          Base=v4.8.20 STABLE / exact v4.8.11 source lineage
          V4820WorkingStructurePreserved=PASS
          WarriorEquipmentToggle=UNCHANGED
          WarriorInventoryGridEngine=UNCHANGED
          DescentSeparateHotkey=PASS
          DescentBarSlot=PASS
          EchoAutomatic=PASS
          EchoUnitSecondsMinutes=PASS
          EchoFirstCast=IMMEDIATE_WHEN_READY
          EchoSchedule=ABSOLUTE_QPC_DEADLINE_NO_CUMULATIVE_DRIFT
          ManualWarriorPendingQueue=PASS
          LegacySelfTest=180/180 PASS
          MobModelTest=8/8 PASS
          WarriorModelTest=19/19 PASS
          ExactKnownGoodImportSurface=PASS
          PEStableFamily=7 sections / 0x8160
          $def
          EXE_SIZE=$size
          EXE_SHA256=$sha
          "@ | Set-Content PremiumPlusCombo-v4.8.21-REPORT.txt
          Get-Content PremiumPlusCombo-v4.8.21-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-v4.8.21-STABLE-DESCENT-ECHO
          path: |
            premium_plus_combo_final/workbench/PremiumPlusCombo-v4.8.21-STABLE.exe
            premium_plus_combo_final/workbench/PremiumPlusCombo-v4.8.21-REPORT.txt
            premium_plus_combo_final/workbench/self-test-report.txt
            premium_plus_combo_final/workbench/mob-model-test-report.txt
            premium_plus_combo_final/workbench/warrior-model-test-report.txt
            premium_plus_combo_final/workbench/defender-result.txt
            premium_plus_combo_final/workbench/defender-scan-output.txt
            premium_plus_combo_final/workbench/v4821-imports.txt
