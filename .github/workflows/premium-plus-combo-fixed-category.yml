name: PremiumPlusCombo Final Reference-Derived Build

on:
  workflow_dispatch:
  push:
    branches: [premium-plus-combo-attack-final]
    paths:
      - 'premium_plus_combo_final/source/fixed_parts/**'
      - '.github/workflows/premium-plus-combo-fixed-category.yml'
  pull_request:
    branches: [main]
    paths:
      - 'premium_plus_combo_final/source/fixed_parts/**'
      - '.github/workflows/premium-plus-combo-fixed-category.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Reconstruct exact source and reference assets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force premium_plus_combo_final/final-build | Out-Null
          @'
          import base64,gzip,pathlib,hashlib
          src=pathlib.Path('premium_plus_combo_final/source')
          out=pathlib.Path('premium_plus_combo_final/final-build')
          parts=sorted((src/'fixed_parts').glob('part*.txt'))
          if len(parts)!=6: raise SystemExit(f'expected 6 chunks, got {len(parts)}')
          raw=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          text=raw.decode('utf-8')
          old='r.left=std::clamp(r.left,vx,vx+vw);r.right=std::clamp(r.right,vx,vx+vw);r.top=std::clamp(r.top,vy,vy+vh);r.bottom=std::clamp(r.bottom,vy,vy+vh);'
          new='r.left=std::clamp<LONG>(r.left,(LONG)vx,(LONG)(vx+vw));r.right=std::clamp<LONG>(r.right,(LONG)vx,(LONG)(vx+vw));r.top=std::clamp<LONG>(r.top,(LONG)vy,(LONG)(vy+vh));r.bottom=std::clamp<LONG>(r.bottom,(LONG)vy,(LONG)(vy+vh));'
          if text.count(old)!=1: raise SystemExit('NormalizeScreenRect clamp patch target mismatch')
          raw=text.replace(old,new,1).encode('utf-8')
          out.joinpath('main.cpp').write_bytes(raw)
          out.joinpath('left.jpg').write_bytes(base64.b64decode(src.joinpath('left.jpg.b64').read_text().strip()))
          out.joinpath('right.jpg').write_bytes(base64.b64decode(src.joinpath('right.jpg.b64').read_text().strip()))
          print('source sha',hashlib.sha256(raw).hexdigest())
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'reconstruction failed'}
          $sha=(Get-FileHash premium_plus_combo_final/final-build/main.cpp -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '24ddbbc955103035af2f8ce50c511f0b41eab5ba58d0ce3fdb523b7fb7899662'){throw "source SHA mismatch: $sha"}
          if((Get-FileHash premium_plus_combo_final/final-build/left.jpg -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4a6a3dbfbb47e4c55b89f491b8c06925eee206cd9a213a48f1f9625a3d4822ed'){throw 'left resource mismatch'}
          if((Get-FileHash premium_plus_combo_final/final-build/right.jpg -Algorithm SHA256).Hash.ToLowerInvariant() -ne '704328405933e1aa423acdf257c6ed6ca985f556d82980a3cbd1e8bf01b94146'){throw 'right resource mismatch'}
          $code=Get-Content premium_plus_combo_final/final-build/main.cpp -Raw
          foreach($need in @('kWindowWidth = 800','Local\\PremiumPlusCombo.Rogue.GameBridge.v1','Software\\PremiumPlusCombo\\AttackV2','IDC_CATEGORY_ROGUE','IDC_CATEGORY_ATTACK','IDC_ATTACK_START_ASSIGN','IDC_ATTACK_STOP_ASSIGN','PublishBridgeEvent','BridgeReceiverLive','attackBars','BuildAttackSequence','HPEnabled','MPEnabled')){if(-not $code.Contains($need)){throw "required behavior missing: $need"}}
          foreach($bad in @('CreateProcess','ShellExecute','WinExec','WinHttp','InternetOpen','WSAStartup','VirtualProtect')){if($code.Contains($bad)){throw "forbidden API in source: $bad"}}
          @'
          #include <windows.h>
          201 RCDATA "left.jpg"
          202 RCDATA "right.jpg"
          1 VERSIONINFO
           FILEVERSION 4,0,0,0
           PRODUCTVERSION 4,0,0,0
           FILEFLAGSMASK 0x3fL
           FILEFLAGS 0
           FILEOS 0x40004L
           FILETYPE 0x1L
          BEGIN
           BLOCK "StringFileInfo"
           BEGIN
            BLOCK "041F04E6"
            BEGIN
             VALUE "CompanyName", "Premium Plus Combo\0"
             VALUE "FileDescription", "Premium Plus Combo - Rogue / Attack\0"
             VALUE "FileVersion", "4.0.0.0\0"
             VALUE "InternalName", "PremiumPlusCombo\0"
             VALUE "OriginalFilename", "PremiumPlusCombo.exe\0"
             VALUE "ProductName", "Premium Plus Combo\0"
             VALUE "ProductVersion", "4.0.0.0\0"
            END
           END
           BLOCK "VarFileInfo"
           BEGIN
            VALUE "Translation", 0x041F, 1254
           END
          END
          '@ | Set-Content premium_plus_combo_final/final-build/app.rc -Encoding Ascii

      - name: Build single native x64 EXE
        shell: pwsh
        working-directory: premium_plus_combo_final/final-build
        run: |
          $ErrorActionPreference='Stop'
          rc /nologo app.rc; if($LASTEXITCODE -ne 0){throw 'rc failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo.exe user32.lib gdi32.lib gdiplus.lib advapi32.lib ole32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFESTUAC:"level='asInvoker' uiAccess='false'"
          if($LASTEXITCODE -ne 0){throw "cl failed: $LASTEXITCODE"}

      - name: Run 138 deterministic behavior and detector tests
        shell: pwsh
        working-directory: premium_plus_combo_final/final-build
        run: |
          $p=Start-Process .\PremiumPlusCombo.exe -ArgumentList '--self-test' -Wait -PassThru
          if($p.ExitCode -ne 0){Get-Content self-test-report.txt -ErrorAction SilentlyContinue;throw "self-test exit $($p.ExitCode)"}
          $r=Get-Content self-test-report.txt -Raw
          if($r -notmatch 'TOTAL=138' -or $r -notmatch 'PASSED=138' -or $r -match '=FAIL'){Get-Content self-test-report.txt;throw 'self-test failed'}
          foreach($need in @('BridgeHybridRouting=PASS','AttackPerSkillBarSlotSequence=PASS','SkillBarF1ToF12Mapping=PASS','NonCapsHotkeyMapping=PASS','CureSequenceF2_6_F1=PASS','AttackMinorIndependent=PASS')){if($r -notmatch [regex]::Escape($need)){throw "missing test $need"}}

      - name: PE and import sanity
        shell: pwsh
        working-directory: premium_plus_combo_final/final-build
        run: |
          dumpbin /headers PremiumPlusCombo.exe | Set-Content headers.txt
          dumpbin /imports PremiumPlusCombo.exe | Set-Content imports.txt
          $h=Get-Content headers.txt -Raw; $i=Get-Content imports.txt -Raw
          if($h -notmatch 'machine \(x64\)'){throw 'not x64'}
          foreach($bad in @('CreateProcess','ShellExecute','WINHTTP.dll','WININET.dll','WS2_32.dll','VCRUNTIME140.dll','MSVCP140.dll')){if($i -match [regex]::Escape($bad)){throw "unexpected import $bad"}}
          if($h -match 'E0000060'){throw 'RWX section detected'}

      - name: Microsoft Defender scan
        shell: pwsh
        working-directory: premium_plus_combo_final/final-build
        run: |
          $ErrorActionPreference='Stop';$mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if(-not (Test-Path $mp)){$root="$env:ProgramData\Microsoft\Windows Defender\Platform";$mp=Get-ChildItem $root -Directory | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'MpCmdRun.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1}
          if(-not $mp){throw 'Defender unavailable'}
          & $mp -Scan -ScanType 3 -File (Resolve-Path .\PremiumPlusCombo.exe) -DisableRemediation
          if($LASTEXITCODE -ne 0){throw "Defender detected/scan error $LASTEXITCODE"}
          'DefenderScan=PASS' | Set-Content defender-scan.txt

      - name: Build report
        shell: pwsh
        working-directory: premium_plus_combo_final/final-build
        run: |
          $sha=(Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash
          $size=(Get-Item PremiumPlusCombo.exe).Length
          @"
          Product=PremiumPlusCombo
          Version=4.0.0.0
          Packaging=SingleNativeEXE
          Architecture=x64
          StaticCRT=PASS
          ReferenceSHA256=062F1C4C43C97A69C993221383269D37EF4AFCEF9F26130A1387514405165856
          SourceSHA256=24DDBBC955103035AF2F8CE50C511F0B41EAB5BA58D0CE3FDB523B7FB7899662
          UI=800px reference-style + left ROGUE/ATTACK navigation
          Minor=separate Start/Stop + GameBridge v1 + 150/300 target
          Attack=independent Start/Stop + Z + per-skill F1-F12/1-0
          Cure=exclusive bar-slot-restore + R pause
          HPMP=screen ROI calibration + color-independent fill estimation
          LauncherCore=NONE
          RWX=NONE
          SelfTest=138/138 PASS
          DefenderScan=PASS
          SHA256=$sha
          Size=$size
          "@ | Set-Content BUILD-INFO.txt
          Get-Content BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-Windows-x64-FINAL-REFERENCE
          path: |
            premium_plus_combo_final/final-build/PremiumPlusCombo.exe
            premium_plus_combo_final/final-build/BUILD-INFO.txt
            premium_plus_combo_final/final-build/self-test-report.txt
            premium_plus_combo_final/final-build/defender-scan.txt
          if-no-files-found: error
          retention-days: 14
