name: PremiumPlusCombo v4.8.3 Chunked Final
on:
  workflow_dispatch:
  push:
    branches: [premium-plus-combo-cure-attack-vitals-ws]
    paths:
      - 'premium_plus_combo_final/source/vnext_48/v483_final_c*.txt'
      - '.github/workflows/premium-plus-combo-v483-chunked.yml'
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x64}
      - name: Reconstruct v4.8.3 and audit preservation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force premium_plus_combo_final/v483-chunked | Out-Null
          @'
          import base64,gzip,pathlib,hashlib,subprocess
          r=pathlib.Path('premium_plus_combo_final');o=r/'v483-chunked'
          cs=sorted((r/'source'/'vnext_47').glob('c*.txt'))
          old=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in cs)))
          assert hashlib.sha256(old).hexdigest()=='e2598a67b26cb0efb4aea05ac4c329d9f4098fcdef645f2e6ef0d5a3ca0f1f07'
          (o/'main.cpp').write_bytes(old)
          for n,s in [('v47_to_v48.patch.gz.b64',0),('v48_observer_fix2.patch.gz.b64',0),('v481_to_v482.patch.gz.b64',1),('v482_to_v4821.patch.gz.b64',1),('v4821_to_v4822.patch.gz.b64',1)]:
            raw=gzip.decompress(base64.b64decode((r/'source'/'vnext_48'/n).read_text().strip())); p=o/(n+'.patch');p.write_bytes(raw)
            subprocess.run(['git','apply',f'-p{s}',p.name],cwd=o,check=True); m=o/'main.cpp';m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          ref=(o/'main.cpp').read_bytes(); assert hashlib.sha256(ref).hexdigest()=='6e857a8a6ccd570d34348dd265ea63e57fe9d3240d9a05447b39a3794fe1cabb';(o/'reference-v482.cpp').write_bytes(ref)
          pcs=sorted((r/'source'/'vnext_48').glob('v483_final_c*.txt')); assert len(pcs)==4
          enc=''.join(x.read_text().strip() for x in pcs); print('PatchB64Length='+str(len(enc))); assert len(enc)==15008
          raw=gzip.decompress(base64.b64decode(enc));p=o/'final.patch';p.write_bytes(raw);subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True)
          m=o/'main.cpp';m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'));sha=hashlib.sha256(m.read_bytes()).hexdigest();print('SourceSHA256='+sha.upper());assert sha=='56a57c7a65f5a091be9298f3388c82c4c4097392f96a17bd932e26dd00fcc839'
          a=ref.decode();b=m.read_text(encoding='utf-8')
          def fn(s,k):
            p=s.index(k);q=s.index('{',p);d=0
            for i in range(q,len(s)):
              if s[i]=='{':d+=1
              elif s[i]=='}':
                d-=1
                if d==0:return s[p:i+1]
          for k in ['void CureWorker','void MinorWorker','void RWorker','void VitalsWorker','UINT ReferenceSendInputsUnlocked','UINT ReferenceSendInputs(','bool ReferenceTapKeyUnlocked','bool ReferenceTapKey(']: assert fn(a,k)==fn(b,k),k
          for x in ['IDC_ATTACK_Z_COMBO','bool zCombo=false;','AttackSequenceWithoutZ','AttackSequenceWithOptionalZ','AttackOrderedThreeSkills','ZDefaultOff','SkillDefaults_300','WSDefaults_300_50','kPostSkillGuardMs=300','AttackZEnabledNow','RunAttackZOffObserverTest']: assert x in b,x
          ex=fn(b,'void ExecuteAttack'); assert "if(a.zCombo&&AttackZEnabledNow()){ReferenceTapKey('Z')" in ex; assert 'DirectTimedTapUnlocked(BarToVk(wantedBar),12000,1000);PreciseDelayUs(30000);' in ex
          ws=fn(b,'void MaybeSendWsCombo'); assert 'std::max(kPostSkillGuardMs,a.wDelayMs)' in ws and 'std::max(kPostSkillGuardMs,a.sDelayMs)' in ws
          print('CurePreserved=PASS');print('MinorPreserved=PASS');print('CoreTransportPreserved=PASS');print('OptionalZGate=PASS');print('BarAssertion=PASS');print('OrderedSkillModel=PASS');print('PostSkill300msGuard=PASS')
          '@ | python -
          if($LASTEXITCODE){throw 'reconstruction/audit failed'}
      - name: Build x64
        shell: pwsh
        working-directory: premium_plus_combo_final/v483-chunked
        run: |
          @'
          #include <windows.h>
          1 VERSIONINFO
          FILEVERSION 4,8,3,0
          PRODUCTVERSION 4,8,3,0
          FILEOS 0x40004L
          FILETYPE 0x1L
          BEGIN
           BLOCK "StringFileInfo" BEGIN BLOCK "041F04E6" BEGIN
            VALUE "FileDescription", "Premium Plus Combo - Rogue / Attack\0"
            VALUE "FileVersion", "4.8.3.0\0"
            VALUE "ProductName", "Premium Plus Combo\0"
            VALUE "ProductVersion", "4.8.3.0\0"
           END END
           BLOCK "VarFileInfo" BEGIN VALUE "Translation", 0x041F, 1254 END
          END
          '@ | Set-Content app.rc -Encoding Ascii
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="1.0.0.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"/><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo></assembly>
          '@ | Set-Content final.manifest -Encoding UTF8
          rc /nologo app.rc;if($LASTEXITCODE){throw 'rc failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo-Test.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT;if($LASTEXITCODE){throw 'test build failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO;if($LASTEXITCODE){throw 'final build failed'}
          mt.exe -manifest final.manifest "-outputresource:PremiumPlusCombo.exe;#1";if($LASTEXITCODE){throw 'manifest failed'}
      - name: Full behavioral tests
        shell: pwsh
        working-directory: premium_plus_combo_final/v483-chunked
        run: |
          foreach($arg in @('--self-test','--transport-observer-test','--attack-observer-test','--attack-z-off-observer-test','--cure-observer-test')){$p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList $arg -Wait -PassThru;if($p.ExitCode){throw "$arg failed"}}
          $s=Get-Content self-test-report.txt -Raw
          foreach($x in @('TOTAL=172','PASSED=172','AttackSequenceWithoutZ=PASS','AttackSequenceWithOptionalZ=PASS','AttackOrderedThreeSkills=PASS','ZDefaultOff=PASS','SkillDefaults_300=PASS','WSDefaults_300_50=PASS','ChatInjectedEnterCloses=PASS')){if($s -notmatch [regex]::Escape($x)){throw "missing $x"}}
          $a=Get-Content attack-observer-report.txt -Raw;foreach($x in @('Z_Down=4','W_Down=4','S_Down=4','F1_Down=4','F2_Down=1','F3_Down=1','F4_Down=1','RoundRobin=PASS','BarAssertion=PASS','WSTiming=PASS','Overlap=0','RESULT=PASS')){if($a -notmatch [regex]::Escape($x)){throw "attack missing $x"}}
          $z=Get-Content attack-z-off-observer-report.txt -Raw;foreach($x in @('Z_Down=0','F1_Down=1','Skill2_Down=1','ZOff=PASS','BarAssertion=PASS','Overlap=0','RESULT=PASS')){if($z -notmatch [regex]::Escape($x)){throw "zoff missing $x"}}
          $c=Get-Content cure-observer-report.txt -Raw;foreach($x in @('F2_Down=1','6_Down=1','F1_Down=1','FrameVisibleHold=PASS','Overlap=0','RESULT=PASS')){if($c -notmatch [regex]::Escape($x)){throw "cure missing $x"}}
          Get-Content attack-observer-report.txt;Get-Content attack-z-off-observer-report.txt;Get-Content cure-observer-report.txt
      - name: Security and build info
        shell: pwsh
        working-directory: premium_plus_combo_final/v483-chunked
        run: |
          dumpbin /headers PremiumPlusCombo.exe|Set-Content headers.txt;dumpbin /imports PremiumPlusCombo.exe|Set-Content imports.txt
          $h=Get-Content headers.txt -Raw;$i=Get-Content imports.txt -Raw;if($h -notmatch 'machine \(x64\)'){throw 'not x64'};if($h -match 'E0000060'){throw 'RWX section'};foreach($b in @('WINHTTP.dll','WININET.dll','WS2_32.dll')){if($i -match $b){throw "unexpected $b"}}
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe";if(-not(Test-Path $mp)){$mp=Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory|Sort-Object Name -Descending|%{Join-Path $_.FullName 'MpCmdRun.exe'}|?{Test-Path $_}|Select-Object -First 1};& $mp -Scan -ScanType 3 -File (Resolve-Path .\PremiumPlusCombo.exe) -DisableRemediation;if($LASTEXITCODE){throw 'Defender failed'}
          $sha=(Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash;$sz=(Get-Item PremiumPlusCombo.exe).Length
          @" 
          Version=4.8.3.0
          SourceSHA256=56A57C7A65F5A091BE9298F3388C82C4C4097392F96A17BD932E26DD00FCC839
          CurePreserved=PASS
          MinorPreserved=PASS
          CoreTransportPreserved=PASS
          OptionalZOnOff=PASS
          BarAssertionEverySkill=PASS
          OrderedSkills=PASS
          PostSkillWSGuardMs=300
          SkillDefaultMs=300
          WDefaultMs=300
          SDefaultMs=50
          SelfTest=172/172 PASS
          AttackObserver=PASS
          ZOffObserver=PASS
          CureObserver=PASS
          DefenderScan=PASS
          EXESHA256=$sha
          Size=$sz
          RealGameVerification=USER_SIDE_REQUIRED
          "@|Set-Content BUILD-INFO.txt
          Get-Content BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-v4.8.3-FINAL-CANDIDATE
          path: |
            premium_plus_combo_final/v483-chunked/PremiumPlusCombo.exe
            premium_plus_combo_final/v483-chunked/main.cpp
            premium_plus_combo_final/v483-chunked/BUILD-INFO.txt
            premium_plus_combo_final/v483-chunked/self-test-report.txt
            premium_plus_combo_final/v483-chunked/transport-observer-report.txt
            premium_plus_combo_final/v483-chunked/attack-observer-report.txt
            premium_plus_combo_final/v483-chunked/attack-z-off-observer-report.txt
            premium_plus_combo_final/v483-chunked/cure-observer-report.txt
          retention-days: 14
