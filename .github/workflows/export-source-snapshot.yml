name: Export Visual Rework Source

on:
  push:
    branches:
      - fix/fire-drake-visual-authenticity-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Create source snapshot
        run: |
          tar --exclude='.git' --exclude='upstream' --exclude='build' \
            -czf "$RUNNER_TEMP/KOREWORK-source-snapshot.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: KOREWORK-Visual-Rework-Source
          path: ${{ runner.temp }}/KOREWORK-source-snapshot.tar.gz
          compression-level: 0
