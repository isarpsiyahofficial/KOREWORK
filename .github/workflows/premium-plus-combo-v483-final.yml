name: PremiumPlusCombo v4.8.3 Final Candidate
on:
  workflow_dispatch:
  push:
    branches: [premium-plus-combo-cure-attack-vitals-ws]
    paths:
      - 'premium_plus_combo_final/source/vnext_48/v4822_to_v483_final.patch.gz.b64'
      - '.github/workflows/premium-plus-combo-v483-final.yml'
permissions:
  contents: read
jobs:
  validate-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Reconstruct exact v4.8.3 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force premium_plus_combo_final/v483-final | Out-Null
          @'
          import base64,gzip,pathlib,hashlib,subprocess
          r=pathlib.Path('premium_plus_combo_final');o=r/'v483-final'
          ps=sorted((r/'source'/'vnext_47').glob('c*.txt'))
          if len(ps)!=4: raise SystemExit('bad v47 chunk count')
          old=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in ps)))
          if hashlib.sha256(old).hexdigest()!='e2598a67b26cb0efb4aea05ac4c329d9f4098fcdef645f2e6ef0d5a3ca0f1f07': raise SystemExit('v47 sha mismatch')
          (o/'main.cpp').write_bytes(old)
          for name,strip in [('v47_to_v48.patch.gz.b64',0),('v48_observer_fix2.patch.gz.b64',0),('v481_to_v482.patch.gz.b64',1),('v482_to_v4821.patch.gz.b64',1),('v4821_to_v4822.patch.gz.b64',1)]:
              raw=gzip.decompress(base64.b64decode((r/'source'/'vnext_48'/name).read_text().strip()))
              p=o/(name+'.patch');p.write_bytes(raw);subprocess.run(['git','apply',f'-p{strip}',p.name],cwd=o,check=True)
              m=o/'main.cpp';m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          v482=(o/'main.cpp').read_bytes()
          if hashlib.sha256(v482).hexdigest()!='6e857a8a6ccd570d34348dd265ea63e57fe9d3240d9a05447b39a3794fe1cabb': raise SystemExit('v482 reference mismatch')
          (o/'reference-v482.cpp').write_bytes(v482)
          raw=gzip.decompress(base64.b64decode((r/'source'/'vnext_48'/'v4822_to_v483_final.patch.gz.b64').read_text().strip()))
          p=o/'v4822_to_v483_final.patch';p.write_bytes(raw);subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True)
          m=o/'main.cpp';m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          sha=hashlib.sha256(m.read_bytes()).hexdigest();print('V483SourceSHA256='+sha.upper())
          if sha!='56a57c7a65f5a091be9298f3388c82c4c4097392f96a17bd932e26dd00fcc839': raise SystemExit('v483 sha mismatch')
          '@ | python -
          if($LASTEXITCODE){throw 'source reconstruction failed'}
      - name: Preservation and behavior audit
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          a=Path('premium_plus_combo_final/v483-final/reference-v482.cpp').read_text(encoding='utf-8')
          b=Path('premium_plus_combo_final/v483-final/main.cpp').read_text(encoding='utf-8')
          def fn(s,m):
            p=s.index(m);q=s.index('{',p);d=0
            for i in range(q,len(s)):
              if s[i]=='{':d+=1
              elif s[i]=='}':
                d-=1
                if d==0:return s[p:i+1]
          def block(s,x,y):return s[s.index(x):s.index(y,s.index(x))]
          for n,x,y in [('RogueSettings','struct RogueSettings {','struct AttackSettings {'),('RogueUI','void ReadRogueUi(','void ReadAttackUi('),('RoguePage','void CreateRoguePage(){','void CreateAttackPage(){')]:
            if block(a,x,y)!=block(b,x,y):raise SystemExit(n+' changed')
            print(n+'=PASS')
          for m in ['void CureWorker','void MinorWorker','void RWorker','void VitalsWorker','UINT ReferenceSendInputsUnlocked','UINT ReferenceSendInputs(','bool ReferenceTapKeyUnlocked','bool ReferenceTapKey(']:
            if fn(a,m)!=fn(b,m):raise SystemExit('preserved function changed: '+m)
          req=['IDC_ATTACK_Z_COMBO','bool zCombo=false;','TimingProfileV2','ZDefaultOff','AttackSequenceWithoutZ','AttackSequenceWithOptionalZ','AttackOrderedThreeSkills','SkillDefaults_300','WSDefaults_300_50','kPostSkillGuardMs=300','AttackZEnabledNow','BarAssertion','RunAttackZOffObserverTest']
          for x in req:
            if x not in b:raise SystemExit('missing '+x)
          ex=fn(b,'void ExecuteAttack')
          if "if(a.zCombo&&AttackZEnabledNow()){ReferenceTapKey('Z')" not in ex:raise SystemExit('Z not gated by checkbox')
          if 'DirectTimedTapUnlocked(BarToVk(wantedBar),12000,1000);PreciseDelayUs(30000);' not in ex:raise SystemExit('bar assertion/settle missing')
          if 'ReferenceTapKeyUnlocked(SlotToVk(a.slots[i]));skillAt=AttackQpcNow();' not in ex:raise SystemExit('skill cast timestamp missing')
          ws=fn(b,'void MaybeSendWsCombo')
          if 'std::max(kPostSkillGuardMs,a.wDelayMs)' not in ws or 'std::max(kPostSkillGuardMs,a.sDelayMs)' not in ws:raise SystemExit('300ms W/S guard missing')
          if 'std::array<int,4> skillDelayMs{300,300,300,300};' not in b or 'int wDelayMs=300;' not in b:raise SystemExit('new timing defaults missing')
          if fn(a,'void CureWorker')!=fn(b,'void CureWorker'):raise SystemExit('cure changed')
          print('CureBytePreserved=PASS');print('MinorBytePreserved=PASS');print('CoreInputTransportPreserved=PASS');print('OptionalZGate=PASS');print('BarAssertion=PASS');print('OrderedSkills=PASS');print('PostSkill300msGuard=PASS')
          '@ | python -
          if($LASTEXITCODE){throw 'preservation audit failed'}
      - name: Build native x64
        shell: pwsh
        working-directory: premium_plus_combo_final/v483-final
        run: |
          @'
          #include <windows.h>
          1 VERSIONINFO
           FILEVERSION 4,8,3,0
           PRODUCTVERSION 4,8,3,0
           FILEOS 0x40004L
           FILETYPE 0x1L
          BEGIN
           BLOCK "StringFileInfo" BEGIN BLOCK "041F04E6" BEGIN
            VALUE "FileDescription", "Premium Plus Combo - Rogue / Attack\0"
            VALUE "FileVersion", "4.8.3.0\0"
            VALUE "ProductName", "Premium Plus Combo\0"
            VALUE "ProductVersion", "4.8.3.0\0"
           END END
           BLOCK "VarFileInfo" BEGIN VALUE "Translation", 0x041F, 1254 END
          END
          '@ | Set-Content app.rc -Encoding Ascii
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="1.0.0.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"/><description>Premium Plus Combo - Rogue</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content final.manifest -Encoding UTF8
          rc /nologo app.rc;if($LASTEXITCODE){throw 'rc failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo-Test.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFESTUAC:"level='asInvoker' uiAccess='false'";if($LASTEXITCODE){throw 'test build failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO;if($LASTEXITCODE){throw 'final build failed'}
          mt.exe -manifest final.manifest "-outputresource:PremiumPlusCombo.exe;#1";if($LASTEXITCODE){throw 'manifest failed'}
      - name: Self tests
        shell: pwsh
        working-directory: premium_plus_combo_final/v483-final
        run: |
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--self-test' -Wait -PassThru;if($p.ExitCode){Get-Content self-test-report.txt;throw 'self-test failed'}
          $r=Get-Content self-test-report.txt -Raw
          foreach($x in @('TOTAL=172','PASSED=172','AttackSequenceWithoutZ=PASS','AttackSequenceWithOptionalZ=PASS','AttackOrderedThreeSkills=PASS','ZDefaultOff=PASS','SkillDefaults_300=PASS','WSDefaults_300_50=PASS','PotionRetryIntervalModel=PASS','ChatPauseModel=PASS','ChatEnterOpens=PASS','ChatInjectedEnterCloses=PASS','ChatCloseSurvivesFocusLoss=PASS','ChatEscapeCloses=PASS','MinorReferenceSequenceModel=PASS','ScanCodeTransport=PASS')){if($r -notmatch [regex]::Escape($x)){throw "missing $x"}}
          if($r -match '=FAIL'){throw 'self-test reports failure'}
          Get-Content self-test-report.txt
      - name: Transport observer
        shell: pwsh
        working-directory: premium_plus_combo_final/v483-final
        run: |
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--transport-observer-test' -Wait -PassThru;if($p.ExitCode){Get-Content transport-observer-report.txt;throw 'transport failed'}
          $r=Get-Content transport-observer-report.txt -Raw;foreach($x in @('8_Down=24','9_Down=24','0_Down=24','R_Down=24','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($x)){throw "missing $x"}};Get-Content transport-observer-report.txt
      - name: Attack ordered bar and WS observer
        shell: pwsh
        working-directory: premium_plus_combo_final/v483-final
        run: |
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--attack-observer-test' -Wait -PassThru;if($p.ExitCode){Get-Content attack-observer-report.txt;throw 'attack observer failed'}
          $r=Get-Content attack-observer-report.txt -Raw
          foreach($x in @('Z_Down=4','W_Down=4','S_Down=4','F1_Down=4','F2_Down=1','F3_Down=1','F4_Down=1','Skill2_Down=1','Skill3_Down=1','Skill4_Down=1','Skill5_Down=1','RoundRobin=PASS','BarAssertion=PASS','WSEveryShot=PASS','WSTiming=PASS','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($x)){throw "missing $x"}}
          Get-Content attack-observer-report.txt
      - name: Z-off observer
        shell: pwsh
        working-directory: premium_plus_combo_final/v483-final
        run: |
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--attack-z-off-observer-test' -Wait -PassThru;if($p.ExitCode){Get-Content attack-z-off-observer-report.txt;throw 'Z off observer failed'}
          $r=Get-Content attack-z-off-observer-report.txt -Raw;foreach($x in @('Z_Down=0','F1_Down=1','Skill2_Down=1','ZOff=PASS','BarAssertion=PASS','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($x)){throw "missing $x"}};Get-Content attack-z-off-observer-report.txt
      - name: Cure regression observer
        shell: pwsh
        working-directory: premium_plus_combo_final/v483-final
        run: |
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--cure-observer-test' -Wait -PassThru;if($p.ExitCode){Get-Content cure-observer-report.txt;throw 'cure observer failed'}
          $r=Get-Content cure-observer-report.txt -Raw;foreach($x in @('F2_Down=1','6_Down=1','F1_Down=1','FrameVisibleHold=PASS','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($x)){throw "missing $x"}};Get-Content cure-observer-report.txt
      - name: Defender PE and final report
        shell: pwsh
        working-directory: premium_plus_combo_final/v483-final
        run: |
          mt.exe "-inputresource:PremiumPlusCombo.exe;#1" -out:embedded.manifest
          dumpbin /headers PremiumPlusCombo.exe | Set-Content headers.txt;dumpbin /imports PremiumPlusCombo.exe | Set-Content imports.txt
          $h=Get-Content headers.txt -Raw;$i=Get-Content imports.txt -Raw;if($h -notmatch 'machine \(x64\)'){throw 'not x64'};if($h -match 'E0000060'){throw 'RWX section found'}
          foreach($b in @('WINHTTP.dll','WININET.dll','WS2_32.dll','VCRUNTIME140.dll','MSVCP140.dll')){if($i -match [regex]::Escape($b)){throw "unexpected import $b"}}
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe";if(-not(Test-Path $mp)){$mp=Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory|Sort-Object Name -Descending|%{Join-Path $_.FullName 'MpCmdRun.exe'}|?{Test-Path $_}|Select-Object -First 1};if(-not $mp){throw 'Defender unavailable'};& $mp -Scan -ScanType 3 -File (Resolve-Path .\PremiumPlusCombo.exe) -DisableRemediation;if($LASTEXITCODE){throw 'Defender failed'}
          $exe=(Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash;$size=(Get-Item PremiumPlusCombo.exe).Length;$ws=(Get-Content attack-observer-report.txt|?{$_ -like '*After*Ms=*'});$cure=(Get-Content cure-observer-report.txt|?{$_ -like '*HoldMs=*' -or $_ -like 'LatencyMs=*'})
          @"
          Product=PremiumPlusCombo
          Version=4.8.3.0
          SourceSHA256=56A57C7A65F5A091BE9298F3388C82C4C4097392F96A17BD932E26DD00FCC839
          ReferenceV482SourceSHA256=6E857A8A6CCD570D34348DD265EA63E57FE9D3240D9A05447B39A3794FE1CABB
          CureBytePreserved=PASS
          MinorBytePreserved=PASS
          CoreInputTransportPreserved=PASS
          OptionalZOn=PASS
          OptionalZOff=PASS
          BarAssertionEverySkill=PASS
          OrderedSkills=PASS
          PostSkillWSGuardMs=300
          SkillDefaultMs=300
          WDefaultMs=300
          SDefaultMs=50
          $ws
          $cure
          SelfTest=172/172 PASS
          TransportObserver=PASS
          AttackObserver=PASS
          ZOffObserver=PASS
          CureObserver=PASS
          DefenderScan=PASS
          EXESHA256=$exe
          Size=$size
          RealGameVerification=USER_SIDE_REQUIRED
          "@|Set-Content BUILD-INFO.txt;Get-Content BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-v4.8.3-FINAL-CANDIDATE
          path: |
            premium_plus_combo_final/v483-final/PremiumPlusCombo.exe
            premium_plus_combo_final/v483-final/main.cpp
            premium_plus_combo_final/v483-final/BUILD-INFO.txt
            premium_plus_combo_final/v483-final/self-test-report.txt
            premium_plus_combo_final/v483-final/transport-observer-report.txt
            premium_plus_combo_final/v483-final/attack-observer-report.txt
            premium_plus_combo_final/v483-final/attack-z-off-observer-report.txt
            premium_plus_combo_final/v483-final/cure-observer-report.txt
            premium_plus_combo_final/v483-final/embedded.manifest
            premium_plus_combo_final/v483-final/imports.txt
            premium_plus_combo_final/v483-final/headers.txt
          retention-days: 14
