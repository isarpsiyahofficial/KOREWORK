name: PremiumPlusCombo v4.6 Candidate Package v2
on:
  workflow_dispatch:
  push:
    branches: [premium-plus-combo-cure-attack-vitals-ws]
    paths:
      - 'premium_plus_combo_final/source/vnext_46/**'
      - '.github/workflows/premium-plus-combo-vnext-package-v2.yml'
permissions:
  contents: read
jobs:
  validate-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x64}
      - name: Reconstruct exact source and audit preservation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force premium_plus_combo_final/candidate-v2 | Out-Null
          @'
          import base64,gzip,pathlib,hashlib,importlib.util
          r=pathlib.Path('premium_plus_combo_final'); o=r/'candidate-v2'
          p=r/'source'/'timed_exact'; raw=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in sorted(p.glob('part*.txt')))))
          if hashlib.sha256(raw).hexdigest()!='d522959ea955ef788af1df00dfff2dd30bd8566fcbb728823ed39de542d19535': raise SystemExit('baseline mismatch')
          cur=o/'baseline-working.cpp'; cur.write_bytes(raw)
          sp=importlib.util.spec_from_file_location('d',r/'source'/'apply_fifo_delta.py'); m=importlib.util.module_from_spec(sp); sp.loader.exec_module(m); m.apply_delta(cur,cur)
          if hashlib.sha256(cur.read_bytes()).hexdigest()!='08bb8807b2aa2e3cf416cc8ff417ebbb245bde3128cffe4faf2b7349d82fc8db': raise SystemExit('working source mismatch')
          parts=sorted((r/'source'/'vnext_46').glob('c*.txt')); assert len(parts)==8
          nxt=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in parts)))
          if hashlib.sha256(nxt).hexdigest()!='9a672664e72b09d820fe98b51b0f277bb4c0a267b6b7ad0e5bd7937e9e4837e9': raise SystemExit('vnext source mismatch')
          (o/'main.cpp').write_bytes(nxt)
          a=cur.read_text(encoding='utf-8'); b=nxt.decode('utf-8')
          def blk(s,x,y): return s[s.index(x):s.index(y,s.index(x))]
          for name,x,y in [
            ('RogueSettings','struct RogueSettings {','struct AttackSettings {'),('Transport','bool InitBridge(){','void SendRoutedKey('),
            ('MinorWorker','void MinorWorker(){','void RWorker(){'),('RWorker','void RWorker(){','void CureWorker(){'),
            ('RogueUiReader','void ReadRogueUi(','void ReadAttackUi('),('RoguePage','void CreateRoguePage(){','void CreateAttackPage(){'),
            ('ChromeAndDrawing','void LayoutChrome(){','LRESULT CALLBACK WndProc(')]:
              if blk(a,x,y)!=blk(b,x,y): raise SystemExit(name+' changed')
              print(name+'=PASS')
          req=['HANDLE g_cureEvent{}','SetEvent(g_cureEvent)','WaitForSingleObject(g_cureEvent,50)',
               'ClampD(ReadDword(k,L"DelayMs",125),1,2000)','ReadAttackUi(true);g_attackActive=true',
               'std::array<int,4> skillDelayMs{1,1,1,1}','Skill%dMs','WCombo','SCombo','EstimateTypedBarFill',
               'CapturePercent(a.hpRect,true)','CapturePercent(a.mpRect,false)','IDC_ATTACK_W_COMBO','IDC_ATTACK_S_COMBO',
               "ReferenceTapKeyUnlocked('W')","ReferenceTapKeyUnlocked('S')",'KEYEVENTF_SCANCODE','QueryPerformanceCounter','MapVirtualKey',
               '--transport-observer-test','--attack-observer-test','--cure-observer-test']
          for x in req:
              if x not in b: raise SystemExit('missing '+x)
          for x in ['IDC_ATTACK_SKILL1','IDC_ATTACK_SKILL2','IDC_ATTACK_SKILL3','IDC_ATTACK_SKILL4','IDC_ATTACK_SKILL1_MS','IDC_ATTACK_SKILL2_MS','IDC_ATTACK_SKILL3_MS','IDC_ATTACK_SKILL4_MS']:
              if x not in b: raise SystemExit('missing attack control '+x)
          if 'ClampD(ReadDword(k,L"DelayMs",125),35,2000)' in b: raise SystemExit('old 35ms clamp remains')
          print('FeatureAudit=PASS')
          '@ | python -
          if($LASTEXITCODE){throw 'source audit failed'}
      - name: Resources and build
        shell: pwsh
        working-directory: premium_plus_combo_final/candidate-v2
        run: |
          @'
          #include <windows.h>
          1 VERSIONINFO
           FILEVERSION 4,6,0,0
           PRODUCTVERSION 4,6,0,0
           FILEOS 0x40004L
           FILETYPE 0x1L
          BEGIN
           BLOCK "StringFileInfo" BEGIN BLOCK "041F04E6" BEGIN
            VALUE "FileDescription", "Premium Plus Combo - Rogue / Attack\0"
            VALUE "FileVersion", "4.6.0.0\0"
            VALUE "ProductName", "Premium Plus Combo\0"
            VALUE "ProductVersion", "4.6.0.0\0"
           END END
           BLOCK "VarFileInfo" BEGIN VALUE "Translation", 0x041F, 1254 END
          END
          '@ | Set-Content app.rc -Encoding Ascii
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
           <assemblyIdentity version="1.0.0.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"/>
           <description>Premium Plus Combo - Rogue</description>
           <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo>
           <application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application>
          </assembly>
          '@ | Set-Content final.manifest -Encoding UTF8
          rc /nologo app.rc; if($LASTEXITCODE){throw 'rc failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo-Test.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFESTUAC:"level='asInvoker' uiAccess='false'"
          if($LASTEXITCODE){throw 'test build failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO
          if($LASTEXITCODE){throw 'final build failed'}
          mt.exe -manifest final.manifest "-outputresource:PremiumPlusCombo.exe;#1"; if($LASTEXITCODE){throw 'manifest failed'}
      - name: Self test and observer tests
        shell: pwsh
        working-directory: premium_plus_combo_final/candidate-v2
        run: |
          function Run-Test($arg,$file){$p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList $arg -Wait -PassThru;if($p.ExitCode){if(Test-Path $file){Get-Content $file};throw "$arg failed"};Get-Content $file}
          Run-Test '--self-test' 'self-test-report.txt'
          $r=Get-Content self-test-report.txt -Raw
          foreach($n in @('TOTAL=153','PASSED=153','AttackWSAlternation=PASS','AttackLoopAllows1ms=PASS','SkillDelayAllows1ms=PASS','TypedHP_20=PASS','TypedHP_100=PASS','TypedMP_20=PASS','TypedMP_100=PASS','MinorReferenceSequenceModel=PASS','ScanCodeTransport=PASS')){if($r -notmatch [regex]::Escape($n)){throw "self-test missing $n"}}
          if($r -match '=FAIL'){throw 'self-test contains FAIL'}
          Run-Test '--transport-observer-test' 'transport-observer-report.txt'
          $r=Get-Content transport-observer-report.txt -Raw;foreach($n in @('8_Down=24','9_Down=24','0_Down=24','R_Down=24','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($n)){throw "transport missing $n"}}
          Run-Test '--attack-observer-test' 'attack-observer-report.txt'
          $r=Get-Content attack-observer-report.txt -Raw;foreach($n in @('Z_Down=1','W_Down=2','S_Down=2','Skill2_Down=1','Skill3_Down=1','Skill4_Down=1','Skill5_Down=1','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($n)){throw "attack missing $n"}}
          Run-Test '--cure-observer-test' 'cure-observer-report.txt'
          $r=Get-Content cure-observer-report.txt -Raw;foreach($n in @('F2_Down=1','6_Down=1','F1_Down=1','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($n)){throw "cure missing $n"}};if($r -notmatch 'LatencyMs=(\d+)'){throw 'latency missing'};if([int]$Matches[1]-ge 250){throw 'cure latency high'}
      - name: PE and Defender
        shell: pwsh
        working-directory: premium_plus_combo_final/candidate-v2
        run: |
          mt.exe "-inputresource:PremiumPlusCombo.exe;#1" -out:embedded.manifest; if($LASTEXITCODE){throw 'manifest extract failed'}
          dumpbin /headers PremiumPlusCombo.exe | Set-Content headers.txt; dumpbin /imports PremiumPlusCombo.exe | Set-Content imports.txt
          $h=Get-Content headers.txt -Raw;$i=Get-Content imports.txt -Raw
          if($h -notmatch 'machine \(x64\)'){throw 'not x64'};if($h -match 'E0000060'){throw 'RWX section found'}
          foreach($b in @('WINHTTP.dll','WININET.dll','WS2_32.dll','VCRUNTIME140.dll','MSVCP140.dll')){if($i -match [regex]::Escape($b)){throw "unexpected import $b"}}
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe";if(-not(Test-Path $mp)){$mp=Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory|Sort-Object Name -Descending|%{Join-Path $_.FullName 'MpCmdRun.exe'}|?{Test-Path $_}|Select-Object -First 1};if(-not $mp){throw 'Defender unavailable'}
          & $mp -Scan -ScanType 3 -File (Resolve-Path .\PremiumPlusCombo.exe) -DisableRemediation;if($LASTEXITCODE){throw "Defender exit $LASTEXITCODE"};'DefenderScan=PASS'|Set-Content defender-scan.txt
      - name: Report
        shell: pwsh
        working-directory: premium_plus_combo_final/candidate-v2
        run: |
          $exe=(Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash;$src=(Get-FileHash main.cpp -Algorithm SHA256).Hash;$size=(Get-Item PremiumPlusCombo.exe).Length;$cure=(Get-Content cure-observer-report.txt|?{$_ -like 'LatencyMs=*'})
          @"
          Product=PremiumPlusCombo
          Version=4.6.0.0
          SourceSHA256=$src
          WorkingBaselineSourceSHA256=08BB8807B2AA2E3CF416CC8FF417EBBB245BDE3128CFFE4FAF2B7349D82FC8DB
          WorkingStructurePreservation=PASS
          ScanCodeQPCFIFOTransport=PASS
          TransportOverlap=0
          CureFirstTrigger=PASS
          $cure
          AttackFastZ=PASS
          AttackFourSkills=PASS
          PerSkillMS=PASS
          WCombo=PASS
          SCombo=PASS
          TypedHPMPDetector=PASS
          SelfTest=153/153 PASS
          DefenderScan=PASS
          EXESHA256=$exe
          Size=$size
          RealGameVerification=USER_SIDE_REQUIRED
          "@|Set-Content BUILD-INFO.txt;Get-Content BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-v4.6-TEST-CANDIDATE
          path: |
            premium_plus_combo_final/candidate-v2/PremiumPlusCombo.exe
            premium_plus_combo_final/candidate-v2/main.cpp
            premium_plus_combo_final/candidate-v2/BUILD-INFO.txt
            premium_plus_combo_final/candidate-v2/self-test-report.txt
            premium_plus_combo_final/candidate-v2/transport-observer-report.txt
            premium_plus_combo_final/candidate-v2/attack-observer-report.txt
            premium_plus_combo_final/candidate-v2/cure-observer-report.txt
            premium_plus_combo_final/candidate-v2/defender-scan.txt
            premium_plus_combo_final/candidate-v2/embedded.manifest
          retention-days: 14