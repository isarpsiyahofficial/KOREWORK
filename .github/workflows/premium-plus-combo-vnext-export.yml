name: PremiumPlusCombo v4.6 Tested Candidate Export
on:
  workflow_dispatch:
  push:
    branches: [premium-plus-combo-cure-attack-vitals-ws]
    paths:
      - '.github/workflows/premium-plus-combo-vnext-export.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Reconstruct exact vNext source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force premium_plus_combo_final/export-build | Out-Null
          @'
          import base64,gzip,pathlib,hashlib
          r=pathlib.Path('premium_plus_combo_final')
          p=sorted((r/'source'/'vnext_46').glob('c*.txt'))
          if len(p)!=8: raise SystemExit('expected 8 chunks')
          raw=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in p)))
          sha=hashlib.sha256(raw).hexdigest()
          print('SourceSHA256='+sha.upper())
          if sha!='9a672664e72b09d820fe98b51b0f277bb4c0a267b6b7ad0e5bd7937e9e4837e9': raise SystemExit('source SHA mismatch')
          (r/'export-build'/'main.cpp').write_bytes(raw)
          '@ | python -
          if($LASTEXITCODE){throw 'reconstruction failed'}
      - name: Create resources
        shell: pwsh
        working-directory: premium_plus_combo_final/export-build
        run: |
          @'
          #include <windows.h>
          1 VERSIONINFO
           FILEVERSION 4,6,0,0
           PRODUCTVERSION 4,6,0,0
           FILEFLAGSMASK 0x3fL
           FILEFLAGS 0
           FILEOS 0x40004L
           FILETYPE 0x1L
          BEGIN
           BLOCK "StringFileInfo"
           BEGIN
            BLOCK "041F04E6"
            BEGIN
             VALUE "FileDescription", "Premium Plus Combo - Rogue / Attack\0"
             VALUE "FileVersion", "4.6.0.0\0"
             VALUE "ProductName", "Premium Plus Combo\0"
             VALUE "ProductVersion", "4.6.0.0\0"
            END
           END
           BLOCK "VarFileInfo"
           BEGIN
            VALUE "Translation", 0x041F, 1254
           END
          END
          '@ | Set-Content app.rc -Encoding Ascii
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <assemblyIdentity version="1.0.0.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"/>
            <description>Premium Plus Combo - Rogue</description>
            <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo>
            <application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application>
          </assembly>
          '@ | Set-Content final.manifest -Encoding UTF8
      - name: Build x64
        shell: pwsh
        working-directory: premium_plus_combo_final/export-build
        run: |
          rc /nologo app.rc; if($LASTEXITCODE){throw 'rc failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo-Test.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFESTUAC:"level='asInvoker' uiAccess='false'"
          if($LASTEXITCODE){throw 'test build failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO
          if($LASTEXITCODE){throw 'final build failed'}
          mt.exe -manifest final.manifest "-outputresource:PremiumPlusCombo.exe;#1"; if($LASTEXITCODE){throw 'manifest failed'}
      - name: Regression tests
        shell: pwsh
        working-directory: premium_plus_combo_final/export-build
        run: |
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--self-test' -Wait -PassThru
          if($p.ExitCode){Get-Content self-test-report.txt;throw 'self-test failed'}
          $r=Get-Content self-test-report.txt -Raw
          foreach($n in @('TOTAL=153','PASSED=153','AttackWSAlternation=PASS','AttackLoopAllows1ms=PASS','SkillDelayAllows1ms=PASS','TypedHP_20=PASS','TypedHP_100=PASS','TypedMP_20=PASS','TypedMP_100=PASS','MinorReferenceSequenceModel=PASS','ScanCodeTransport=PASS')){if($r -notmatch [regex]::Escape($n)){throw "self-test missing $n"}}
          if($r -match '=FAIL'){throw 'self-test contains FAIL'}
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--transport-observer-test' -Wait -PassThru
          if($p.ExitCode){Get-Content transport-observer-report.txt;throw 'transport observer failed'}
          $r=Get-Content transport-observer-report.txt -Raw
          foreach($n in @('8_Down=24','9_Down=24','0_Down=24','R_Down=24','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($n)){throw "transport missing $n"}}
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--attack-observer-test' -Wait -PassThru
          if($p.ExitCode){Get-Content attack-observer-report.txt;throw 'attack observer failed'}
          $r=Get-Content attack-observer-report.txt -Raw
          foreach($n in @('Z_Down=1','W_Down=2','S_Down=2','Skill2_Down=1','Skill3_Down=1','Skill4_Down=1','Skill5_Down=1','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($n)){throw "attack missing $n"}}
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--cure-observer-test' -Wait -PassThru
          if($p.ExitCode){Get-Content cure-observer-report.txt;throw 'cure observer failed'}
          $r=Get-Content cure-observer-report.txt -Raw
          foreach($n in @('F2_Down=1','6_Down=1','F1_Down=1','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($n)){throw "cure missing $n"}}
          if($r -notmatch 'LatencyMs=(\d+)'){throw 'cure latency missing'}
          if([int]$Matches[1]-ge 250){throw 'cure latency too high'}
          Get-Content transport-observer-report.txt
          Get-Content attack-observer-report.txt
          Get-Content cure-observer-report.txt
      - name: PE and Defender
        shell: pwsh
        working-directory: premium_plus_combo_final/export-build
        run: |
          mt.exe "-inputresource:PremiumPlusCombo.exe;#1" -out:embedded.manifest; if($LASTEXITCODE){throw 'manifest extract failed'}
          dumpbin /headers PremiumPlusCombo.exe | Set-Content headers.txt
          dumpbin /imports PremiumPlusCombo.exe | Set-Content imports.txt
          $h=Get-Content headers.txt -Raw;$i=Get-Content imports.txt -Raw
          if($h -notmatch 'machine \(x64\)'){throw 'not x64'}
          if($h -match 'E0000060'){throw 'RWX section found'}
          foreach($b in @('WINHTTP.dll','WININET.dll','WS2_32.dll','VCRUNTIME140.dll','MSVCP140.dll')){if($i -match [regex]::Escape($b)){throw "unexpected import $b"}}
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if(-not(Test-Path $mp)){$mp=Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory|Sort-Object Name -Descending|%{Join-Path $_.FullName 'MpCmdRun.exe'}|?{Test-Path $_}|Select-Object -First 1}
          if(-not $mp){throw 'Defender unavailable'}
          & $mp -Scan -ScanType 3 -File (Resolve-Path .\PremiumPlusCombo.exe) -DisableRemediation
          if($LASTEXITCODE){throw "Defender exit $LASTEXITCODE"}
          'DefenderScan=PASS'|Set-Content defender-scan.txt
      - name: Report
        shell: pwsh
        working-directory: premium_plus_combo_final/export-build
        run: |
          $exe=(Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash
          $src=(Get-FileHash main.cpp -Algorithm SHA256).Hash
          $size=(Get-Item PremiumPlusCombo.exe).Length
          $lat=(Get-Content cure-observer-report.txt|?{$_ -like 'LatencyMs=*'})
          @"
          Product=PremiumPlusCombo
          Version=4.6.0.0
          SourceSHA256=$src
          $lat
          SelfTest=153/153 PASS
          TransportObserver=PASS
          AttackObserver=PASS
          CureObserver=PASS
          Overlap=0
          DefenderScan=PASS
          EXESHA256=$exe
          Size=$size
          RealGameVerification=USER_SIDE_REQUIRED
          "@ | Set-Content BUILD-INFO.txt
          Get-Content BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-v4.6-TESTED-CANDIDATE
          path: |
            premium_plus_combo_final/export-build/PremiumPlusCombo.exe
            premium_plus_combo_final/export-build/main.cpp
            premium_plus_combo_final/export-build/BUILD-INFO.txt
            premium_plus_combo_final/export-build/self-test-report.txt
            premium_plus_combo_final/export-build/transport-observer-report.txt
            premium_plus_combo_final/export-build/attack-observer-report.txt
            premium_plus_combo_final/export-build/cure-observer-report.txt
            premium_plus_combo_final/export-build/defender-scan.txt
            premium_plus_combo_final/export-build/embedded.manifest
            premium_plus_combo_final/export-build/imports.txt
            premium_plus_combo_final/export-build/headers.txt
          retention-days: 14