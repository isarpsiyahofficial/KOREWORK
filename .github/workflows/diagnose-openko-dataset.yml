name: Diagnose OpenKO Dataset

on:
  push:
    branches:
      - integration/complete-offline-fire-drake-v1
    paths-ignore:
      - '.validation/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENKO_DB_COMMIT: bec619466938d278339c30e5b1a4bff3c9413bab

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch database
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Open-KO/OpenKO-db.git upstream/openko-db
          git -C upstream/openko-db checkout "$OPENKO_DB_COMMIT"
      - name: Build compiler
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target korework_dataset_compiler
      - id: compile
        name: Compile real dataset
        continue-on-error: true
        run: |
          set -o pipefail
          build/bin/korework_dataset_compiler upstream/openko-db /tmp/game_data.kopack 2>&1 | tee /tmp/dataset-diagnostic.txt
      - name: Record diagnostic
        if: always() && github.event_name == 'push'
        env:
          OUTCOME: ${{ steps.compile.outcome }}
        run: |
          mkdir -p .validation
          {
            echo "validated_commit=${GITHUB_SHA}"
            echo "outcome=${OUTCOME}"
            sed -n '1,80p' /tmp/dataset-diagnostic.txt
          } > .validation/openko-dataset-diagnostic.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .validation/openko-dataset-diagnostic.txt
          git commit -m "Record OpenKO dataset diagnostic [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Enforce result
        if: steps.compile.outcome != 'success'
        run: exit 1
