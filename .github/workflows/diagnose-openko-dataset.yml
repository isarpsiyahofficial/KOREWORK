name: Diagnose OpenKO Dataset

on:
  push:
    branches:
      - integration/complete-offline-fire-drake-v1
    paths-ignore:
      - '.validation/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENKO_DB_COMMIT: bec619466938d278339c30e5b1a4bff3c9413bab

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch database
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Open-KO/OpenKO-db.git upstream/openko-db
          git -C upstream/openko-db checkout "$OPENKO_DB_COMMIT"
          test -s upstream/openko-db/ManualSetup/6_InsertData_K_NPCPOS.sql
      - name: Build compilers
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target korework_dataset_compiler korework_spawn_compiler
      - id: dataset
        name: Compile real dataset
        continue-on-error: true
        run: |
          set -o pipefail
          build/bin/korework_dataset_compiler upstream/openko-db /tmp/game_data.kopack 2>&1 | tee /tmp/dataset-diagnostic.txt
      - id: spawns
        name: Compile real spawn table
        continue-on-error: true
        run: |
          set -o pipefail
          build/bin/korework_spawn_compiler upstream/openko-db /tmp/world_spawns.kospawn 2>&1 | tee /tmp/spawn-diagnostic.txt
          test -s /tmp/world_spawns.kospawn
          grep -Eq 'Spawns: [1-9][0-9]{2,}' /tmp/spawn-diagnostic.txt
          grep -Eq 'Monster spawn rows: [1-9][0-9]{2,}' /tmp/spawn-diagnostic.txt
          grep -Eq 'Zones: [1-9][0-9]*' /tmp/spawn-diagnostic.txt
      - name: Record diagnostic
        if: always() && github.event_name == 'push'
        env:
          DATASET_OUTCOME: ${{ steps.dataset.outcome }}
          SPAWN_OUTCOME: ${{ steps.spawns.outcome }}
        run: |
          mkdir -p .validation
          {
            echo "validated_commit=${GITHUB_SHA}"
            echo "dataset_outcome=${DATASET_OUTCOME}"
            echo "spawn_outcome=${SPAWN_OUTCOME}"
            echo "--- dataset ---"
            sed -n '1,80p' /tmp/dataset-diagnostic.txt
            echo "--- spawns ---"
            sed -n '1,80p' /tmp/spawn-diagnostic.txt
          } > .validation/openko-dataset-diagnostic.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .validation/openko-dataset-diagnostic.txt
          git commit -m "Record OpenKO dataset diagnostic [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Enforce result
        if: steps.dataset.outcome != 'success' || steps.spawns.outcome != 'success'
        run: exit 1
