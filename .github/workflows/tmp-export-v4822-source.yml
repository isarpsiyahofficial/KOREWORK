name: TEMP export v4822 source
on:
  push:
    branches: [ premiumplus-v4822-warrior-battlecry-fast-equip ]
    paths: [ '.github/workflows/tmp-export-v4822-source.yml' ]
permissions:
  contents: read
jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate current v4822 source
        shell: pwsh
        run: |
          $base='premium_plus_combo_final/workbench/makro2_v4811_exact.cpp'
          $ref='premium_plus_combo_final/workbench/premiumplus_v4821_reference.cpp'
          $out='premium_plus_combo_final/workbench/premiumplus_v4822_generated.cpp'
          python premium_plus_combo_final/workbench/apply_mob_dynamic.py $base $ref
          if($LASTEXITCODE){exit 1}
          python premium_plus_combo_final/workbench/post_mob_dynamic_fix.py $ref
          if($LASTEXITCODE){exit 1}
          python premium_plus_combo_final/workbench/post_mob_r_chase.py $ref
          if($LASTEXITCODE){exit 1}
          python premium_plus_combo_final/workbench/post_ui_compact_tabs.py $ref
          if($LASTEXITCODE){exit 1}
          python premium_plus_combo_final/workbench/post_warrior_rightclick.py $ref
          if($LASTEXITCODE){exit 1}
          python premium_plus_combo_final/workbench/post_warrior_defender_clean.py $ref
          if($LASTEXITCODE){exit 1}
          @'
          import pathlib
          p=pathlib.Path('premium_plus_combo_final/workbench/premiumplus_v4821_reference.cpp')
          s=p.read_text(encoding='utf-8').replace('Premium Plus Combo | v4.8.17','Premium Plus Combo | v4.8.19')
          p.write_text(s,encoding='utf-8',newline='\n')
          '@ | python -
          python premium_plus_combo_final/workbench/post_warrior_toggle_fast.py $ref
          if($LASTEXITCODE){exit 1}
          python premium_plus_combo_final/workbench/post_warrior_descent_echo.py $ref
          if($LASTEXITCODE){exit 1}
          Copy-Item $ref $out
          python premium_plus_combo_final/workbench/post_warrior_v4822.py $out
          if($LASTEXITCODE){exit 1}
          @'
          import pathlib
          p=pathlib.Path('premium_plus_combo_final/workbench/premiumplus_v4822_generated.cpp')
          s=p.read_text(encoding='utf-8')
          old='return total==25&&pass==25;'
          assert old in s
          s=s.replace(old,'return total==26&&pass==26;',1)
          p.write_text(s,encoding='utf-8',newline='\n')
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: v4822-generated-source
          path: premium_plus_combo_final/workbench/premiumplus_v4822_generated.cpp
