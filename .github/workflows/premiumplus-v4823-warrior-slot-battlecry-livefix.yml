name: PremiumPlus v4.8.23 Warrior Slot BattleCry LiveFix

on:
  push:
    branches: [ premiumplus-v4823-warrior-slot-battlecry-livefix ]
    paths:
      - '.github/workflows/premiumplus-v4823-warrior-slot-battlecry-livefix.yml'
      - 'premium_plus_combo_final/workbench/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate v4.8.22 reference and v4.8.23 livefix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import pathlib,hashlib
          p=pathlib.Path('premium_plus_combo_final/workbench/makro2_v4811_exact.cpp')
          h=hashlib.sha256(p.read_bytes().replace(b'\r\n',b'\n')).hexdigest().upper()
          print('BASE_SHA256='+h)
          assert h=='3AECB38864D0C248F926C9F15A8FF7F5BE4A1636ACAB966ADC40DA350C142A42'
          '@ | python -
          $base='premium_plus_combo_final/workbench/makro2_v4811_exact.cpp'
          $ref='premium_plus_combo_final/workbench/premiumplus_v4822_reference.cpp'
          $out='premium_plus_combo_final/workbench/premiumplus_v4823.cpp'
          python premium_plus_combo_final/workbench/apply_mob_dynamic.py $base $ref; if($LASTEXITCODE){throw 'apply_mob_dynamic'}
          python premium_plus_combo_final/workbench/post_mob_dynamic_fix.py $ref; if($LASTEXITCODE){throw 'post_mob_dynamic_fix'}
          python premium_plus_combo_final/workbench/post_mob_r_chase.py $ref; if($LASTEXITCODE){throw 'post_mob_r_chase'}
          python premium_plus_combo_final/workbench/post_ui_compact_tabs.py $ref; if($LASTEXITCODE){throw 'post_ui_compact_tabs'}
          python premium_plus_combo_final/workbench/post_warrior_rightclick.py $ref; if($LASTEXITCODE){throw 'post_warrior_rightclick'}
          python premium_plus_combo_final/workbench/post_warrior_defender_clean.py $ref; if($LASTEXITCODE){throw 'post_warrior_defender_clean'}
          @'
          import pathlib
          p=pathlib.Path('premium_plus_combo_final/workbench/premiumplus_v4822_reference.cpp')
          s=p.read_text(encoding='utf-8').replace('Premium Plus Combo | v4.8.17','Premium Plus Combo | v4.8.19')
          p.write_text(s,encoding='utf-8',newline='\n')
          '@ | python -
          python premium_plus_combo_final/workbench/post_warrior_toggle_fast.py $ref; if($LASTEXITCODE){throw 'post_warrior_toggle_fast'}
          python premium_plus_combo_final/workbench/post_warrior_descent_echo.py $ref; if($LASTEXITCODE){throw 'post_warrior_descent_echo'}
          python premium_plus_combo_final/workbench/post_warrior_v4822.py $ref; if($LASTEXITCODE){throw 'post_warrior_v4822'}
          @'
          import pathlib
          p=pathlib.Path('premium_plus_combo_final/workbench/premiumplus_v4822_reference.cpp')
          s=p.read_text(encoding='utf-8'); old='return total==25&&pass==25;'; assert old in s
          p.write_text(s.replace(old,'return total==26&&pass==26;',1),encoding='utf-8',newline='\n')
          '@ | python -
          Copy-Item $ref $out
          python premium_plus_combo_final/workbench/post_warrior_v4823_livefix.py $out; if($LASTEXITCODE){throw 'post_warrior_v4823_livefix'}
          python premium_plus_combo_final/workbench/post_warrior_v4823_battlecry_coarse_confirm.py $out; if($LASTEXITCODE){throw 'battlecry_coarse_confirm'}

      - name: Preserve unrelated code and audit two live fixes
        shell: pwsh
        run: |
          @'
          import pathlib,hashlib
          old=pathlib.Path('premium_plus_combo_final/workbench/premiumplus_v4822_reference.cpp').read_text(encoding='utf-8')
          new=pathlib.Path('premium_plus_combo_final/workbench/premiumplus_v4823.cpp').read_text(encoding='utf-8')
          def fn(t,sig):
            a=t.index(sig);q=t.index('{',a);d=0
            for i in range(q,len(t)):
              if t[i]=='{':d+=1
              elif t[i]=='}':
                d-=1
                if d==0:return t[a:i+1]
          changed=['bool DetectBattleCryPixels','bool BattleCryVisible','bool WarriorResolveVisibleInventoryFast','bool WarriorResolveInventory','void WarriorBattleCryWorker']
          protected=['void MinorWorker()','void RWorker()','void CureWorker()','void WsWorker()','void AttackWorker()','void VitalsWorker()','void MobSkillWorker()','void MobChaseWorker()','void MobScrollWorker()','void MobPriestWorker()','void ReadAttackUi(bool persist=true)','void ReadMobUi(bool persist=true)','void CreateAttackPage()','void CreateMobPage()','void ShowCategory(int category)','bool DetectInventoryGridPixels','bool WarriorGridFromCalibrationPixels','bool WarriorResolveVisibleInventory','POINT WarriorSlotCellCenter','bool WarriorRightClickSlot','void WarriorEchoWorker()','bool WarriorCastBarSlot']
          for sig in protected:
            a,b=fn(old,sig),fn(new,sig)
            if a!=b: raise SystemExit('UNRELATED_CHANGED='+sig)
            print('UNCHANGED='+sig+' '+hashlib.sha256(a.encode()).hexdigest())
          for sig in changed:
            if fn(old,sig)==fn(new,sig): raise SystemExit('FIX_MISSING='+sig)
          for bad in ['CreateRemoteThread','WriteProcessMemory','VirtualAllocEx','WinHttpOpen','InternetOpenW','WSAStartup']:
            if bad in new: raise SystemExit('FORBIDDEN='+bad)
          fast=fn(new,'bool WarriorResolveVisibleInventoryFast')
          for bad in ['inventoryRect.valid','Denorm(w.inventoryRect)','innerW/7','innerH/4']:
            if bad in fast: raise SystemExit('RAW_GRID_GUESS='+bad)
          inv=fn(new,'bool WarriorResolveInventory')
          assert 'WarriorResolveVisibleInventory(game,grid)' in inv and 'GetTickCount64()+280' in inv
          rc=fn(new,'bool WarriorRightClickSlot')
          assert 'MOUSEEVENTF_RIGHTDOWN' in rc and 'MOUSEEVENTF_RIGHTUP' in rc and "ReferenceTapKeyUnlocked('I')" in rc
          assert 'MOUSEEVENTF_LEFTDOWN' not in rc and 'MOUSEEVENTF_LEFTUP' not in rc
          bc=fn(new,'bool DetectBattleCryPixels')
          for x in ['kBattleCryFineA','kBattleCryFineB','coarse>=0.94','return best>=0.60']:
            assert x in bc,x
          vis=fn(new,'bool BattleCryVisible'); assert 'padY=std::clamp(hh,36,90)' in vis
          worker=fn(new,'void WarriorBattleCryWorker')
          for x in ['now-lastSeenAt<900','if(++miss<5)','lastCastAt','GetTickCount64()+1200']:
            assert x in worker,x
          print('SLOT_RAW_RECT_GUESS_REMOVED=PASS')
          print('SLOT_VERIFIED_7X4_ONLY=PASS')
          print('RIGHTCLICK_ENGINE_UNCHANGED=PASS')
          print('BATTLECRY_EXACT_SIGNATURE_CONFIRM=PASS')
          print('BATTLECRY_DUAL_LIVE_SIGNATURE=PASS')
          print('BATTLECRY_900MS_HYSTERESIS=PASS')
          '@ | python -

      - name: Build v4.8.11 control and v4.8.23
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          @'
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="4.8.11.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"></assemblyIdentity><description>Premium Plus Combo - Rogue</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"></requestedExecutionLevel></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content control.manifest -Encoding UTF8
          @'
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="4.8.23.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"></assemblyIdentity><description>Premium Plus Combo - Rogue</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"></requestedExecutionLevel></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content release.manifest -Encoding UTF8
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX makro2_v4811_exact.cpp /Fe:PremiumPlusCombo-v4.8.11-CONTROL.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO
          if($LASTEXITCODE){throw 'control compile failed'}
          mt.exe -nologo -manifest control.manifest "-outputresource:PremiumPlusCombo-v4.8.11-CONTROL.exe;#1"
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX premiumplus_v4823.cpp /Fe:PremiumPlusCombo-v4.8.23-LIVEFIX.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO
          if($LASTEXITCODE){throw 'release compile failed'}
          mt.exe -nologo -manifest release.manifest "-outputresource:PremiumPlusCombo-v4.8.23-LIVEFIX.exe;#1"

      - name: Exact import parity and full regression
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          @'
          import pathlib,struct,hashlib
          def pe(path):
            b=pathlib.Path(path).read_bytes();po=struct.unpack_from('<I',b,0x3c)[0];co=po+4;n=struct.unpack_from('<H',b,co+2)[0];op=co+20;dc=struct.unpack_from('<H',b,op+0x46)[0];return b,co,op,n,dc
          def rva(b,co,op,x):
            n=struct.unpack_from('<H',b,co+2)[0];sz=struct.unpack_from('<H',b,co+16)[0];sec=co+20+sz
            for i in range(n):
              o=sec+i*40;vsz,va,rs,raw=struct.unpack_from('<IIII',b,o+8)
              if va<=x<va+max(vsz,rs):return raw+x-va
            raise ValueError(x)
          def cs(b,o):e=b.find(b'\0',o);return b[o:e].decode('ascii','replace')
          def imp(path):
            b,co,op,n,dc=pe(path);ir,_=struct.unpack_from('<II',b,op+0x78);out=set();d=rva(b,co,op,ir)
            while True:
              oft,ts,fc,nr,ft=struct.unpack_from('<IIIII',b,d)
              if not(oft or nr or ft):break
              dll=cs(b,rva(b,co,op,nr)).lower();to=rva(b,co,op,oft or ft);j=0
              while True:
                v=struct.unpack_from('<Q',b,to+j*8)[0]
                if not v:break
                out.add(dll+'!'+('#'+str(v&0xffff) if v&(1<<63) else cs(b,rva(b,co,op,v)+2)));j+=1
              d+=20
            return out
          cb,cc,co,cn,cd=pe('PremiumPlusCombo-v4.8.11-CONTROL.exe');rb,rc,ro,rn,rd=pe('PremiumPlusCombo-v4.8.23-LIVEFIX.exe')
          assert len(cb)==419328 and cn==7 and cd==0x8160 and rn==7 and rd==0x8160
          ci,ri=imp('PremiumPlusCombo-v4.8.11-CONTROL.exe'),imp('PremiumPlusCombo-v4.8.23-LIVEFIX.exe')
          if ci!=ri: raise SystemExit('IMPORT_SURFACE_CHANGED')
          print('EXACT_IMPORT_SURFACE_MATCH=PASS');print('EXE_SHA256='+hashlib.sha256(rb).hexdigest().upper())
          '@ | python -
          $p=Start-Process .\PremiumPlusCombo-v4.8.23-LIVEFIX.exe -ArgumentList '--self-test' -Wait -PassThru; if($p.ExitCode){Get-Content self-test-report.txt;throw 'legacy failed'}
          if((Get-Content self-test-report.txt -Raw) -notmatch 'PASSED=180'){throw '180/180 failed'}
          $p=Start-Process .\PremiumPlusCombo-v4.8.23-LIVEFIX.exe -ArgumentList '--mob-model-test' -Wait -PassThru; if($p.ExitCode){Get-Content mob-model-test-report.txt;throw 'mob failed'}
          if((Get-Content mob-model-test-report.txt -Raw) -notmatch 'PASSED=8'){throw '8/8 failed'}
          $p=Start-Process .\PremiumPlusCombo-v4.8.23-LIVEFIX.exe -ArgumentList '--warrior-model-test' -Wait -PassThru; if($p.ExitCode){Get-Content warrior-model-test-report.txt;throw 'warrior failed'}
          $w=Get-Content warrior-model-test-report.txt -Raw
          if($w -notmatch 'TOTAL=26' -or $w -notmatch 'PASSED=26'){Get-Content warrior-model-test-report.txt;throw '26/26 failed'}
          Write-Host 'LEGACY=180/180 PASS';Write-Host 'MOB=8/8 PASS';Write-Host 'WARRIOR=26/26 PASS'

      - name: Defender diagnostic
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        continue-on-error: true
        run: |
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if(Test-Path $mp){& $mp -Scan -ScanType 3 -File (Resolve-Path .\PremiumPlusCombo-v4.8.23-LIVEFIX.exe) 2>&1 | Tee-Object defender-scan.txt}else{'DEFENDER_UNAVAILABLE' | Set-Content defender-scan.txt}

      - name: Report
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $sha=(Get-FileHash .\PremiumPlusCombo-v4.8.23-LIVEFIX.exe -Algorithm SHA256).Hash
          @("Product=PremiumPlusCombo","Version=4.8.23","Base=v4.8.22 STABLE","RawCalibrationGridGuess=REMOVED","Verified7x4GridOnly=PASS","RightClickEquipEngine=v4.8.22 UNCHANGED","BattleCryExactCoarseThreshold=0.94","BattleCryDualLiveSignature=PASS","BattleCryFineThreshold=0.60","BattleCryExpandedBuffSearch=PASS","BattleCryHysteresisMs=900","BattleCryConfirmWindowMs=1200","LegacySelfTest=180/180 PASS","MobModelTest=8/8 PASS","WarriorModelTest=26/26 PASS","ExactImportSurfaceVsV4811=PASS","EXE_SHA256=$sha") | Set-Content PremiumPlusCombo-v4.8.23-LIVEFIX-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-v4.8.23-LIVEFIX-SLOT-BATTLECRY
          path: |
            premium_plus_combo_final/workbench/PremiumPlusCombo-v4.8.23-LIVEFIX.exe
            premium_plus_combo_final/workbench/PremiumPlusCombo-v4.8.23-LIVEFIX-REPORT.txt
            premium_plus_combo_final/workbench/self-test-report.txt
            premium_plus_combo_final/workbench/mob-model-test-report.txt
            premium_plus_combo_final/workbench/warrior-model-test-report.txt
            premium_plus_combo_final/workbench/defender-scan.txt
