name: PremiumPlus v4.8.27 WIN10 WIN11 INPUT COMPAT

on:
  push:
    branches: [ fix/premiumplus-v4827-win11-input-compat-20260919 ]
    paths:
      - '.github/workflows/premiumplus-v4827-win11-input.yml'
      - 'premium_plus_combo_final/workbench/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate v4.8.27 source and run protected gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python premium_plus_combo_final/workbench/build_v4827_final_source.py
          if($LASTEXITCODE){throw 'v4.8.27 source build failed'}
          python premium_plus_combo_final/workbench/audit_v4826_compat.py
          if($LASTEXITCODE){throw 'v4.8.26 protected audit failed'}
          python premium_plus_combo_final/workbench/v4826_rogue_skill_tests.py
          if($LASTEXITCODE){throw 'Rogue v4.8.26 gates failed'}
          python premium_plus_combo_final/workbench/v4827_input_compat_tests.py
          if($LASTEXITCODE){throw 'v4.8.27 input compat static gates failed'}
          python premium_plus_combo_final/workbench/v4825_mob_ui_scenario_tests.py
          if($LASTEXITCODE){throw 'MOB UI tests failed'}
          python premium_plus_combo_final/workbench/v4825_attack_sideinput_tests.py
          if($LASTEXITCODE){throw 'Attack side-input tests failed'}
          python premium_plus_combo_final/workbench/v4825_warrior_attack_ui_tests.py
          if($LASTEXITCODE){throw 'Warrior/Attack UI tests failed'}
          python premium_plus_combo_final/workbench/v4825_idle_cpu_tests.py
          if($LASTEXITCODE){throw 'Idle CPU static gates failed'}

      - name: Build elevated v4.8.27 game-compatible release
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          @'
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="4.8.11.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"></assemblyIdentity><description>Premium Plus Combo - Control</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"></requestedExecutionLevel></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content control.manifest -Encoding UTF8
          @'
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="4.8.27.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"></assemblyIdentity><description>Premium Plus Combo - Win10 Win11 Input Compat</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"></requestedExecutionLevel></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content release.manifest -Encoding UTF8
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX makro2_v4811_exact.cpp /Fe:PremiumPlusCombo-v4.8.11-CONTROL.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO
          if($LASTEXITCODE){throw 'control compile failed'}
          mt.exe -nologo -manifest control.manifest "-outputresource:PremiumPlusCombo-v4.8.11-CONTROL.exe;#1"
          if($LASTEXITCODE){throw 'control manifest failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX premiumplus_v4827_final.cpp /Fe:PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO
          if($LASTEXITCODE){throw 'release compile failed'}
          mt.exe -nologo -manifest release.manifest "-outputresource:PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX.exe;#1"
          if($LASTEXITCODE){throw 'release manifest failed'}
          Copy-Item PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX.exe PremiumPlusCombo-v4.8.25-FINAL.exe -Force
          python audit_v4825_pe.py
          if($LASTEXITCODE){throw 'PE/import audit failed'}
          mt.exe -nologo -inputresource:PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX.exe`;#1 -out:embedded-v4827.manifest
          if($LASTEXITCODE){throw 'manifest extract failed'}
          $manifest=Get-Content embedded-v4827.manifest -Raw
          if($manifest -notmatch 'requestedExecutionLevel level="requireAdministrator"'){throw 'requireAdministrator missing'}
          if($manifest -match 'requestedExecutionLevel level="asInvoker"'){throw 'asInvoker present'}
          Write-Host 'GAME_INPUT_INTEGRITY_LEVEL=PASS'

      - name: Run Windows input visibility and timing gates
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          $p=Start-Process .\PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX.exe -ArgumentList '--game-input-compat-observer-test' -Wait -PassThru
          if($p.ExitCode){if(Test-Path game-input-compat-observer-report.txt){Get-Content game-input-compat-observer-report.txt};throw 'game input compatibility observer failed'}
          $r=Get-Content game-input-compat-observer-report.txt -Raw
          if($r -notmatch 'GameVisibleHold=PASS' -or $r -notmatch 'ScanCodesNonZero=PASS' -or $r -notmatch 'RESULT=PASS'){throw 'game-visible input gate failed'}
          $p=Start-Process .\PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX.exe -ArgumentList '--minor-timing-test' -Wait -PassThru
          if($p.ExitCode){throw 'native Minor timing failed'}
          $r=Get-Content minor-timing-report.txt -Raw
          if($r -notmatch 'TargetHz=26' -or $r -notmatch 'Cadence=PASS' -or $r -notmatch 'RESULT=PASS'){throw 'native Minor cadence failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc minor_cpu_benchmark.cpp /Fe:minor-cpu-benchmark.exe winmm.lib
          if($LASTEXITCODE){throw 'legacy CPU benchmark compile failed'}
          .\minor-cpu-benchmark.exe
          if($LASTEXITCODE){throw 'legacy CPU benchmark failed'}

      - name: Run full executable regression suite
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          $p=Start-Process .\PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX.exe -ArgumentList '--self-test' -Wait -PassThru
          if($p.ExitCode){throw 'legacy self-test failed'}
          $r=Get-Content self-test-report.txt -Raw
          if($r -notmatch 'TOTAL=180' -or $r -notmatch 'PASSED=180'){throw '180/180 failed'}
          $p=Start-Process .\PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX.exe -ArgumentList '--mob-model-test' -Wait -PassThru
          if($p.ExitCode){throw 'MOB model failed'}
          $p=Start-Process .\PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX.exe -ArgumentList '--warrior-model-test' -Wait -PassThru
          if($p.ExitCode){throw 'Warrior model failed'}
          $p=Start-Process .\PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX.exe -ArgumentList '--attack-r-extra-observer-test' -Wait -PassThru
          if($p.ExitCode){throw 'R + dynamic Attack observer failed'}
          $p=Start-Process .\PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX.exe -ArgumentList '--attack-observer-test' -Wait -PassThru
          if($p.ExitCode){if(Test-Path attack-observer-report.txt){Get-Content attack-observer-report.txt};throw 'Attack observer regression failed'}
          $p=Start-Process .\PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX.exe -ArgumentList '--attack-z-off-observer-test' -Wait -PassThru
          if($p.ExitCode){throw 'Attack Z-off regression failed'}
          $p=Start-Process .\PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX.exe -ArgumentList '--rogue-v4826-model-test' -Wait -PassThru
          if($p.ExitCode){if(Test-Path rogue-v4826-model-report.txt){Get-Content rogue-v4826-model-report.txt};throw 'Rogue v4.8.26 model failed'}

      - name: Run selector and Windows mouse scenarios
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          python mob_selector_scenario_model.py
          if($LASTEXITCODE){throw 'selector model failed'}
          $r=Get-Content mob-selector-scenario-report.txt -Raw
          if($r -notmatch 'TOTAL=48' -or $r -notmatch 'PASSED=48'){throw '48/48 selector failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /DUNICODE /D_UNICODE mob_selector_manual_click_test.cpp /Fe:mob-selector-manual-click-test.exe user32.lib gdi32.lib /link /SUBSYSTEM:WINDOWS
          if($LASTEXITCODE){throw 'mouse harness compile failed'}
          $p=Start-Process .\mob-selector-manual-click-test.exe -Wait -PassThru
          if($p.ExitCode){throw 'mouse harness failed'}
          $r=Get-Content mob-selector-manual-click-report.txt -Raw
          if($r -notmatch 'TOTAL=9' -or $r -notmatch 'PASSED=9'){throw '9/9 mouse failed'}

      - name: Write v4.8.27 final report
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $sha=(Get-FileHash .\PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX.exe -Algorithm SHA256).Hash
          $src=(Get-FileHash .\premiumplus_v4827_final.cpp -Algorithm SHA256).Hash
          $timing=Get-Content minor-timing-report.txt -Raw
          $hz=([regex]::Match($timing,'MeasuredHz=([^\r\n]+)')).Groups[1].Value
          $input=Get-Content game-input-compat-observer-report.txt -Raw
          $h8=([regex]::Match($input,'8_HoldMs=([^\r\n]+)')).Groups[1].Value
          $h9=([regex]::Match($input,'9_HoldMs=([^\r\n]+)')).Groups[1].Value
          @(
            'Product=PremiumPlusCombo',
            'Version=4.8.27-win10-win11-input-compat',
            'Base=v4.8.26-rogue-skills',
            'ExecutionLevel=requireAdministrator',
            'ExistingCoreProtected=PASS',
            'NativeMinorMaxHz=20',
            'NativeMinorTurboHz=26',
            'BridgeMinorMaxHz=120',
            'BridgeMinorTurboHz=240',
            'NativeMinorHoldUs=12000',
            'NativeMinorGapUs=800',
            'GenericNativeHoldUs=12000',
            'GenericNativeGapUs=1000',
            'DirectTimedMinimumHoldUs=10000',
            "MeasuredNativeTurboHz=$hz",
            "ReferenceTapObservedHoldMs=$h8",
            "DirectTapObservedHoldMs=$h9",
            'GameVisibleInputObserver=PASS',
            'ScanCodeTransport=PASS',
            'Win10Win11StandardInputPath=PASS',
            'LegacySelfTest=180/180 PASS',
            'MobSelectorScenario=48/48 PASS',
            'RealWindowsMouseSelect=9/9 PASS',
            "SourceSHA256=$src",
            "EXE_SHA256=$sha",
            'ExactImportSurfaceVsV4811=PASS',
            'PESectionAndDllCharacteristics=PASS'
          ) | Set-Content PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX-REPORT.txt
          Get-Content PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlus-v4.8.27-WIN11-INPUT-FIX
          if-no-files-found: error
          retention-days: 90
          path: |
            premium_plus_combo_final/workbench/PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX.exe
            premium_plus_combo_final/workbench/PremiumPlusCombo-v4.8.27-WIN11-INPUT-FIX-REPORT.txt
            premium_plus_combo_final/workbench/premiumplus_v4827_final.cpp
            premium_plus_combo_final/workbench/embedded-v4827.manifest
            premium_plus_combo_final/workbench/v4827-final-source-sha.txt
            premium_plus_combo_final/workbench/game-input-compat-observer-report.txt
            premium_plus_combo_final/workbench/minor-timing-report.txt
            premium_plus_combo_final/workbench/minor-cpu-benchmark-report.txt
            premium_plus_combo_final/workbench/self-test-report.txt
            premium_plus_combo_final/workbench/mob-model-test-report.txt
            premium_plus_combo_final/workbench/warrior-model-test-report.txt
            premium_plus_combo_final/workbench/attack-r-extra-observer-report.txt
            premium_plus_combo_final/workbench/attack-observer-report.txt
            premium_plus_combo_final/workbench/attack-z-off-observer-report.txt
            premium_plus_combo_final/workbench/rogue-v4826-model-report.txt
            premium_plus_combo_final/workbench/mob-selector-scenario-report.txt
            premium_plus_combo_final/workbench/mob-selector-manual-click-report.txt
            premium_plus_combo_final/workbench/import-audit.txt
