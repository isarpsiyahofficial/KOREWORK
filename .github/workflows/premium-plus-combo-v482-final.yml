name: PremiumPlusCombo v4.8.2 Final Candidate
on:
  workflow_dispatch:
  push:
    branches: [premium-plus-combo-cure-attack-vitals-ws]
    paths:
      - 'premium_plus_combo_final/source/vnext_48/v481_to_v482.patch.gz.b64'
      - '.github/workflows/premium-plus-combo-v482-final.yml'
permissions:
  contents: read
jobs:
  validate-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Reconstruct v4.8.2 exact source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force premium_plus_combo_final/v482-final | Out-Null
          @'
          import base64,gzip,pathlib,hashlib,subprocess
          r=pathlib.Path('premium_plus_combo_final');o=r/'v482-final'
          ps=sorted((r/'source'/'vnext_47').glob('c*.txt'))
          if len(ps)!=4: raise SystemExit('bad v47 chunk count')
          old=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in ps)))
          if hashlib.sha256(old).hexdigest()!='e2598a67b26cb0efb4aea05ac4c329d9f4098fcdef645f2e6ef0d5a3ca0f1f07': raise SystemExit('v47 sha mismatch')
          (o/'reference-v47.cpp').write_bytes(old);(o/'main.cpp').write_bytes(old)
          for name,strip in [('v47_to_v48.patch.gz.b64',0),('v48_observer_fix2.patch.gz.b64',0),('v481_to_v482.patch.gz.b64',1)]:
              raw=gzip.decompress(base64.b64decode((r/'source'/'vnext_48'/name).read_text().strip()))
              patch=o/(name+'.patch');patch.write_bytes(raw)
              subprocess.run(['git','apply',f'-p{strip}',patch.name],cwd=o,check=True)
              p=o/'main.cpp';p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          sha=hashlib.sha256((o/'main.cpp').read_bytes()).hexdigest();print('V482SourceSHA256='+sha.upper())
          if sha!='4adb36530c2fbb0a16aee71d6a750b13812786ac8252992c7b7c7949c64f7b73': raise SystemExit('v482 sha mismatch')
          '@ | python -
          if($LASTEXITCODE){throw 'source reconstruction failed'}
      - name: Preservation audit
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          a=Path('premium_plus_combo_final/v482-final/reference-v47.cpp').read_text(encoding='utf-8')
          b=Path('premium_plus_combo_final/v482-final/main.cpp').read_text(encoding='utf-8')
          def block(s,x,y):return s[s.index(x):s.index(y,s.index(x))]
          def fn(s,m):
            p=s.index(m);q=s.index('{',p);d=0
            for i in range(q,len(s)):
              if s[i]=='{':d+=1
              elif s[i]=='}':
                d-=1
                if d==0:return s[p:i+1]
          for n,x,y in [('RogueSettings','struct RogueSettings {','struct AttackSettings {'),('RogueUI','void ReadRogueUi(','void ReadAttackUi('),('RoguePage','void CreateRoguePage(){','void CreateAttackPage(){'),('AttackUILayout','void CreateAttackPage(){','void LayoutChrome(){')]:
            if block(a,x,y)!=block(b,x,y):raise SystemExit(n+' changed')
            print(n+'=PASS')
          for m in ['UINT ReferenceSendInputsUnlocked','UINT ReferenceSendInputs(','bool ReferenceTapKeyUnlocked','bool ReferenceTapKey(']:
            if fn(a,m)!=fn(b,m):raise SystemExit('core input transport changed '+m)
          req=['g_potionExclusive','g_chatMode','g_gameWindow','g_skillTurn','DirectTimedTapUnlocked','NextEnabledSkill','MaybeSendWsCombo','PotionRetryIntervalModel','ChatPauseModel','ChatInjectedEnterCloses','WSDefaults_75_50','FrameVisibleHold','WSEveryShot','WSTiming']
          for x in req:
            if x not in b:raise SystemExit('missing '+x)
          if 'BuildMinorBatch(fresh,burst)' in b:raise SystemExit('minor catch-up burst remains')
          if 'for(int i=0;i<4;i++){if(!a.skillEnabled[i])continue;' in b:raise SystemExit('old multi-skill dump remains')
          chat=b.index('if((vk==VK_RETURN||(vk==VK_ESCAPE&&g_chatMode.load()))&&gameFg)')
          reject=b.index('if(!r.powerEnabled||injected)',chat)
          if chat>reject:raise SystemExit('chat injected enter handled too late')
          ws=fn(b,'void MaybeSendWsCombo')
          if 'g_wsTurn' in ws or 'now-last' in ws:raise SystemExit('old alternating/cadence WS logic remains')
          for x in ["InterruptibleAttackDelay(a.wDelayMs)","ReferenceTapKey('W')","InterruptibleAttackDelay(a.sDelayMs)","ReferenceTapKey('S')"]:
            if x not in ws:raise SystemExit('missing deterministic WS '+x)
          if 'int wDelayMs=75;' not in b or 'int sDelayMs=50;' not in b:raise SystemExit('WS defaults missing')
          if '18000,3000' not in b or '26000,3000' not in b or '65000' not in b:raise SystemExit('frame-visible cure timing missing')
          print('CoreScanCodeFIFO=PASS');print('ExistingStructurePreserved=PASS');print('ChatInjectedEnterRecoveryModel=PASS');print('DeterministicWSModel=PASS');print('CureFrameVisibleModel=PASS')
          '@ | python -
          if($LASTEXITCODE){throw 'preservation audit failed'}
      - name: Build native x64
        shell: pwsh
        working-directory: premium_plus_combo_final/v482-final
        run: |
          @'
          #include <windows.h>
          1 VERSIONINFO
           FILEVERSION 4,8,2,0
           PRODUCTVERSION 4,8,2,0
           FILEOS 0x40004L
           FILETYPE 0x1L
          BEGIN
           BLOCK "StringFileInfo" BEGIN BLOCK "041F04E6" BEGIN
            VALUE "FileDescription", "Premium Plus Combo - Rogue / Attack\0"
            VALUE "FileVersion", "4.8.2.0\0"
            VALUE "ProductName", "Premium Plus Combo\0"
            VALUE "ProductVersion", "4.8.2.0\0"
           END END
           BLOCK "VarFileInfo" BEGIN VALUE "Translation", 0x041F, 1254 END
          END
          '@ | Set-Content app.rc -Encoding Ascii
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="1.0.0.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"/><description>Premium Plus Combo - Rogue</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content final.manifest -Encoding UTF8
          rc /nologo app.rc;if($LASTEXITCODE){throw 'rc failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo-Test.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFESTUAC:"level='asInvoker' uiAccess='false'";if($LASTEXITCODE){throw 'test build failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO;if($LASTEXITCODE){throw 'final build failed'}
          mt.exe -manifest final.manifest "-outputresource:PremiumPlusCombo.exe;#1";if($LASTEXITCODE){throw 'manifest failed'}
      - name: Self tests
        shell: pwsh
        working-directory: premium_plus_combo_final/v482-final
        run: |
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--self-test' -Wait -PassThru;if($p.ExitCode){Get-Content self-test-report.txt;throw 'self-test failed'}
          $r=Get-Content self-test-report.txt -Raw
          foreach($x in @('TOTAL=168','PASSED=168','AttackRoundRobin=PASS','WSDefaults_75_50=PASS','PotionRetryIntervalModel=PASS','ChatPauseModel=PASS','ChatEnterOpens=PASS','ChatInjectedEnterCloses=PASS','ChatEscapeCloses=PASS','GameGlyph4=PASS','GameGlyph2=PASS','GameGlyph6=PASS','GameGlyph9=PASS','GameGlyph8=PASS','GameGlyphSlash=PASS','MinorReferenceSequenceModel=PASS','ScanCodeTransport=PASS')){if($r -notmatch [regex]::Escape($x)){throw "missing $x"}}
          if($r -match '=FAIL'){throw 'self-test reports failure'}
          Get-Content self-test-report.txt
      - name: Transport observer
        shell: pwsh
        working-directory: premium_plus_combo_final/v482-final
        run: |
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--transport-observer-test' -Wait -PassThru;if($p.ExitCode){Get-Content transport-observer-report.txt;throw 'transport failed'}
          $r=Get-Content transport-observer-report.txt -Raw;foreach($x in @('8_Down=24','9_Down=24','0_Down=24','R_Down=24','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($x)){throw "missing $x"}};Get-Content transport-observer-report.txt
      - name: Attack deterministic WS observer
        shell: pwsh
        working-directory: premium_plus_combo_final/v482-final
        run: |
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--attack-observer-test' -Wait -PassThru;if($p.ExitCode){Get-Content attack-observer-report.txt;throw 'attack observer failed'}
          $r=Get-Content attack-observer-report.txt -Raw
          foreach($x in @('Z_Down=4','W_Down=4','S_Down=4','Skill2_Down=1','Skill3_Down=1','Skill4_Down=1','Skill5_Down=1','RoundRobin=PASS','WSEveryShot=PASS','WSTiming=PASS','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($x)){throw "missing $x"}}
          Get-Content attack-observer-report.txt
      - name: Cure frame-visible observer
        shell: pwsh
        working-directory: premium_plus_combo_final/v482-final
        run: |
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--cure-observer-test' -Wait -PassThru;if($p.ExitCode){Get-Content cure-observer-report.txt;throw 'cure observer failed'}
          $r=Get-Content cure-observer-report.txt -Raw;foreach($x in @('F2_Down=1','6_Down=1','F1_Down=1','FrameVisibleHold=PASS','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($r -notmatch [regex]::Escape($x)){throw "missing $x"}};Get-Content cure-observer-report.txt
      - name: Defender, PE and report
        shell: pwsh
        working-directory: premium_plus_combo_final/v482-final
        run: |
          mt.exe "-inputresource:PremiumPlusCombo.exe;#1" -out:embedded.manifest
          dumpbin /headers PremiumPlusCombo.exe | Set-Content headers.txt;dumpbin /imports PremiumPlusCombo.exe | Set-Content imports.txt
          $h=Get-Content headers.txt -Raw;$i=Get-Content imports.txt -Raw;if($h -notmatch 'machine \(x64\)'){throw 'not x64'};if($h -match 'E0000060'){throw 'RWX section found'}
          foreach($b in @('WINHTTP.dll','WININET.dll','WS2_32.dll','VCRUNTIME140.dll','MSVCP140.dll')){if($i -match [regex]::Escape($b)){throw "unexpected import $b"}}
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe";if(-not(Test-Path $mp)){$mp=Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory|Sort-Object Name -Descending|%{Join-Path $_.FullName 'MpCmdRun.exe'}|?{Test-Path $_}|Select-Object -First 1};if(-not $mp){throw 'Defender unavailable'};& $mp -Scan -ScanType 3 -File (Resolve-Path .\PremiumPlusCombo.exe) -DisableRemediation;if($LASTEXITCODE){throw 'Defender failed'}
          $exe=(Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash;$size=(Get-Item PremiumPlusCombo.exe).Length;$lat=(Get-Content cure-observer-report.txt|?{$_ -like 'LatencyMs=*'});$holds=(Get-Content cure-observer-report.txt|?{$_ -like '*_HoldMs=*'});$ws=(Get-Content attack-observer-report.txt|?{$_ -like '*After*Ms=*'})
          @"
          Product=PremiumPlusCombo
          Version=4.8.2.0
          SourceSHA256=4ADB36530C2FBB0A16AEE71D6A750B13812786AC8252992C7B7C7949C64F7B73
          ReferenceV47SourceSHA256=E2598A67B26CB0EFB4AEA05AC4C329D9F4098FCDEF645F2E6EF0D5A3CA0F1F07
          ExistingUIAndRogueStructurePreserved=PASS
          FIFOScanCodeTransportPreserved=PASS
          MinorNoCatchupBurst=PASS
          ChatInjectedEnterRecovery=PASS
          PotionAtomicRetry=PASS
          ExactHPMPReader=PASS
          AttackRoundRobin=PASS
          WSEveryShot=PASS
          WSDefaults=75/50
          $ws
          CureSinglePressFrameVisible=PASS
          $holds
          $lat
          SelfTest=168/168 PASS
          TransportObserver=PASS
          AttackObserver=PASS
          CureObserver=PASS
          Overlap=0
          DefenderScan=PASS
          EXESHA256=$exe
          Size=$size
          RealGameVerification=USER_SIDE_REQUIRED
          "@|Set-Content BUILD-INFO.txt;Get-Content BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-v4.8.2-FINAL-CANDIDATE
          path: |
            premium_plus_combo_final/v482-final/PremiumPlusCombo.exe
            premium_plus_combo_final/v482-final/main.cpp
            premium_plus_combo_final/v482-final/BUILD-INFO.txt
            premium_plus_combo_final/v482-final/self-test-report.txt
            premium_plus_combo_final/v482-final/transport-observer-report.txt
            premium_plus_combo_final/v482-final/attack-observer-report.txt
            premium_plus_combo_final/v482-final/cure-observer-report.txt
            premium_plus_combo_final/v482-final/embedded.manifest
            premium_plus_combo_final/v482-final/imports.txt
            premium_plus_combo_final/v482-final/headers.txt
          retention-days: 14
