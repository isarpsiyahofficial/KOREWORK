name: Makro2 Defender Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [ premium-plus-combo-cure-attack-vitals-ws ]
    paths:
      - '.github/workflows/makro2-defender-diagnostic.yml'

permissions:
  actions: read
  contents: read

jobs:
  defender-scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact R-chase artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $uri='https://api.github.com/repos/isarpsiyahofficial/KOREWORK/actions/artifacts/9888168514/zip'
          Invoke-WebRequest -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -Uri $uri -OutFile artifact.zip
          Expand-Archive artifact.zip -DestinationPath exact -Force
          $exe=Resolve-Path 'exact/Makro2_v4.8.13_MOB_ATTACK_R_CHASE.exe'
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash
          if($sha -ne '15A091C9FD3D69D2EBA74DEAF911DEA19FC3BCC319A3F689471DACB0DF5856DC'){throw "Unexpected EXE SHA $sha"}
          "EXE_SHA256=$sha" | Set-Content defender-diagnostic.txt
      - name: Inspect Defender state
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          try {
            Get-MpComputerStatus | Format-List AMServiceEnabled,AntivirusEnabled,AntispywareEnabled,BehaviorMonitorEnabled,IoavProtectionEnabled,RealTimeProtectionEnabled,AntivirusSignatureVersion,AntivirusSignatureLastUpdated | Out-String | Tee-Object -FilePath defender-state.txt
          } catch {
            "Get-MpComputerStatus failed: $($_.Exception.Message)" | Tee-Object -FilePath defender-state.txt
          }
      - name: Scan exact EXE with Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $exe=(Resolve-Path 'exact/Makro2_v4.8.13_MOB_ATTACK_R_CHASE.exe').Path
          $candidates=@(
            "$env:ProgramFiles\Windows Defender\MpCmdRun.exe",
            (Get-ChildItem 'C:\ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName)
          ) | Where-Object { $_ -and (Test-Path $_) }
          if(-not $candidates){
            'MPCMDRUN=UNAVAILABLE' | Tee-Object -FilePath defender-scan.txt
            exit 0
          }
          $mp=$candidates[0]
          "MPCMDRUN=$mp" | Tee-Object -FilePath defender-scan.txt
          & $mp -Scan -ScanType 3 -File $exe -DisableRemediation 2>&1 | Tee-Object -FilePath defender-scan-output.txt
          $code=$LASTEXITCODE
          "MPCMDRUN_EXIT=$code" | Add-Content defender-scan.txt
          try {
            Get-MpThreatDetection | Sort-Object InitialDetectionTime -Descending | Select-Object -First 20 ThreatID,ThreatStatusID,InitialDetectionTime,Resources | Format-List | Out-String | Set-Content defender-threats.txt
          } catch {
            "Get-MpThreatDetection failed: $($_.Exception.Message)" | Set-Content defender-threats.txt
          }
          # Diagnostic only: preserve logs even if Defender reports a finding.
          exit 0
      - name: Static suspicious-API guard
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe='exact/Makro2_v4.8.13_MOB_ATTACK_R_CHASE.exe'
          dumpbin /imports $exe | Set-Content imports-defender.txt
          $i=Get-Content imports-defender.txt -Raw
          foreach($bad in @('WINHTTP.dll','WININET.dll','WS2_32.dll','CreateRemoteThread','WriteProcessMemory','VirtualAllocEx','OpenProcess')){
            if($i -match [regex]::Escape($bad)){throw "Suspicious import present: $bad"}
          }
          'STATIC_SUSPICIOUS_IMPORTS=NONE' | Add-Content defender-diagnostic.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Makro2-Defender-Diagnostic
          path: |
            defender-diagnostic.txt
            defender-state.txt
            defender-scan.txt
            defender-scan-output.txt
            defender-threats.txt
            imports-defender.txt
          retention-days: 14
