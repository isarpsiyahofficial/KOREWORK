name: PremiumPlusCombo v4.8.5 Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [premium-plus-combo-cure-attack-vitals-ws]
    paths:
      - '.github/workflows/premium-plus-combo-v485-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x64}
      - name: Reconstruct exact v4.8.5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force premium_plus_combo_final/v485-diagnostic | Out-Null
          @'
          import base64,gzip,pathlib,hashlib,subprocess
          r=pathlib.Path('premium_plus_combo_final');o=r/'v485-diagnostic';src=r/'source'/'vnext_48';m=o/'main.cpp'
          cs=sorted((r/'source'/'vnext_47').glob('c*.txt'));m.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in cs))))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='e2598a67b26cb0efb4aea05ac4c329d9f4098fcdef645f2e6ef0d5a3ca0f1f07'
          for n,s in [('v47_to_v48.patch.gz.b64',0),('v48_observer_fix2.patch.gz.b64',0),('v481_to_v482.patch.gz.b64',1),('v482_to_v4821.patch.gz.b64',1),('v4821_to_v4822.patch.gz.b64',1)]:
            p=o/(n+'.patch');p.write_bytes(gzip.decompress(base64.b64decode((src/n).read_text().strip())));subprocess.run(['git','apply',f'-p{s}',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='6e857a8a6ccd570d34348dd265ea63e57fe9d3240d9a05447b39a3794fe1cabb'
          pcs=sorted(src.glob('v483_final_c*.txt'));p=o/'v483.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='56a57c7a65f5a091be9298f3388c82c4c4097392f96a17bd932e26dd00fcc839'
          pcs=sorted(src.glob('v483_to_v484_[0-9][0-9].b64'));p=o/'v484.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='3a2dd16737d825deab01de7af55b1a3ccd81476aad2a4b472d7aaeb1ad07ff0f'
          pcs=sorted(src.glob('v484_to_v485_[0-9][0-9].b64'));p=o/'v485.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          sha=hashlib.sha256(m.read_bytes()).hexdigest();print('V485SourceSHA256='+sha.upper());assert sha=='916e2a370c5ed6eecf01e1ba1a3a79cab2dc45c703f781ff1189ecc711989e93'
          '@ | python -
          if($LASTEXITCODE){throw 'reconstruction failed'}
      - name: Build diagnostic x64
        shell: pwsh
        working-directory: premium_plus_combo_final/v485-diagnostic
        run: |
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp /Fe:PremiumPlusCombo-Test.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT
          if($LASTEXITCODE){throw 'build failed'}
      - name: Run all reports without early abort
        shell: pwsh
        working-directory: premium_plus_combo_final/v485-diagnostic
        run: |
          foreach($arg in @('--self-test','--transport-observer-test','--attack-observer-test','--attack-z-off-observer-test','--cure-observer-test')){
            $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList $arg -Wait -PassThru
            Write-Host "$arg EXIT=$($p.ExitCode)"
          }
          foreach($f in @('self-test-report.txt','transport-observer-report.txt','attack-observer-report.txt','attack-z-off-observer-report.txt','cure-observer-report.txt')){
            Write-Host "===== $f ====="
            if(Test-Path $f){Get-Content $f}else{Write-Host 'MISSING'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PremiumPlusCombo-v4.8.5-DIAGNOSTIC
          path: |
            premium_plus_combo_final/v485-diagnostic/main.cpp
            premium_plus_combo_final/v485-diagnostic/self-test-report.txt
            premium_plus_combo_final/v485-diagnostic/transport-observer-report.txt
            premium_plus_combo_final/v485-diagnostic/attack-observer-report.txt
            premium_plus_combo_final/v485-diagnostic/attack-z-off-observer-report.txt
            premium_plus_combo_final/v485-diagnostic/cure-observer-report.txt
          retention-days: 2
