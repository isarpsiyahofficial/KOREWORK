name: PremiumPlusCombo v4.8.9 Category Control Final

on:
  push:
    branches: [ premium-plus-combo-cure-attack-vitals-ws ]
    paths:
      - 'premium_plus_combo_final/source/vnext_48/v488_to_v489_category_transform.py'
      - '.github/workflows/premium-plus-combo-v489-category-control.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Reconstruct exact v4.8.9 and preservation audit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force premium_plus_combo_final/v489-final | Out-Null
          @'
          import base64,gzip,pathlib,hashlib,subprocess
          r=pathlib.Path('premium_plus_combo_final');o=r/'v489-final';src=r/'source'/'vnext_48';m=o/'main.cpp'
          cs=sorted((r/'source'/'vnext_47').glob('c*.txt'));m.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in cs))))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='e2598a67b26cb0efb4aea05ac4c329d9f4098fcdef645f2e6ef0d5a3ca0f1f07'
          for n,s in [('v47_to_v48.patch.gz.b64',0),('v48_observer_fix2.patch.gz.b64',0),('v481_to_v482.patch.gz.b64',1),('v482_to_v4821.patch.gz.b64',1),('v4821_to_v4822.patch.gz.b64',1)]:
            p=o/(n+'.patch');p.write_bytes(gzip.decompress(base64.b64decode((src/n).read_text().strip())));subprocess.run(['git','apply',f'-p{s}',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='6e857a8a6ccd570d34348dd265ea63e57fe9d3240d9a05447b39a3794fe1cabb'
          pcs=sorted(src.glob('v483_final_c*.txt'));p=o/'v483.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='56a57c7a65f5a091be9298f3388c82c4c4097392f96a17bd932e26dd00fcc839'
          pcs=sorted(src.glob('v483_to_v484_[0-9][0-9].b64'));p=o/'v484.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='3a2dd16737d825deab01de7af55b1a3ccd81476aad2a4b472d7aaeb1ad07ff0f'
          pcs=sorted(src.glob('v484_to_v485_[0-9][0-9].b64'));p=o/'v485.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='916e2a370c5ed6eecf01e1ba1a3a79cab2dc45c703f781ff1189ecc711989e93'
          p=o/'v486.patch';p.write_bytes(gzip.decompress(base64.b64decode((src/'v485_to_v486.patch.gz.b64').read_text().strip())));subprocess.run(['git','apply','--directory=premium_plus_combo_final/v489-final','-p1',str(p)],check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='9320d8f6893ca478af35385c42ad2cdec1c9cc1b838b77e25840d352d9b23dd7'
          p=o/'v488.patch';p.write_bytes(gzip.decompress(base64.b64decode((src/'v486_to_v488.patch.gz.b64').read_text().strip())));subprocess.run(['git','apply','-p1',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='85d7804a4c287b796d651985c2f780a0c5c20c008737112c46696b90e1f561d0'
          (o/'reference-v488.cpp').write_bytes(m.read_bytes())
          '@ | python -
          if($LASTEXITCODE){throw 'v488 reconstruction failed'}
          python premium_plus_combo_final/source/vnext_48/v488_to_v489_category_transform.py premium_plus_combo_final/v489-final/main.cpp
          if($LASTEXITCODE){throw 'v489 transform failed'}
          @'
          from pathlib import Path
          import hashlib
          a=Path('premium_plus_combo_final/v489-final/reference-v488.cpp').read_text(encoding='utf-8')
          b=Path('premium_plus_combo_final/v489-final/main.cpp').read_text(encoding='utf-8')
          assert hashlib.sha256(b.encode()).hexdigest()=='63f36cd8fff25b574b178064fa421e36c9d4bcfa4f400947da03f8a978d9ae12'
          def fn(s,k):
            p=s.index(k);q=s.index('{',p);d=0
            for i in range(q,len(s)):
              if s[i]=='{':d+=1
              elif s[i]=='}':
                d-=1
                if d==0:return s[p:i+1]
            raise RuntimeError(k)
          # Timing/input core and current v4.8.8 W/S behavior must be byte-identical.
          for k in ['void WsWorker','void MaybeSendWsCombo','UINT ReferenceSendInputsUnlocked','UINT ReferenceSendInputs(','bool ReferenceTapKeyUnlocked','bool ReferenceTapKey(','bool DirectTimedTapUnlocked','void VitalsWorker','bool RunSelfTest']:
            assert fn(a,k)==fn(b,k),'preservation failed '+k
          # ExecuteAttack may differ only by the optional restore-main-bar guard.
          old=fn(a,'void ExecuteAttack');new=fn(b,'void ExecuteAttack')
          assert new.replace('a.restoreMainBar&&','')==old,'unexpected ExecuteAttack change'
          assert 'bool restoreMainBar=true;' in b and 'bool categoryEnabled=true;' in b
          assert 'ReadDword(k,L"RestoreMainBar",1)!=0' in b
          assert b.count('ReadDword(k,L"CategoryEnabled",1)!=0')==2
          assert 'L"ROGUE AKTİF"' in b and 'L"ATTACK AKTİF"' in b
          assert 'BS_AUTOCHECKBOX' in b and 'IDC_ATTACK_RESTORE_ENABLE' in b
          kb=fn(b,'LRESULT CALLBACK KeyboardProc')
          for x in ['r.categoryEnabled&&vk==r.startHotkey','a.categoryEnabled&&vk==a.startHotkey','r.categoryEnabled&&r.cureEnabled']:
            assert x in kb,x
          assert '!r.categoryEnabled||!g_minorActive' in fn(b,'void MinorWorker')
          assert '!r.categoryEnabled||!g_minorActive' in fn(b,'void RWorker')
          assert '!r.categoryEnabled||!r.cureEnabled' in fn(b,'void CureWorker')
          assert 'a.categoryEnabled&&g_attackActive' in fn(b,'void AttackWorker')
          assert 'a.restoreMainBar&&wantedBar!=a.restoreBar' in new
          # No timing defaults were changed.
          assert 'int wDelayMs=400;' in b and 'int sDelayMs=50;' in b
          assert "constexpr int kWsVisibleHoldUs=18000" in b and "constexpr int kWsReleaseGapUs=1200" in b
          print('ExistingV488TimingPreserved=PASS')
          print('WSWorkerByteIdentical=PASS')
          print('CoreTransportByteIdentical=PASS')
          print('RunSelfTestByteIdentical=PASS')
          print('OptionalMainBarGuard=PASS')
          print('RogueCategoryGate=PASS')
          print('AttackCategoryGate=PASS')
          '@ | python -
          if($LASTEXITCODE){throw 'preservation audit failed'}

      - name: Build x64 final
        shell: pwsh
        working-directory: premium_plus_combo_final/v489-final
        run: |
          $ErrorActionPreference='Stop'
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="4.8.9.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"/><description>Premium Plus Combo - Rogue</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content final.manifest -Encoding UTF8
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp /Fe:PremiumPlusCombo-Test.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT
          if($LASTEXITCODE){throw 'test build failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp /Fe:PremiumPlusCombo.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO
          if($LASTEXITCODE){throw 'final build failed'}
          mt.exe -manifest final.manifest "-outputresource:PremiumPlusCombo.exe;#1"
          if($LASTEXITCODE){throw 'manifest failed'}
          mt.exe "-inputresource:PremiumPlusCombo.exe;#1" -out:embedded.manifest
          if((Get-Content embedded.manifest -Raw) -notmatch 'requireAdministrator'){throw 'manifest missing'}

      - name: Full regression and timing stability
        shell: pwsh
        working-directory: premium_plus_combo_final/v489-final
        run: |
          $ErrorActionPreference='Stop'
          foreach($arg in @('--self-test','--transport-observer-test','--attack-z-off-observer-test','--cure-observer-test')){
            $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList $arg -Wait -PassThru
            if($p.ExitCode){throw "$arg failed exit $($p.ExitCode)"}
          }
          $s=Get-Content self-test-report.txt -Raw
          foreach($x in @('TOTAL=176','PASSED=176','AttackOrderedThreeSkills=PASS','MinorReferenceSequenceModel=PASS','ScanCodeTransport=PASS')){if($s -notmatch [regex]::Escape($x)){throw "selftest missing $x"}}
          $w=@();$sg=@();$sp=@()
          1..4 | ForEach-Object {
            $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--attack-observer-test' -Wait -PassThru
            if($p.ExitCode){throw "attack run $_ failed"}
            $a=Get-Content attack-observer-report.txt -Raw
            foreach($x in @('W_Down=4','S_Down=4','RoundRobin=PASS','BarAssertion=PASS','SkillCycleSync=PASS','WSEverySkill=PASS','WSTiming=PASS','WSFrameVisible=PASS','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($a -notmatch [regex]::Escape($x)){throw "attack missing $x"}}
            $w += [int](($a -split "`n"|?{$_ -like 'WAfterSkillMs=*'}) -replace 'WAfterSkillMs=','')
            $sg += [int](($a -split "`n"|?{$_ -like 'SAfterWMs=*'}) -replace 'SAfterWMs=','')
            $sp += [int](($a -split "`n"|?{$_ -like 'SyncedAttackSpanMs=*'}) -replace 'SyncedAttackSpanMs=','')
          }
          $wmin=($w|Measure-Object -Minimum).Minimum;$wmax=($w|Measure-Object -Maximum).Maximum;$wavg=[math]::Round(($w|Measure-Object -Average).Average,1)
          $smin=($sg|Measure-Object -Minimum).Minimum;$smax=($sg|Measure-Object -Maximum).Maximum;$savg=[math]::Round(($sg|Measure-Object -Average).Average,1)
          if($wmin -lt 390 -or $wmax -gt 430){throw "W timing changed $wmin-$wmax"}
          if($smin -lt 42 -or $smax -gt 70){throw "S timing changed $smin-$smax"}
          $t=Get-Content transport-observer-report.txt -Raw;foreach($x in @('ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($t -notmatch [regex]::Escape($x)){throw "transport missing $x"}}
          $z=Get-Content attack-z-off-observer-report.txt -Raw;foreach($x in @('Z_Down=0','ZOff=PASS','Overlap=0','RESULT=PASS')){if($z -notmatch [regex]::Escape($x)){throw "zoff missing $x"}}
          $c=Get-Content cure-observer-report.txt -Raw;foreach($x in @('F2_Down=1','6_Down=1','F1_Down=1','FrameVisibleHold=PASS','Overlap=0','RESULT=PASS')){if($c -notmatch [regex]::Escape($x)){throw "cure missing $x"}}
          dumpbin /headers PremiumPlusCombo.exe | Set-Content headers.txt
          dumpbin /imports PremiumPlusCombo.exe | Set-Content imports.txt
          $h=Get-Content headers.txt -Raw;$i=Get-Content imports.txt -Raw
          if($h -notmatch 'machine \(x64\)'){throw 'not x64'}
          if($h -match 'E0000060'){throw 'RWX section found'}
          foreach($bad in @('WINHTTP.dll','WININET.dll','WS2_32.dll','VCRUNTIME140.dll','MSVCP140.dll')){if($i -match [regex]::Escape($bad)){throw "unexpected $bad"}}
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if(-not(Test-Path $mp)){$mp=Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory|Sort-Object Name -Descending|%{Join-Path $_.FullName 'MpCmdRun.exe'}|?{Test-Path $_}|Select-Object -First 1}
          if($mp){& $mp -Scan -ScanType 3 -File (Resolve-Path .\PremiumPlusCombo.exe) -DisableRemediation;if($LASTEXITCODE){throw 'Defender failed'}}
          $sha=(Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash;$size=(Get-Item PremiumPlusCombo.exe).Length
          @"
          Product=PremiumPlusCombo
          Version=4.8.9.0
          SourceSHA256=63F36CD8FFF25B574B178064FA421E36C9D4BCFA4F400947DA03F8A978D9AE12
          ReferenceV488SourceSHA256=85D7804A4C287B796D651985C2F780A0C5C20C008737112C46696B90E1F561D0
          ExistingV488TimingPreserved=PASS
          WSWorkerByteIdentical=PASS
          CoreTransportByteIdentical=PASS
          SelfTest=176/176 PASS
          MinorCureRRegression=PASS
          OptionalMainBarReturn=PASS
          OptionalMainBarDefault=ON
          RogueCategoryToggle=PASS
          AttackCategoryToggle=PASS
          CategoryDefaults=ON
          ExistingRegistryTimingValuesPreserved=PASS
          WReferenceConfiguredMs=400
          WReferenceActualMinMs=$wmin
          WReferenceActualMaxMs=$wmax
          WReferenceActualAvgMs=$wavg
          SReferenceConfiguredMs=50
          SReferenceActualMinMs=$smin
          SReferenceActualMaxMs=$smax
          SReferenceActualAvgMs=$savg
          Overlap=0
          DefenderScan=PASS
          RequireAdministratorManifest=PASS
          EXESHA256=$sha
          Size=$size
          RealGameVerification=USER_SIDE_REQUIRED
          "@ | Set-Content BUILD-INFO.txt
          Get-Content BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-v4.8.9-CATEGORY-CONTROL-FINAL
          retention-days: 14
          path: |
            premium_plus_combo_final/v489-final/PremiumPlusCombo.exe
            premium_plus_combo_final/v489-final/main.cpp
            premium_plus_combo_final/v489-final/BUILD-INFO.txt
            premium_plus_combo_final/v489-final/self-test-report.txt
            premium_plus_combo_final/v489-final/transport-observer-report.txt
            premium_plus_combo_final/v489-final/attack-observer-report.txt
            premium_plus_combo_final/v489-final/attack-z-off-observer-report.txt
            premium_plus_combo_final/v489-final/cure-observer-report.txt
            premium_plus_combo_final/v489-final/embedded.manifest
            premium_plus_combo_final/v489-final/headers.txt
            premium_plus_combo_final/v489-final/imports.txt
