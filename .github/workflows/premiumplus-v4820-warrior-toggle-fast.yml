name: PremiumPlus v4.8.20 Warrior Toggle Fast

on:
  push:
    branches: [ premiumplus-v4820-warrior-toggle-fast ]
    paths:
      - '.github/workflows/premiumplus-v4820-warrior-toggle-fast.yml'
      - 'premium_plus_combo_final/workbench/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify exact known-good source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import pathlib,hashlib
          p=pathlib.Path('premium_plus_combo_final/workbench/makro2_v4811_exact.cpp')
          b=p.read_bytes().replace(b'\r\n',b'\n')
          sha=hashlib.sha256(b).hexdigest().upper()
          print('SOURCE_SHA256='+sha)
          assert sha=='3AECB38864D0C248F926C9F15A8FF7F5BE4A1636ACAB966ADC40DA350C142A42'
          '@ | python -

      - name: Generate v4.8.19 reference and v4.8.20 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='premium_plus_combo_final/workbench/makro2_v4811_exact.cpp'
          $ref='premium_plus_combo_final/workbench/premiumplus_v4819_reference.cpp'
          $out='premium_plus_combo_final/workbench/premiumplus_v4820.cpp'
          python premium_plus_combo_final/workbench/apply_mob_dynamic.py $base $ref
          if($LASTEXITCODE){throw 'apply_mob_dynamic failed'}
          python premium_plus_combo_final/workbench/post_mob_dynamic_fix.py $ref
          if($LASTEXITCODE){throw 'post_mob_dynamic_fix failed'}
          python premium_plus_combo_final/workbench/post_mob_r_chase.py $ref
          if($LASTEXITCODE){throw 'post_mob_r_chase failed'}
          python premium_plus_combo_final/workbench/post_ui_compact_tabs.py $ref
          if($LASTEXITCODE){throw 'post_ui_compact_tabs failed'}
          python premium_plus_combo_final/workbench/post_warrior_rightclick.py $ref
          if($LASTEXITCODE){throw 'post_warrior_rightclick failed'}
          python premium_plus_combo_final/workbench/post_warrior_defender_clean.py $ref
          if($LASTEXITCODE){throw 'post_warrior_defender_clean failed'}
          @'
          import pathlib
          p=pathlib.Path('premium_plus_combo_final/workbench/premiumplus_v4819_reference.cpp')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Premium Plus Combo | v4.8.17','Premium Plus Combo | v4.8.19')
          if 'Premium Plus Combo | v4.8.19' not in s: raise SystemExit('v4819 title patch failed')
          p.write_text(s,encoding='utf-8',newline='\n')
          '@ | python -
          Copy-Item $ref $out
          python premium_plus_combo_final/workbench/post_warrior_toggle_fast.py $out
          if($LASTEXITCODE){throw 'post_warrior_toggle_fast failed'}

      - name: Preserve v4.8.19 working modules
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import pathlib,hashlib
          old=pathlib.Path('premium_plus_combo_final/workbench/premiumplus_v4819_reference.cpp').read_text(encoding='utf-8')
          new=pathlib.Path('premium_plus_combo_final/workbench/premiumplus_v4820.cpp').read_text(encoding='utf-8')
          def fn(t,sig):
              p=t.index(sig); q=t.index('{',p); d=0
              for i in range(q,len(t)):
                  if t[i]=='{': d+=1
                  elif t[i]=='}':
                      d-=1
                      if d==0:return t[p:i+1]
              raise RuntimeError(sig)
          protected=[
            'void MinorWorker()','void RWorker()','void CureWorker()','void WsWorker()',
            'void AttackWorker()','void VitalsWorker()','void MobSkillWorker()',
            'void MobChaseWorker()','void MobScrollWorker()','void MobPriestWorker()',
            'void ReadAttackUi(bool persist=true)','void ReadMobUi(bool persist=true)',
            'void CreateAttackPage()','void CreateMobPage()','void ShowCategory(int category)'
          ]
          for sig in protected:
              a,b=fn(old,sig),fn(new,sig)
              if a!=b: raise SystemExit('V4819_MODULE_CHANGED='+sig)
              print('UNCHANGED='+sig+' SHA256='+hashlib.sha256(a.encode()).hexdigest())
          print('V4819_WORKING_MODULES_PRESERVED=PASS')
          '@ | python -

      - name: Warrior source audit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import pathlib
          s=pathlib.Path('premium_plus_combo_final/workbench/premiumplus_v4820.cpp').read_text(encoding='utf-8')
          for bad in ['CreateRemoteThread','WriteProcessMemory','VirtualAllocEx','WinHttpOpen','InternetOpenW','WSAStartup']:
              if bad in s: raise SystemExit('forbidden source API '+bad)
          for required in ['Slot4FourthColumn','OneSharedHotkey','WarriorResolveVisibleInventory','BeginCalibration(3)','Ekipman Değiştir','TOTAL=']:
              if required not in s: raise SystemExit('missing v4820 marker '+required)
          if 'case IDC_WARRIOR_WEAPON_KEY:' in s: raise SystemExit('second Warrior hotkey command remains')
          p=s.index('bool WarriorRightClickSlot');q=s.index('{',p);d=0
          for i in range(q,len(s)):
              if s[i]=='{':d+=1
              elif s[i]=='}':
                  d-=1
                  if d==0:end=i+1;break
          w=s[p:end]
          for good in ['MOUSEEVENTF_RIGHTDOWN','MOUSEEVENTF_RIGHTUP','MOUSEEVENTF_ABSOLUTE']:
              if good not in w: raise SystemExit('missing Warrior action '+good)
          for bad in ['MOUSEEVENTF_LEFTDOWN','MOUSEEVENTF_LEFTUP','mouse_event(','GetCursorPos','SetCursorPos']:
              if bad in w: raise SystemExit('forbidden Warrior action '+bad)
          print('WARRIOR_RIGHT_CLICK_ONLY=PASS')
          print('WARRIOR_ONE_SHARED_HOTKEY=PASS')
          print('WARRIOR_LIVE_SLOT_SYNC=PASS')
          print('WARRIOR_CALIBRATION_ASSIST_FALLBACK=PASS')
          '@ | python -

      - name: Build v4.8.11 control with stable production settings
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          @'
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="4.8.11.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"></assemblyIdentity><description>Premium Plus Combo - Rogue</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"></requestedExecutionLevel></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content v4811-legacy.manifest -Encoding UTF8
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX makro2_v4811_exact.cpp /Fe:PremiumPlusCombo-v4.8.11-CONTROL.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO
          if($LASTEXITCODE){throw 'v4811 control build failed'}
          mt.exe -nologo -manifest v4811-legacy.manifest "-outputresource:PremiumPlusCombo-v4.8.11-CONTROL.exe;#1"
          if($LASTEXITCODE){throw 'v4811 manifest failed'}

      - name: Build v4.8.20 with same stable production settings
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          @'
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="4.8.20.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"></assemblyIdentity><description>Premium Plus Combo - Rogue</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"></requestedExecutionLevel></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content v4820-legacy.manifest -Encoding UTF8
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX premiumplus_v4820.cpp /Fe:PremiumPlusCombo-v4.8.20-STABLE.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO
          if($LASTEXITCODE){throw 'v4820 build failed'}
          mt.exe -nologo -manifest v4820-legacy.manifest "-outputresource:PremiumPlusCombo-v4.8.20-STABLE.exe;#1"
          if($LASTEXITCODE){throw 'v4820 manifest failed'}

      - name: PE shape and exact import-surface parity
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          @'
          import pathlib,struct,hashlib
          def pe(path):
              b=pathlib.Path(path).read_bytes();peoff=struct.unpack_from('<I',b,0x3c)[0];coff=peoff+4;sections=struct.unpack_from('<H',b,coff+2)[0];opt=coff+20;magic=struct.unpack_from('<H',b,opt)[0];assert magic==0x20b;dll=struct.unpack_from('<H',b,opt+0x46)[0];return b,peoff,coff,opt,sections,dll
          def rva_off(b,coff,opt,rva):
              n=struct.unpack_from('<H',b,coff+2)[0];sz=struct.unpack_from('<H',b,coff+16)[0];sec=coff+20+sz
              for i in range(n):
                  o=sec+i*40;vsz,va,rawsz,raw=struct.unpack_from('<IIII',b,o+8)
                  if va<=rva<va+max(vsz,rawsz):return raw+(rva-va)
              raise ValueError(hex(rva))
          def cstr(b,o):
              e=b.find(b'\0',o);return b[o:e].decode('ascii','replace')
          def imports(path):
              b,peoff,coff,opt,sections,dllc=pe(path);imp_rva,imp_sz=struct.unpack_from('<II',b,opt+0x70+8)
              out=set()
              if not imp_rva:return out
              d=rva_off(b,coff,opt,imp_rva)
              while True:
                  oft,ts,fc,name_rva,ft=struct.unpack_from('<IIIII',b,d)
                  if not (oft or name_rva or ft):break
                  dll=cstr(b,rva_off(b,coff,opt,name_rva)).lower();trva=oft or ft;to=rva_off(b,coff,opt,trva)
                  j=0
                  while True:
                      val=struct.unpack_from('<Q',b,to+j*8)[0]
                      if not val:break
                      if val & (1<<63):sym='#'+str(val&0xffff)
                      else:sym=cstr(b,rva_off(b,coff,opt,val)+2)
                      out.add(dll+'!'+sym);j+=1
                  d+=20
              return out
          c,_,_,_,cs,cd=pe('PremiumPlusCombo-v4.8.11-CONTROL.exe');n,_,_,_,ns,nd=pe('PremiumPlusCombo-v4.8.20-STABLE.exe')
          print('CONTROL_SIZE='+str(len(c)));print('RELEASE_SIZE='+str(len(n)));print('CONTROL_SECTIONS='+str(cs));print('RELEASE_SECTIONS='+str(ns));print('CONTROL_DLLCHAR=0x%04X'%cd);print('RELEASE_DLLCHAR=0x%04X'%nd)
          if len(c)!=419328:raise SystemExit('known-good control size diverged')
          if cs!=7 or cd!=0x8160 or ns!=7 or nd!=0x8160:raise SystemExit('stable PE family mismatch')
          ci,ni=imports('PremiumPlusCombo-v4.8.11-CONTROL.exe'),imports('PremiumPlusCombo-v4.8.20-STABLE.exe')
          print('CONTROL_IMPORTS='+str(len(ci)));print('RELEASE_IMPORTS='+str(len(ni)))
          extra=sorted(ni-ci);missing=sorted(ci-ni)
          if extra:print('EXTRA_IMPORTS='+','.join(extra))
          if missing:print('MISSING_IMPORTS='+','.join(missing))
          if ci!=ni:raise SystemExit('Windows API import surface differs from known-good v4.8.11 control')
          print('EXACT_IMPORT_SURFACE_MATCH=PASS')
          print('RELEASE_SHA256='+hashlib.sha256(n).hexdigest().upper())
          '@ | python -

      - name: Full regression and Warrior model tests
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          $p=Start-Process .\PremiumPlusCombo-v4.8.20-STABLE.exe -ArgumentList '--self-test' -Wait -PassThru
          if($p.ExitCode){throw "legacy self-test failed $($p.ExitCode)"}
          $a=Get-Content self-test-report.txt -Raw
          if($a -notmatch 'TOTAL=180' -or $a -notmatch 'PASSED=180'){throw '180/180 regression failed'}
          $p=Start-Process .\PremiumPlusCombo-v4.8.20-STABLE.exe -ArgumentList '--mob-model-test' -Wait -PassThru
          if($p.ExitCode){throw "mob model failed $($p.ExitCode)"}
          $m=Get-Content mob-model-test-report.txt -Raw
          if($m -notmatch 'TOTAL=8' -or $m -notmatch 'PASSED=8'){throw 'MOB 8/8 failed'}
          $p=Start-Process .\PremiumPlusCombo-v4.8.20-STABLE.exe -ArgumentList '--warrior-model-test' -Wait -PassThru
          if($p.ExitCode){throw "warrior model failed $($p.ExitCode)"}
          $w=Get-Content warrior-model-test-report.txt -Raw
          if($w -notmatch 'TOTAL=13' -or $w -notmatch 'PASSED=13' -or $w -notmatch 'Slot4FourthColumn=PASS' -or $w -notmatch 'OneSharedHotkey=PASS'){throw 'Warrior 13/13 or critical slot/hotkey test failed'}
          Get-Content warrior-model-test-report.txt

      - name: Microsoft Defender scan of actual release
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Continue'
          $result='UNAVAILABLE';$exe=(Resolve-Path '.\PremiumPlusCombo-v4.8.20-STABLE.exe').Path
          try { Update-MpSignature -ErrorAction SilentlyContinue } catch {}
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if(!(Test-Path $mp)){$mp=Get-ChildItem 'C:\ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName}
          if($mp -and (Test-Path $mp)){
            & $mp -Scan -ScanType 3 -File $exe -DisableRemediation 2>&1 | Tee-Object -FilePath defender-scan-output.txt
            $text=if(Test-Path defender-scan-output.txt){Get-Content defender-scan-output.txt -Raw}else{''}
            if($text -match 'found no threats'){$result='NO_THREATS'}
            elseif($text -match '(?i)(threat|virus|trojan|malware).*(found|detected)' -or $text -match '(?i)(found|detected).*(threat|virus|trojan|malware)'){$result='THREAT_REPORTED'}
          }
          "MICROSOFT_DEFENDER=$result" | Set-Content defender-result.txt
          if($result -eq 'THREAT_REPORTED'){throw 'Defender reported threat'}
          exit 0

      - name: Release report
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $sha=(Get-FileHash .\PremiumPlusCombo-v4.8.20-STABLE.exe -Algorithm SHA256).Hash
          $size=(Get-Item .\PremiumPlusCombo-v4.8.20-STABLE.exe).Length
          $def=if(Test-Path defender-result.txt){(Get-Content defender-result.txt -Raw).Trim()}else{'UNKNOWN'}
          @"
          Product=Premium Plus Combo
          Version=4.8.20
          Base=v4.8.19 STABLE / exact v4.8.11 source lineage
          V4819WorkingModulesPreserved=PASS
          WarriorSlotEditsLive=PASS
          WarriorSlot4Mapping=PASS
          WarriorSingleSharedHotkey=PASS
          WarriorToggleSequence=Shield-Weapon
          WarriorInventoryOpenFastPath=PASS
          WarriorCachedGridFastPath=PASS
          WarriorCalibrationAssist=OPTIONAL_VALIDATED_FALLBACK
          WarriorRightClickOnly=PASS
          InventoryKeyOnlyWhenGridNotFound=PASS
          LegacySelfTest=180/180 PASS
          MobModelTest=8/8 PASS
          WarriorModelTest=13/13 PASS
          ExactKnownGoodImportSurface=PASS
          PEStableFamily=7 sections / 0x8160
          $def
          EXE_SIZE=$size
          EXE_SHA256=$sha
          "@ | Set-Content PremiumPlusCombo-v4.8.20-REPORT.txt
          Get-Content PremiumPlusCombo-v4.8.20-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-v4.8.20-STABLE-WARRIOR-FIX
          path: |
            premium_plus_combo_final/workbench/PremiumPlusCombo-v4.8.20-STABLE.exe
            premium_plus_combo_final/workbench/PremiumPlusCombo-v4.8.20-REPORT.txt
            premium_plus_combo_final/workbench/self-test-report.txt
            premium_plus_combo_final/workbench/mob-model-test-report.txt
            premium_plus_combo_final/workbench/warrior-model-test-report.txt
            premium_plus_combo_final/workbench/defender-result.txt
            premium_plus_combo_final/workbench/defender-scan-output.txt
          if-no-files-found: warn
