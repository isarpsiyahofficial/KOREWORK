name: Content Runtime Validation

on:
  push:
    branches:
      - integration/**
    paths-ignore:
      - '.validation/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout KOREWORK
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Fetch pinned open KO assets
        shell: bash
        run: |
          git submodule sync -- upstream/ko-assets
          git submodule update --init --depth 1 upstream/ko-assets
          test -d upstream/ko-assets/game
          test -d upstream/ko-assets/server

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build full offline client and probes
        run: cmake --build build --target korework korework_content_probe korework_runtime_smoke korework_smd_smoke korework_texture_smoke korework_skeleton_smoke korework_animation_smoke

      - name: Run offline tests
        run: ctest --test-dir build --output-on-failure

      - name: Probe real KO map, model, skeleton, animation and texture chains
        shell: bash
        run: |
          build/bin/korework_content_probe upstream/ko-assets | tee ko-content-linux.txt
          for pattern in \
            'Runtime minimum: yes' \
            'SMD maps: [1-9][0-9]*' \
            'Collision main cells: [1-9][0-9]*' \
            'Character parts: [1-9][0-9]*' \
            'Populated skin LODs: [1-9][0-9]*' \
            'Skin vertices: [1-9][0-9]*' \
            'Skin faces: [1-9][0-9]*' \
            'Weighted vertices: [1-9][0-9]*' \
            'Skeleton joints: [1-9][0-9]*' \
            'Skin matrices: [1-9][0-9]*' \
            'Animation clips: [1-9][0-9]*' \
            'Idle clip: .+' \
            'Move clip: .+' \
            'Attack clip: .+' \
            'Texture dimensions: [1-9][0-9]* x [1-9][0-9]*' \
            'Texture RGBA bytes: [1-9][0-9]*'; do
            grep -Eq "$pattern" ko-content-linux.txt
          done

      - name: Upload Linux report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ko-content-linux
          path: ko-content-linux.txt
          if-no-files-found: ignore

  validate-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout KOREWORK
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Fetch pinned open KO assets
        shell: bash
        run: |
          git submodule sync -- upstream/ko-assets
          git submodule update --init --depth 1 upstream/ko-assets
          test -d upstream/ko-assets/game
          test -d upstream/ko-assets/server

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build full offline client and probes
        shell: pwsh
        run: cmake --build build --config Release --parallel 2 --target korework korework_content_probe korework_runtime_smoke korework_smd_smoke korework_texture_smoke korework_skeleton_smoke korework_animation_smoke

      - name: Run offline tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Probe real KO map, model, skeleton, animation and texture chains
        shell: pwsh
        run: |
          & build/bin/Release/korework_content_probe.exe upstream/ko-assets | Tee-Object -FilePath ko-content-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content ko-content-windows.txt -Raw
          foreach ($pattern in @('Runtime minimum: yes', 'SMD maps: [1-9][0-9]*', 'Collision main cells: [1-9][0-9]*', 'Character parts: [1-9][0-9]*', 'Populated skin LODs: [1-9][0-9]*', 'Skin vertices: [1-9][0-9]*', 'Skin faces: [1-9][0-9]*', 'Weighted vertices: [1-9][0-9]*', 'Skeleton joints: [1-9][0-9]*', 'Skin matrices: [1-9][0-9]*', 'Animation clips: [1-9][0-9]*', 'Idle clip: .+', 'Move clip: .+', 'Attack clip: .+', 'Texture dimensions: [1-9][0-9]* x [1-9][0-9]*', 'Texture RGBA bytes: [1-9][0-9]*')) {
            if ($report -notmatch $pattern) { throw "Missing validation pattern: $pattern" }
          }

      - name: Upload Windows report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ko-content-windows
          path: ko-content-windows.txt
          if-no-files-found: ignore

  record-result:
    needs:
      - validate-linux
      - validate-windows
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'push' }}
    steps:
      - name: Checkout validated branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Record validation result
        shell: bash
        env:
          LINUX_RESULT: ${{ needs.validate-linux.result }}
          WINDOWS_RESULT: ${{ needs.validate-windows.result }}
        run: |
          mkdir -p .validation
          if [[ "$LINUX_RESULT" == "success" && "$WINDOWS_RESULT" == "success" ]]; then STATUS=passed; else STATUS=failed; fi
          cat > .validation/content-runtime.txt <<EOF
          status=${STATUS}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          validated_commit=${GITHUB_SHA}
          branch=${GITHUB_REF_NAME}
          linux=${LINUX_RESULT}
          windows=${WINDOWS_RESULT}
          real_smd_parser=$([[ "$STATUS" == "passed" ]] && echo passed || echo unverified)
          real_n3_character_chain=$([[ "$STATUS" == "passed" ]] && echo passed || echo unverified)
          real_n3_skeleton=$([[ "$STATUS" == "passed" ]] && echo passed || echo unverified)
          real_n3_animation_metadata=$([[ "$STATUS" == "passed" ]] && echo passed || echo unverified)
          real_ntf_texture_decode=$([[ "$STATUS" == "passed" ]] && echo passed || echo unverified)
          generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .validation/content-runtime.txt
          git commit -m "Record content runtime validation [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
