name: PremiumPlusCombo Exact Timed Input
on:
  workflow_dispatch:
  push:
    branches: [premium-plus-combo-timed-input-fix]
    paths:
      - 'premium_plus_combo_final/source/timed_exact/**'
      - '.github/workflows/premium-plus-combo-timed-input-exact.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x64}
      - name: Reconstruct exact reviewed source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force premium_plus_combo_final/timed-exact-build | Out-Null
          @'
          import base64,gzip,pathlib,hashlib
          p=pathlib.Path('premium_plus_combo_final/source/timed_exact')
          parts=sorted(p.glob('part*.txt'))
          if len(parts)!=2: raise SystemExit(f'expected 2 chunks, got {len(parts)}')
          raw=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in parts)))
          sha=hashlib.sha256(raw).hexdigest(); print(sha)
          if sha!='d522959ea955ef788af1df00dfff2dd30bd8566fcbb728823ed39de542d19535': raise SystemExit('source SHA mismatch')
          pathlib.Path('premium_plus_combo_final/timed-exact-build/main.cpp').write_bytes(raw)
          '@ | python -
          if($LASTEXITCODE){throw 'source reconstruction failed'}
          $c=Get-Content premium_plus_combo_final/timed-exact-build/main.cpp -Raw
          foreach($must in @('PreciseDelayUs(1000)','PreciseDelayUs(50)','BridgeSelectiveRouting','MinorReferenceSequenceModel','IsBridgeInputKey(int vk)','kBridgeMappingName')){if(-not $c.Contains($must)){throw "source gate missing $must"}}
          if($c.Contains('bool IsBridgeInputKey(int vk){ return vk>0&&vk<256; }')){throw 'unsafe all-key bridge route present'}
          @'
          #include <windows.h>
          1 VERSIONINFO
           FILEVERSION 4,4,1,0
           PRODUCTVERSION 4,4,1,0
           FILEFLAGSMASK 0x3fL
           FILEFLAGS 0
           FILEOS 0x40004L
           FILETYPE 0x1L
          BEGIN
           BLOCK "StringFileInfo"
           BEGIN
            BLOCK "041F04E6"
            BEGIN
             VALUE "FileDescription", "Premium Plus Combo - Rogue / Attack\0"
             VALUE "FileVersion", "4.4.1.0\0"
             VALUE "ProductName", "Premium Plus Combo\0"
             VALUE "ProductVersion", "4.4.1.0\0"
            END
           END
           BLOCK "VarFileInfo"
           BEGIN
            VALUE "Translation", 0x041F, 1254
           END
          END
          '@ | Set-Content premium_plus_combo_final/timed-exact-build/app.rc -Encoding Ascii
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <assemblyIdentity version="1.0.0.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"/>
            <description>Premium Plus Combo - Rogue</description>
            <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo>
            <application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application>
          </assembly>
          '@ | Set-Content premium_plus_combo_final/timed-exact-build/final.manifest -Encoding UTF8
      - name: Build x64 test and final
        shell: pwsh
        working-directory: premium_plus_combo_final/timed-exact-build
        run: |
          rc /nologo app.rc; if($LASTEXITCODE){throw 'rc failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo-Test.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFESTUAC:"level='asInvoker' uiAccess='false'"
          if($LASTEXITCODE){throw 'test build failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp app.res /Fe:PremiumPlusCombo.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO
          if($LASTEXITCODE){throw 'final build failed'}
          mt.exe -manifest final.manifest "-outputresource:PremiumPlusCombo.exe;#1"; if($LASTEXITCODE){throw 'manifest embed failed'}
      - name: Self test and timed-route gates
        shell: pwsh
        working-directory: premium_plus_combo_final/timed-exact-build
        run: |
          $p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList '--self-test' -Wait -PassThru
          if($p.ExitCode){throw "self-test exit $($p.ExitCode)"}
          $r=Get-Content self-test-report.txt -Raw
          if($r -notmatch 'TOTAL=138' -or $r -notmatch 'PASSED=138' -or $r -match '=FAIL'){Get-Content self-test-report.txt;throw 'self-test failed'}
          foreach($n in @('BridgeSelectiveRouting=PASS','MinorReferenceSequenceModel=PASS','AttackPerSkillBarSlotSequence=PASS','CureSequenceF2_6_F1=PASS')){if($r -notmatch [regex]::Escape($n)){throw "missing $n"}}
      - name: PE manifest and Defender
        shell: pwsh
        working-directory: premium_plus_combo_final/timed-exact-build
        run: |
          mt.exe "-inputresource:PremiumPlusCombo.exe;#1" -out:embedded.manifest; if($LASTEXITCODE){throw 'manifest extract failed'}
          if((Get-Content embedded.manifest -Raw) -notmatch 'requireAdministrator'){throw 'manifest mismatch'}
          dumpbin /headers PremiumPlusCombo.exe | Set-Content headers.txt
          dumpbin /imports PremiumPlusCombo.exe | Set-Content imports.txt
          $h=Get-Content headers.txt -Raw;$i=Get-Content imports.txt -Raw
          if($h -notmatch 'machine \(x64\)'){throw 'not x64'}
          if($h -match 'E0000060'){throw 'RWX section'}
          foreach($b in @('WINHTTP.dll','WININET.dll','WS2_32.dll','VCRUNTIME140.dll','MSVCP140.dll')){if($i -match [regex]::Escape($b)){throw "unexpected import $b"}}
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if(-not(Test-Path $mp)){$mp=Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory|Sort-Object Name -Descending|%{Join-Path $_.FullName 'MpCmdRun.exe'}|?{Test-Path $_}|Select-Object -First 1}
          if(-not $mp){throw 'Defender unavailable'}
          & $mp -Scan -ScanType 3 -File (Resolve-Path .\PremiumPlusCombo.exe) -DisableRemediation
          if($LASTEXITCODE){throw "Defender $LASTEXITCODE"}
          'DefenderScan=PASS'|Set-Content defender-scan.txt
      - name: Report
        shell: pwsh
        working-directory: premium_plus_combo_final/timed-exact-build
        run: |
          $sha=(Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash
          $size=(Get-Item PremiumPlusCombo.exe).Length
          @"
          Product=PremiumPlusCombo
          Version=4.4.1.0
          ReferenceWorkingMinorSHA256=062F1C4C43C97A69C993221383269D37EF4AFCEF9F26130A1387514405165856
          SourceSHA256=D522959EA955EF788AF1DF00DFFF2DD30BD8566FCBB728823ED39DE542D19535
          RootCauseFix=062F_TIMED_SINGLE_EVENT_FALLBACK
          NativeKeyDownHoldUs=1000
          NativePostKeyUpGapUs=50
          BridgeRoute=ONLY_1-0_AND_R
          ZAndF1F12=NATIVE_TIMED_FALLBACK
          MinorBatch=6_EVENTS_QPC_120_240
          SelfTest=138/138 PASS
          DefenderScan=PASS
          SHA256=$sha
          Size=$size
          RealGameVerification=USER_SIDE_REQUIRED
          "@ | Set-Content BUILD-INFO.txt
          Get-Content BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-Windows-x64-062F-TIMED-EXACT
          path: |
            premium_plus_combo_final/timed-exact-build/PremiumPlusCombo.exe
            premium_plus_combo_final/timed-exact-build/main.cpp
            premium_plus_combo_final/timed-exact-build/BUILD-INFO.txt
            premium_plus_combo_final/timed-exact-build/self-test-report.txt
            premium_plus_combo_final/timed-exact-build/defender-scan.txt
            premium_plus_combo_final/timed-exact-build/embedded.manifest
          retention-days: 14
