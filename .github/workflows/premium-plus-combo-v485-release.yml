name: PremiumPlusCombo v4.8.5 Attack Cadence Final
on:
  workflow_dispatch:
  push:
    branches: [premium-plus-combo-cure-attack-vitals-ws]
    paths:
      - 'premium_plus_combo_final/source/vnext_48/v484_to_v485_00.b64'
      - 'premium_plus_combo_final/source/vnext_48/v484_to_v485_01.b64'
      - '.github/workflows/premium-plus-combo-v485-release.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x64}
      - name: Reconstruct exact v4.8.5 source and preservation audit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force premium_plus_combo_final/v485-release | Out-Null
          @'
          import base64,gzip,pathlib,hashlib,subprocess
          r=pathlib.Path('premium_plus_combo_final');o=r/'v485-release';src=r/'source'/'vnext_48';m=o/'main.cpp'
          cs=sorted((r/'source'/'vnext_47').glob('c*.txt'));m.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in cs))))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='e2598a67b26cb0efb4aea05ac4c329d9f4098fcdef645f2e6ef0d5a3ca0f1f07'
          for n,s in [('v47_to_v48.patch.gz.b64',0),('v48_observer_fix2.patch.gz.b64',0),('v481_to_v482.patch.gz.b64',1),('v482_to_v4821.patch.gz.b64',1),('v4821_to_v4822.patch.gz.b64',1)]:
            p=o/(n+'.patch');p.write_bytes(gzip.decompress(base64.b64decode((src/n).read_text().strip())));subprocess.run(['git','apply',f'-p{s}',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='6e857a8a6ccd570d34348dd265ea63e57fe9d3240d9a05447b39a3794fe1cabb'
          (o/'reference-v482.cpp').write_bytes(m.read_bytes())
          pcs=sorted(src.glob('v483_final_c*.txt'));assert len(pcs)==4;p=o/'v483.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='56a57c7a65f5a091be9298f3388c82c4c4097392f96a17bd932e26dd00fcc839'
          pcs=sorted(src.glob('v483_to_v484_[0-9][0-9].b64'));assert len(pcs)==2;p=o/'v484.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='3a2dd16737d825deab01de7af55b1a3ccd81476aad2a4b472d7aaeb1ad07ff0f'
          v484=m.read_bytes();(o/'reference-v484.cpp').write_bytes(v484)
          pcs=sorted(src.glob('v484_to_v485_[0-9][0-9].b64'));assert len(pcs)==2;p=o/'v485.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          sha=hashlib.sha256(m.read_bytes()).hexdigest();print('V485SourceSHA256='+sha.upper());assert sha=='916e2a370c5ed6eecf01e1ba1a3a79cab2dc45c703f781ff1189ecc711989e93'
          a=v484.decode('utf-8');b=m.read_text(encoding='utf-8')
          def fn(s,k):
            p=s.index(k);q=s.index('{',p);d=0
            for i in range(q,len(s)):
              if s[i]=='{':d+=1
              elif s[i]=='}':
                d-=1
                if d==0:return s[p:i+1]
            raise RuntimeError(k)
          for k in ['void CureWorker','void MinorWorker','void RWorker','void VitalsWorker','UINT ReferenceSendInputsUnlocked','UINT ReferenceSendInputs(','bool ReferenceTapKeyUnlocked','bool ReferenceTapKey(','LRESULT CALLBACK KeyboardProc','void CreateRoguePage','void ReadAttackUi']:
            assert fn(a,k)==fn(b,k),'preservation failed '+k
          assert 'int wDelayMs=400;' in b
          assert 'WSTimingProfileV4' in b
          assert 'int WsFirstDelayMs(const WsPendingState& job){return std::clamp(job.w?job.wDelayMs:job.sDelayMs,1,1000);}' in b
          assert 'kPostSkillGuardMs=300' not in b
          aw=fn(b,'void AttackWorker')
          assert 'g_wsPriority' not in aw
          ex=fn(b,'void ExecuteAttack')
          assert 'AttackNeedsBarTap(knownBar,wantedBar)' in ex
          assert 'PreciseDelayUs(30000)' in ex
          assert 'PreciseDelayUs(4000)' in ex
          assert 'g_attackKnownBar=a.restoreBar' in ex
          assert 'InterruptibleAttackDelay(a.delayMs)' in aw
          assert 'int delayMs=125;' in b
          oldpage=fn(a,'void CreateAttackPage')
          newpage=fn(b,'void CreateAttackPage').replace('g_ui.wDelay=Ctrl(L"EDIT",L"400"','g_ui.wDelay=Ctrl(L"EDIT",L"300"')
          assert oldpage==newpage,'Attack UI changed beyond W default'
          print('CoreTransportPreserved=PASS')
          print('MinorPreserved=PASS')
          print('CurePreserved=PASS')
          print('RPreserved=PASS')
          print('ZOptionalPreserved=PASS')
          print('V482CadenceFastPathRestored=PASS')
          print('WSTimingFieldDirect=PASS')
          print('AttackUIDeltaOnlyWDefault=PASS')
          '@ | python -
          if($LASTEXITCODE){throw 'source or preservation audit failed'}
      - name: Build final x64 with preserved elevation manifest
        shell: pwsh
        working-directory: premium_plus_combo_final/v485-release
        run: |
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="4.8.5.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"/><description>Premium Plus Combo - Rogue</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content final.manifest -Encoding UTF8
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp /Fe:PremiumPlusCombo-Test.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT;if($LASTEXITCODE){throw 'test build failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX main.cpp /Fe:PremiumPlusCombo.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO;if($LASTEXITCODE){throw 'final build failed'}
          mt.exe -manifest final.manifest "-outputresource:PremiumPlusCombo.exe;#1";if($LASTEXITCODE){throw 'manifest failed'}
          mt.exe "-inputresource:PremiumPlusCombo.exe;#1" -out:embedded.manifest
          if((Get-Content embedded.manifest -Raw) -notmatch 'requireAdministrator'){throw 'elevation manifest missing'}
      - name: Full regression and cadence tests
        shell: pwsh
        working-directory: premium_plus_combo_final/v485-release
        run: |
          foreach($arg in @('--self-test','--transport-observer-test','--attack-observer-test','--attack-z-off-observer-test','--cure-observer-test')){$p=Start-Process .\PremiumPlusCombo-Test.exe -ArgumentList $arg -Wait -PassThru;if($p.ExitCode){throw "$arg failed"}}
          $s=Get-Content self-test-report.txt -Raw
          foreach($x in @('TOTAL=175','PASSED=175','SkillDefaults_1=PASS','ZDefaultOff=PASS','WSDefaults_400_50=PASS','WSDelayRespects1ms=PASS','WSDelayRespects400ms=PASS','AttackSameBarFastPath=PASS','AttackOrderedThreeSkills=PASS','CureSingleFlightModel=PASS','MinorReferenceSequenceModel=PASS','ScanCodeTransport=PASS')){if($s -notmatch [regex]::Escape($x)){throw "self test missing $x"}}
          $t=Get-Content transport-observer-report.txt -Raw;foreach($x in @('8_Down=24','9_Down=24','0_Down=24','R_Down=24','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($t -notmatch [regex]::Escape($x)){throw "transport missing $x"}}
          $a=Get-Content attack-observer-report.txt -Raw
          foreach($x in @('Z_Down=4','W_Down=1','S_Down=1','Skill2_Down=1','Skill3_Down=1','Skill4_Down=1','Skill5_Down=1','F1_Down=4','F2_Down=1','F3_Down=1','F4_Down=1','RoundRobin=PASS','BarAssertion=PASS','WSNonBlocking=PASS','NoWSBacklog=PASS','WSTiming=PASS','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($a -notmatch [regex]::Escape($x)){throw "attack missing $x"}}
          $span=[int](($a -split "`n"|?{$_ -like 'FastAttackSpanMs=*'}) -replace 'FastAttackSpanMs=','');if($span -ge 250){throw "attack cadence regression $span ms"}
          $wa=[int](($a -split "`n"|?{$_ -like 'WAfterSkillMs=*'}) -replace 'WAfterSkillMs=','');if($wa -lt 380 -or $wa -gt 500){throw "W timing regression $wa ms"}
          $z=Get-Content attack-z-off-observer-report.txt -Raw;foreach($x in @('Z_Down=0','F1_Down=1','Skill2_Down=1','ZOff=PASS','BarAssertion=PASS','Overlap=0','RESULT=PASS')){if($z -notmatch [regex]::Escape($x)){throw "z-off missing $x"}}
          $c=Get-Content cure-observer-report.txt -Raw;foreach($x in @('F2_Down=1','6_Down=1','F1_Down=1','FrameVisibleHold=PASS','ScanCodesNonZero=PASS','Overlap=0','RESULT=PASS')){if($c -notmatch [regex]::Escape($x)){throw "cure missing $x"}}
          dumpbin /headers PremiumPlusCombo.exe | Set-Content headers.txt;dumpbin /imports PremiumPlusCombo.exe | Set-Content imports.txt
          $h=Get-Content headers.txt -Raw;$i=Get-Content imports.txt -Raw;if($h -notmatch 'machine \(x64\)'){throw 'not x64'};if($h -match 'E0000060'){throw 'RWX section found'}
          foreach($bad in @('WINHTTP.dll','WININET.dll','WS2_32.dll','VCRUNTIME140.dll','MSVCP140.dll')){if($i -match [regex]::Escape($bad)){throw "unexpected import $bad"}}
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe";if(-not(Test-Path $mp)){$mp=Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory|Sort-Object Name -Descending|%{Join-Path $_.FullName 'MpCmdRun.exe'}|?{Test-Path $_}|Select-Object -First 1};if($mp){& $mp -Scan -ScanType 3 -File (Resolve-Path .\PremiumPlusCombo.exe) -DisableRemediation;if($LASTEXITCODE){throw 'Defender scan failed'}}
          $sha=(Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash;$size=(Get-Item PremiumPlusCombo.exe).Length
          @"
          Product=PremiumPlusCombo
          Version=4.8.5.0
          SourceSHA256=916E2A370C5ED6EECF01E1BA1A3A79CAB2DC45C703F781FF1189ECC711989E93
          ReferenceV482SourceSHA256=6E857A8A6CCD570D34348DD265EA63E57FE9D3240D9A05447B39A3794FE1CABB
          ReferenceV484SourceSHA256=3A2DD16737D825DEAB01DE7AF55B1A3CCD81476AAD2A4B472D7AAEB1AD07FF0F
          ExistingStructurePreserved=PASS
          RequireAdministratorManifest=PASS
          MinorPreserved=PASS
          CurePreserved=PASS
          RPreserved=PASS
          FIFOScanCodeTransportPreserved=PASS
          ZOptionalOnOff=PASS
          AttackBarSmartAssertion=PASS
          AttackSameBarRepeatTapRemoved=PASS
          AttackLoopDefaultMs=125
          SkillDefaultMs=1
          WDefaultMs=400
          SDefaultMs=50
          WSTimingFieldDirect=PASS
          WSSchedulerDoesNotPauseAttack=PASS
          FastAttackSpanMs=$span
          WAfterSkillMs=$wa
          SelfTest=175/175 PASS
          TransportObserver=PASS
          AttackObserver=PASS
          ZOffObserver=PASS
          CureObserver=PASS
          Overlap=0
          EXESHA256=$sha
          Size=$size
          RealGameVerification=USER_SIDE_REQUIRED
          "@ | Set-Content BUILD-INFO.txt
          Get-Content BUILD-INFO.txt
          Get-Content attack-observer-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-v4.8.5-ATTACK-CADENCE-FINAL
          path: |
            premium_plus_combo_final/v485-release/PremiumPlusCombo.exe
            premium_plus_combo_final/v485-release/main.cpp
            premium_plus_combo_final/v485-release/BUILD-INFO.txt
            premium_plus_combo_final/v485-release/self-test-report.txt
            premium_plus_combo_final/v485-release/transport-observer-report.txt
            premium_plus_combo_final/v485-release/attack-observer-report.txt
            premium_plus_combo_final/v485-release/attack-z-off-observer-report.txt
            premium_plus_combo_final/v485-release/cure-observer-report.txt
            premium_plus_combo_final/v485-release/embedded.manifest
            premium_plus_combo_final/v485-release/headers.txt
            premium_plus_combo_final/v485-release/imports.txt
          retention-days: 14
