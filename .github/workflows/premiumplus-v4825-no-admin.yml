name: PremiumPlus v4.8.25 NO ADMIN

on:
  push:
    branches: [ fix/premiumplus-v4825-no-admin-20260910 ]
    paths:
      - '.github/workflows/premiumplus-v4825-no-admin.yml'
      - 'premium_plus_combo_final/workbench/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate exact source and run static gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python premium_plus_combo_final/workbench/build_v4825_final_source.py
          if($LASTEXITCODE){throw 'v4.8.25 source build failed'}
          python premium_plus_combo_final/workbench/audit_v4825_static.py
          if($LASTEXITCODE){throw 'v4.8.25 static audit failed'}
          python premium_plus_combo_final/workbench/v4825_mob_ui_scenario_tests.py
          if($LASTEXITCODE){throw 'v4.8.25 MOB/UI scenario tests failed'}
          $ui=Get-Content premium_plus_combo_final/workbench/v4825-mob-ui-scenario-report.txt -Raw
          if($ui -notmatch 'TOTAL=20' -or $ui -notmatch 'PASSED=20'){throw '20/20 MOB/UI gate failed'}
          python premium_plus_combo_final/workbench/v4825_attack_sideinput_tests.py
          if($LASTEXITCODE){throw 'ATTACK/side-input tests failed'}
          $side=Get-Content premium_plus_combo_final/workbench/v4825-attack-sideinput-report.txt -Raw
          if($side -notmatch 'TOTAL=13' -or $side -notmatch 'PASSED=13'){throw '13/13 ATTACK/side-input gate failed'}

      - name: Build no-admin release and verify manifest
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          @'
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="4.8.11.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"></assemblyIdentity><description>Premium Plus Combo - Rogue</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"></requestedExecutionLevel></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content control.manifest -Encoding UTF8
          @'
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="4.8.25.0" processorArchitecture="amd64" name="PremiumPlusCombo" type="win32"></assemblyIdentity><description>Premium Plus Combo - Rogue</description><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="asInvoker" uiAccess="false"></requestedExecutionLevel></requestedPrivileges></security></trustInfo><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true/pm</dpiAware><dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness></windowsSettings></application></assembly>
          '@ | Set-Content release.manifest -Encoding UTF8
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX makro2_v4811_exact.cpp /Fe:PremiumPlusCombo-v4.8.11-CONTROL.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO
          if($LASTEXITCODE){throw 'control compile failed'}
          mt.exe -nologo -manifest control.manifest "-outputresource:PremiumPlusCombo-v4.8.11-CONTROL.exe;#1"
          if($LASTEXITCODE){throw 'control manifest failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /utf-8 /DNOMINMAX premiumplus_v4825_final.cpp /Fe:PremiumPlusCombo-v4.8.25-NO-ADMIN.exe user32.lib gdi32.lib advapi32.lib winmm.lib /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /MANIFEST:NO
          if($LASTEXITCODE){throw 'release compile failed'}
          mt.exe -nologo -manifest release.manifest "-outputresource:PremiumPlusCombo-v4.8.25-NO-ADMIN.exe;#1"
          if($LASTEXITCODE){throw 'release manifest failed'}
          Copy-Item PremiumPlusCombo-v4.8.25-NO-ADMIN.exe PremiumPlusCombo-v4.8.25-FINAL.exe -Force
          python audit_v4825_pe.py
          if($LASTEXITCODE){throw 'PE/import audit failed'}
          mt.exe -nologo -inputresource:PremiumPlusCombo-v4.8.25-NO-ADMIN.exe`;#1 -out:embedded.manifest
          if($LASTEXITCODE){throw 'embedded manifest extract failed'}
          $manifest=Get-Content embedded.manifest -Raw
          if($manifest -notmatch 'requestedExecutionLevel level="asInvoker"'){throw 'asInvoker missing from embedded manifest'}
          if($manifest -match 'requireAdministrator'){throw 'administrator requirement still present'}
          Write-Host 'EMBEDDED_MANIFEST_AS_INVOKER=PASS'

      - name: Verify Minor timing and CPU load
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          $p=Start-Process .\PremiumPlusCombo-v4.8.25-NO-ADMIN.exe -ArgumentList '--minor-timing-test' -Wait -PassThru
          if($p.ExitCode){if(Test-Path minor-timing-report.txt){Get-Content minor-timing-report.txt};throw 'Minor timing test failed'}
          $timing=Get-Content minor-timing-report.txt -Raw
          if($timing -notmatch 'Cadence=PASS' -or $timing -notmatch 'RESULT=PASS'){throw 'Minor cadence gate failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc minor_cpu_benchmark.cpp /Fe:minor-cpu-benchmark.exe winmm.lib
          if($LASTEXITCODE){throw 'Minor CPU benchmark compile failed'}
          .\minor-cpu-benchmark.exe
          if($LASTEXITCODE){if(Test-Path minor-cpu-benchmark-report.txt){Get-Content minor-cpu-benchmark-report.txt};throw 'Minor CPU benchmark failed'}
          $cpu=Get-Content minor-cpu-benchmark-report.txt -Raw
          if($cpu -notmatch 'Cadence=PASS' -or $cpu -notmatch 'LowCpu=PASS' -or $cpu -notmatch 'RESULT=PASS'){throw 'Minor CPU gate failed'}
          Get-Content minor-timing-report.txt
          Get-Content minor-cpu-benchmark-report.txt

      - name: Run executable regression suite
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          $p=Start-Process .\PremiumPlusCombo-v4.8.25-NO-ADMIN.exe -ArgumentList '--self-test' -Wait -PassThru
          if($p.ExitCode){throw 'legacy executable test failed'}
          $r=Get-Content self-test-report.txt -Raw
          if($r -notmatch 'TOTAL=180' -or $r -notmatch 'PASSED=180'){throw '180/180 legacy failed'}
          $p=Start-Process .\PremiumPlusCombo-v4.8.25-NO-ADMIN.exe -ArgumentList '--mob-model-test' -Wait -PassThru
          if($p.ExitCode){throw 'MOB model test failed'}
          $r=Get-Content mob-model-test-report.txt -Raw
          if($r -notmatch 'TOTAL=20' -or $r -notmatch 'PASSED=20'){throw '20/20 MOB failed'}
          $p=Start-Process .\PremiumPlusCombo-v4.8.25-NO-ADMIN.exe -ArgumentList '--warrior-model-test' -Wait -PassThru
          if($p.ExitCode){throw 'Warrior model test failed'}
          $r=Get-Content warrior-model-test-report.txt -Raw
          if($r -notmatch 'TOTAL=26' -or $r -notmatch 'PASSED=26'){throw '26/26 Warrior failed'}
          Write-Host 'LEGACY=180/180 PASS';Write-Host 'MOB=20/20 PASS';Write-Host 'WARRIOR=26/26 PASS'

      - name: Run selector and Windows input scenarios
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $ErrorActionPreference='Stop'
          python mob_selector_scenario_model.py
          if($LASTEXITCODE){throw 'selector scenario model failed'}
          $r=Get-Content mob-selector-scenario-report.txt -Raw
          if($r -notmatch 'TOTAL=48' -or $r -notmatch 'PASSED=48'){throw '48/48 selector failed'}
          cl /nologo /std:c++17 /O2 /MT /EHsc /DUNICODE /D_UNICODE mob_selector_manual_click_test.cpp /Fe:mob-selector-manual-click-test.exe user32.lib gdi32.lib /link /SUBSYSTEM:WINDOWS
          if($LASTEXITCODE){throw 'manual mouse harness compile failed'}
          $p=Start-Process .\mob-selector-manual-click-test.exe -Wait -PassThru
          if($p.ExitCode){throw 'real mouse harness failed'}
          $m=Get-Content mob-selector-manual-click-report.txt -Raw
          if($m -notmatch 'TOTAL=9' -or $m -notmatch 'PASSED=9'){throw '9/9 real mouse failed'}

      - name: Defender diagnostic
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        continue-on-error: true
        run: |
          $mp="$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if(Test-Path $mp){
            & $mp -SignatureUpdate 2>&1 | Out-Null
            & $mp -Scan -ScanType 3 -File (Resolve-Path .\PremiumPlusCombo-v4.8.25-NO-ADMIN.exe) 2>&1 | Tee-Object defender-scan.txt
          } else {
            'DEFENDER_UNAVAILABLE' | Set-Content defender-scan.txt
          }

      - name: Write report
        shell: pwsh
        working-directory: premium_plus_combo_final/workbench
        run: |
          $sha=(Get-FileHash .\PremiumPlusCombo-v4.8.25-NO-ADMIN.exe -Algorithm SHA256).Hash
          $src=(Get-FileHash .\premiumplus_v4825_final.cpp -Algorithm SHA256).Hash
          $timing=Get-Content .\minor-timing-report.txt -Raw
          $cpuReport=Get-Content .\minor-cpu-benchmark-report.txt -Raw
          $hz=([regex]::Match($timing,'MeasuredHz=([^\r\n]+)')).Groups[1].Value
          $cpu=([regex]::Match($cpuReport,'ThreadCpuPct=([^\r\n]+)')).Groups[1].Value
          $def='UNAVAILABLE_OR_SKIPPED'
          if(Test-Path defender-scan.txt){$d=Get-Content defender-scan.txt -Raw;if($d -match 'found no threats'){$def='NO_THREATS'}elseif($d -match 'Threat'){$def='SEE_DEFENDER_LOG'}}
          @(
            'Product=PremiumPlusCombo',
            'Version=4.8.25-minor-cpu-hotfix-no-admin',
            'Base=v4.8.25 MINOR CPU HOTFIX',
            'ExecutionLevel=asInvoker',
            'AdministratorPromptRemoved=PASS',
            "SourceSHA256=$src",
            "EXE_SHA256=$sha",
            'StableCorePreserved=PASS',
            'ExactImportSurfaceVsV4811=PASS',
            'LegacySelfTest=180/180 PASS',
            'MobModelTest=20/20 PASS',
            'WarriorModelTest=26/26 PASS',
            'MobSelectorScenario=48/48 PASS',
            'RealWindowsMouseSelect=9/9 PASS',
            'MobUiRuntimeScenario=20/20 PASS',
            'AttackSideInputScenario=13/13 PASS',
            'MinorTargetMaximumHz=120',
            'MinorTargetTurboHz=240',
            "MinorMeasuredTurboHz=$hz",
            "MinorBenchmarkThreadCpuPct=$cpu",
            'MinorCadenceGate=PASS',
            'MinorLowCpuGate=PASS',
            'PESectionAndDllCharacteristics=PASS',
            "DefenderDiagnostic=$def"
          ) | Set-Content PremiumPlusCombo-v4.8.25-NO-ADMIN-REPORT.txt
          Get-Content PremiumPlusCombo-v4.8.25-NO-ADMIN-REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlus-v4.8.25-NO-ADMIN
          if-no-files-found: error
          retention-days: 90
          path: |
            premium_plus_combo_final/workbench/PremiumPlusCombo-v4.8.25-NO-ADMIN.exe
            premium_plus_combo_final/workbench/PremiumPlusCombo-v4.8.25-NO-ADMIN-REPORT.txt
            premium_plus_combo_final/workbench/embedded.manifest
            premium_plus_combo_final/workbench/minor-timing-report.txt
            premium_plus_combo_final/workbench/minor-cpu-benchmark-report.txt
            premium_plus_combo_final/workbench/self-test-report.txt
            premium_plus_combo_final/workbench/mob-model-test-report.txt
            premium_plus_combo_final/workbench/warrior-model-test-report.txt
            premium_plus_combo_final/workbench/mob-selector-scenario-report.txt
            premium_plus_combo_final/workbench/mob-selector-manual-click-report.txt
            premium_plus_combo_final/workbench/v4825-mob-ui-scenario-report.txt
            premium_plus_combo_final/workbench/v4825-attack-sideinput-report.txt
            premium_plus_combo_final/workbench/import-audit.txt
            premium_plus_combo_final/workbench/defender-scan.txt