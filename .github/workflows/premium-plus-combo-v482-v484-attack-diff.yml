name: PremiumPlusCombo v4.8.2 vs v4.8.4 Attack Diff
on:
  workflow_dispatch:
  push:
    branches: [premium-plus-combo-cure-attack-vitals-ws]
    paths:
      - '.github/workflows/premium-plus-combo-v482-v484-attack-diff.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact sources and diff attack path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force premium_plus_combo_final/attack-diff | Out-Null
          @'
          import base64,gzip,pathlib,hashlib,subprocess,difflib
          r=pathlib.Path('premium_plus_combo_final');o=r/'attack-diff';src=r/'source'/'vnext_48'
          cs=sorted((r/'source'/'vnext_47').glob('c*.txt'))
          base=gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in cs)))
          assert hashlib.sha256(base).hexdigest()=='e2598a67b26cb0efb4aea05ac4c329d9f4098fcdef645f2e6ef0d5a3ca0f1f07'
          m=o/'main.cpp';m.write_bytes(base)
          for n,s in [('v47_to_v48.patch.gz.b64',0),('v48_observer_fix2.patch.gz.b64',0),('v481_to_v482.patch.gz.b64',1),('v482_to_v4821.patch.gz.b64',1),('v4821_to_v4822.patch.gz.b64',1)]:
            p=o/(n+'.patch');p.write_bytes(gzip.decompress(base64.b64decode((src/n).read_text().strip())));subprocess.run(['git','apply',f'-p{s}',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='6e857a8a6ccd570d34348dd265ea63e57fe9d3240d9a05447b39a3794fe1cabb'
          v482=m.read_bytes();(o/'v482-main.cpp').write_bytes(v482)
          pcs=sorted(src.glob('v483_final_c*.txt'));assert len(pcs)==4
          p=o/'v483.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='56a57c7a65f5a091be9298f3388c82c4c4097392f96a17bd932e26dd00fcc839'
          pcs=sorted(src.glob('v483_to_v484_[0-9][0-9].b64'));assert len(pcs)==2
          p=o/'v484.patch';p.write_bytes(gzip.decompress(base64.b64decode(''.join(x.read_text().strip() for x in pcs))));subprocess.run(['git','apply','-p0',p.name],cwd=o,check=True);m.write_bytes(m.read_bytes().replace(b'\r\n',b'\n'))
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='3a2dd16737d825deab01de7af55b1a3ccd81476aad2a4b472d7aaeb1ad07ff0f'
          v484=m.read_bytes();(o/'v484-main.cpp').write_bytes(v484)
          def fn(s,k):
            p=s.index(k);q=s.index('{',p);d=0
            for i in range(q,len(s)):
              if s[i]=='{':d+=1
              elif s[i]=='}':
                d-=1
                if d==0:return s[p:i+1]
            raise RuntimeError(k)
          a=v482.decode('utf-8');b=v484.decode('utf-8')
          keys=['struct AttackSettings','void ClampAttackSettings','void LoadAttack','void SaveAttack','void ReadAttackUi','bool AttackWaitUntil','bool InterruptibleAttackDelayFrom','void MaybeSendWsCombo','void WsWorker','void ExecuteAttack','void AttackWorker','void CreateAttackPage']
          out=[]
          for k in keys:
            try: aa=fn(a,k)
            except Exception: aa='[missing in v482]'
            try: bb=fn(b,k)
            except Exception: bb='[missing in v484]'
            out.append('\n===== '+k+' =====\n')
            out.extend(difflib.unified_diff(aa.splitlines(True),bb.splitlines(True),fromfile='v482',tofile='v484'))
          (o/'attack-diff.txt').write_text(''.join(out),encoding='utf-8')
          print('V482='+hashlib.sha256(v482).hexdigest())
          print('V484='+hashlib.sha256(v484).hexdigest())
          '@ | python -
          if($LASTEXITCODE){throw 'inspection reconstruction failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-v482-v484-attack-diff
          path: |
            premium_plus_combo_final/attack-diff/v482-main.cpp
            premium_plus_combo_final/attack-diff/v484-main.cpp
            premium_plus_combo_final/attack-diff/attack-diff.txt
          retention-days: 2
